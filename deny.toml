# cargo-deny policy: licences, RustSec advisories, banned crates, and sources.
# The product allows MIT- or Apache-2.0-compatible dependencies (PRODUCT.md). MPL-2.0 is
# allowed too: rhai uses smartstring (MPL-2.0+), used unmodified.

[graph]
all-features = true

[advisories]
# Any RustSec vulnerability fails the check; unmaintained and yanked crates only warn.
unmaintained = "workspace"
yanked = "warn"

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace crates are not published.
ignore = true

[bans]
multiple-versions = "warn"
# The workspace crates depend on each other by path, and they are not published.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
