[workspace]
resolver = "3"
members = [
    "crates/engine",
    "crates/engine-cli",
    "crates/protocol",
    "crates/script",
    "crates/stream",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.87"
repository = ""

[workspace.dependencies]
glam = "0.33"
rand = "0.10"
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
garde = { version = "0.23", default-features = false, features = ["derive"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
criterion = "0.8"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
boon = "0.6.1"
rhai = { version = "1.26", features = ["sync"] }

[profile.release]
debug = 1
