name: PR Checks

# The light checks for every pull request. Heavy runs (the ignored slow tests and the
# calibrate suite) stay on the owner's machine or the build server, and so do the
# full-match contract tests listed in SKIP_FULL_MATCH.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - ".ai/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# These full-match tests (contract_checks, phase_machine and plugin_hooks) are skipped
# on the hosted runner for time. A plain cargo test still runs them locally.
env:
  SKIP_FULL_MATCH: >-
    --skip a_stand_in_in_each_slot_keeps_every_other_key_and_the_events
    --skip every_optional_slot_off_at_once_plays_a_batch_the_validator_accepts
    --skip every_optional_slot_switched_off_plays_a_batch_the_validator_accepts
    --skip every_stand_in_keeps_one_owner_per_key_and_a_complete_card
    --skip the_swap_comparison_finds_a_changed_module
    --skip a_planted_undeclared_step_fails_the_validator
    --skip an_illegal_position_at_a_restart_fails_naming_the_phase_the_player_and_the_position
    --skip counted_video_reviews_add_their_price
    --skip every_change_of_phase_in_the_batch_is_declared_and_every_row_is_reached
    --skip in_debug_mode_every_restart_passes_the_position_check
    --skip only_the_phase_machine_writes_the_phase
    --skip pricing_video_reviews_changes_no_added_time
    --skip restart_position_report
    --skip restart_position_report_wide
    --skip restart_position_sweep
    --skip a_hook_that_keeps_or_fails_leaves_the_native_choice_and_a_failure_is_recorded
    --skip a_switched_off_hook_slot_never_calls_its_hook
    --skip the_decision_hook_turns_the_carriers_choice_into_the_option_it_favours
    --skip the_offsets_are_cached_for_the_carrier_until_the_refresh_interval_passes
    --skip the_rule_hook_replaces_the_referees_card_and_keep_leaves_it

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: fmt
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Fetch every crate
        run: cargo fetch --locked
      - name: Engine tests (ignored and full-match tests excluded)
        run: cargo test --workspace --locked -- $SKIP_FULL_MATCH

  # A match saved by the previous release finishes on that release's engine, built from its
  # tag (packaging/previous-engine.json), with the result the previous build reaches.
  previous-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Fetch every crate
        run: cargo fetch --locked
      - name: Fetch the previous release's tag
        run: |
          echo "SM_PREVIOUS_CACHE=$RUNNER_TEMP/previous-engine" >> "$GITHUB_ENV"
          tag=$(jq -r .tag packaging/previous-engine.json)
          git fetch --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
      - name: Restore the previous engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/previous-engine/previous
          key: previous-engine-notices-${{ runner.os }}-${{ hashFiles('packaging/previous-engine.json', 'rust-toolchain.toml', 'viewer/scripts/notices.mjs', 'packaging/notices/clarify.json') }}
      - name: Build the previous engine from its tag
        run: sh packaging/unix/previous-engine.sh
      - name: A previous release's save finishes on its engine
        run: |
          export SM_PREVIOUS_ENGINE_PATH="$SM_PREVIOUS_CACHE/previous/engine-cli"
          cargo test --locked -p engine-cli --test previous_engine -- --ignored

  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: viewer/package.json
      # The build writes the open-source notices, which read the engine's crates from
      # `cargo metadata`; every crate is fetched first.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Fetch every crate
        working-directory: .
        run: cargo fetch --locked
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: The notices list every shipped package with an allowed licence and its text
        run: npm run notices:verify -- dist/notices.json
      - name: Logic and component tests
        run: npx vitest run
      - name: Token scan
        run: npm run scan
      - name: Contrast check
        run: npm run contrast

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: llvm-tools-preview
      - name: Fetch every crate
        run: cargo fetch --locked
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov
      - name: coverage
        run: cargo llvm-cov --workspace --locked --fail-under-lines 78 -- $SKIP_FULL_MATCH

  commit-convention:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: crate-ci/committed@faeed42f2e10c244533a01525f13c4d8b6ce383f # v1.1.11
        with:
          # Merge commits are allowed (the repository merges with merge commits); committed
          # skips them.
          args: "-vv"
          commits: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  npm-audit-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: e2e/package.json
      - name: npm audit (e2e)
        working-directory: e2e
        run: npm audit --audit-level=high
      - name: npm audit (viewer)
        working-directory: viewer
        run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The action lists the pull request's commits, which needs read access to pull requests.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep
        # temp-dir is skipped: every flagged std::env::temp_dir use is in #[cfg(test)] code.
        run: semgrep scan --config p/rust --config p/javascript --exclude-rule rust.lang.security.temp-dir.temp-dir --error

  content-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: A content change needs a Content entry in CHANGELOG.md
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          content=$(printf '%s\n' "$changed" | grep -E '^content/(rules/|teams/|tuning\.json|attributes\.json|tactics\.json)' || true)
          if [ -z "$content" ]; then
            echo "No player-facing content changed."
            exit 0
          fi
          echo "Content files changed:"
          printf '%s\n' "$content"
          if ! printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::Content changed, but CHANGELOG.md did not. Add an entry under 'Content' in the Unreleased section."
            exit 1
          fi

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Fetch every crate
        run: cargo fetch --locked
      - name: Build
        shell: pwsh
        run: |
          if ($env:RUSTFLAGS) { throw "RUSTFLAGS is set ('$env:RUSTFLAGS'); it would override the static C runtime in .cargo/config.toml" }
          cargo build --release --locked -p engine-cli
      - name: The program links the C runtime statically
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $imports = & $dumpbin /dependents target\release\engine-cli.exe
          $imports
          if ($imports -match '(?i)vcruntime\d*\.dll|msvcp\d*\.dll') { throw 'engine-cli.exe imports the Visual C++ runtime; the static C runtime is missing' }
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Engine tests (ignored and full-match tests excluded)
        shell: bash
        run: cargo test --workspace --locked -- $SKIP_FULL_MATCH

  # The replay gate on the pinned images: a release build plays the 22 gate matches against
  # the committed golden file, and both images must match its one portable hash set. The
  # Linux leg also checks every commit's change to the golden file.
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Fetch every crate
        run: cargo fetch --locked
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:RUSTFLAGS) { throw "RUSTFLAGS is set ('$env:RUSTFLAGS'); it would override the static C runtime in .cargo/config.toml" }
          cargo build --release --locked -p engine-cli
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --locked -p engine-cli
      - name: Golden-file history check
        if: runner.os == 'Linux'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./target/release/engine-cli guard --base "$BASE" --head "$HEAD"
      - name: Replay gate
        run: ./target/release/engine-cli gate
      - name: The fast-model fit matches the golden results
        run: ./target/release/engine-cli fast-model stale
