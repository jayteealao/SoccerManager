[package]
name = "regen-faces-poc"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Proofs of concept for regen faces that age. Not production code."

# Standalone: this crate is its own workspace and never joins the engine's.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.33"
png = "0.18"

[profile.dev]
opt-level = 2

[profile.release]
debug = false
