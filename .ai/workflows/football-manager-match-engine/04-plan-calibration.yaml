  - { path: "crates/engine-cli/src/main.rs", status: modified, role: cli, module: cli, loc: 52, delta: { add: 3, rem: 0 }, planned_change: { intent: "mod calibrate; mod report; dispatch Command::Calibrate." } }
  - { path: "crates/engine-cli/src/calibrate/mod.rs", status: new, role: cli, module: calibrate, loc: 200, delta: { add: 200, rem: 0 }, planned_change: { intent: "Parent: plans fixtures, creates runs/<run.id>/, spawns jobs worker processes of the same binary, waits, times each suite, runs the single-thread benchmark on an idle machine, aggregates through report::RunBuilder, prunes events per retention, writes report.json, prints the record, exits 0 when every band, dark path, and the time budget pass, else 2." } }
  - { path: "crates/engine-cli/src/calibrate/fixtures.rs", status: new, role: cli, module: calibrate, loc: 120, delta: { add: 120, rem: 0 }, planned_change: { intent: "League k = generate_league(seed + k, 20); double round-robin of 380 fixtures per league; equal suite takes fixtures in order; strength suite boosts one club's every attribute by 1.15 (rounded, clamped 1..100) and alternates it home and away; match seed = splitmix64(seed, suite, index); shard(k, n) is index modulo n." } }
  - { path: "crates/engine-cli/src/calibrate/worker.rs", status: new, role: cli, module: calibrate, loc: 150, delta: { add: 150, rem: 0 }, planned_change: { intent: "Worker: for each fixture in its shard builds MatchConfig with the computer manager on both sides, runs into a VecSink, runs the validator, writes stats/<match.id>.json and events/<match.id>.jsonl under the run folder; a failed match writes a match-stats record with outcome failure and error.type." } }
  - { path: "crates/engine-cli/src/report/mod.rs", status: new, role: observability, module: report, loc: 220, delta: { add: 220, rem: 0 }, planned_change: { intent: "RunBuilder: folds every match-stats record into per-suite aggregates (mean and sd of goals per match, mean shots per team, mean possession per side, share of matches in band, stronger-team win, draw, loss); band checks against the loaded bands; dark-path counters; outlier predicate; pure functions with unit tests." } }
