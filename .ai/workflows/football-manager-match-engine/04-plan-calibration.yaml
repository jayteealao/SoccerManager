  - { path: "crates/engine/src/tuning.rs", status: modified, role: domain, module: engine, loc: 250, delta: { add: 18, rem: 0 }, planned_change: { intent: "XgTuning { intercept, distance_coef, angle_coef } with garde ranges; Tuning::default mirrors content/tuning.json." } }
  - { path: "crates/engine/src/snapshot.rs", status: modified, role: domain, module: engine, loc: 790, delta: { add: 20, rem: 4 }, planned_change: { intent: "encode_summary and decode_summary carry the new Summary fields; snapshot format version rises by one so a file from before is refused by version, not misread." } }
  - { path: "crates/engine/src/observe/mod.rs", status: modified, role: observability, module: observe, loc: 470, delta: { add: 70, rem: 0 }, planned_change: { intent: "MatchStats gains a flattened MatchFigures block (stats.goals, stats.shots, stats.shots_on_target, stats.xg, stats.passes, stats.pass_accuracy_pct, stats.possession_pct, darkpath.change_never_applied, manager.kind) with serde default for older files; CalibrationReport record (run-report, operation calibrate); write_stats_at(dir, stats) for the run folder." } }
  - { path: "crates/engine/tests/match_stats.rs", status: new, role: test, module: engine-tests, loc: 120, delta: { add: 120, rem: 0 }, planned_change: { intent: "Scenario scenes: a shot increments shots and adds xg in (0,1); a pass received by a team-mate increments passes_completed; possession percentages of both teams sum to 100 within 0.1 over a full seeded match." } }
