files:
  - { path: "schemas/observability/match-event.schema.json", status: new, role: contract, module: schemas, loc: 90, delta: { add: 90, rem: 0 }, planned_change: { intent: "JSON Schema draft 2020-12 for the match-event record: envelope keys required (record.kind const match-event, schema.version const \"1\", owner.id, service, version, build.hash, env, operation), match.id, tick, minute, event.type enum from the contract, optional team.id, player.id, player.secondary_id, card.kind, foul.advantage, minute.added, added_time.s; additionalProperties true so additive extras pass." } }
  - { path: "schemas/observability/match-stats.schema.json", status: new, role: contract, module: schemas, loc: 130, delta: { add: 130, rem: 0 }, planned_change: { intent: "match-stats record: envelope, correlation (match.id, owner.id, seed), outcome, the nine per-team statistics as two-element arrays (stats.possession_pct, stats.shots, stats.shots_on_target, stats.xg, stats.passes, stats.pass_accuracy_pct, stats.fouls, stats.corners, stats.offsides) plus stats.goals, darkpath.change_never_applied, rules.pack_version, validate.violations." } }
  - { path: "schemas/observability/run-report.schema.json", status: new, role: contract, module: schemas, loc: 150, delta: { add: 150, rem: 0 }, planned_change: { intent: "run-report record with an if/then on operation: benchmark requires the bench.* keys the current bench writes; calibrate requires run.id, seed, calib.matches, calib.suites (equal, strength) with aggregates and band checks, darkpath.change_never_applied, darkpath.match_without_stats, calib.wall_ms, bench.match_wall_ms, bench.cpu_us_per_tick, machine.hash, events.files_written, events.files_kept." } }
  - { path: "content/realism-bands.json", status: new, role: data, module: content, loc: 20, delta: { add: 20, rem: 0 }, planned_change: { intent: "schema_version 1; goals_per_match 2.4-3.2; shots_per_team 8-16; possession_pct 35-65; stronger_team_win_rate > 0.50 at attribute_boost 1.15; sample_size 1000; run_wall_minutes < 30. One source for the harness, the dashboard, and the audit." } }
  - { path: "content/tuning.json", status: modified, role: data, module: content, loc: 140, delta: { add: 8, rem: 6 }, planned_change: { intent: "engine block gains xg { intercept, distance_coef, angle_coef }; the tuning pass changes shot, keeper, pressing, and foul knobs within their garde ranges; every change logged in the iteration log." } }
