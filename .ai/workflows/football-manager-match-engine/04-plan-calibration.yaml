risks:
  - { title: "The bands are not reachable with the decision model the tactics slice ships", severity: high, body: "Goals, shots, and possession come from mechanisms this slice does not own; tuning moves only the knobs the tuning file exposes.", mitigation: "Iteration protocol with a 12-iteration cap on 200-match runs, one knob group per iteration; a miss is recorded as an open tuning item routed to the feature-flags work with the measured distance; the bands are never widened." }
  - { title: "The plan is written before the tactics slice is planned or built", severity: high, body: "The computer-manager switch, the change-queue counters, and any shot or pass counter are assumptions drawn from the tactics slice definition.", mitigation: "Step 1 re-reads the landed seams and stops for a plan re-review if any differs; counters are reused, never duplicated." }
  - { title: "The stronger team does not win more than half of its matches", severity: medium, body: "A win excludes draws; with about a quarter of matches drawn, a 15 percent attribute gap must move the win rate strongly.", mitigation: "Attribute-driven knobs (tackle win chance, shot accuracy, pass lane scoring) are in the tuning protocol; the report records win, draw, and loss so the distance is visible." }
  - { title: "Schema files drift from the serde structs", severity: medium, body: "The contract names drift as its top risk once slices ship in parallel.", mitigation: "The default test run validates real simulate and calibrate output against the schema files with an independent validator, not against the structs." }
  - { title: "Worker memory from in-memory tick records", severity: low, body: "The validator needs every tick; about 60 MB per worker at 8 workers.", mitigation: "Records are dropped after each match; the reference machine has 61 GB; --jobs caps the worker count." }
