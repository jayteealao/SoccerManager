files:
  - { path: "crates/engine/src/tuning.rs", status: modified, role: config, module: tuning, loc: 563, delta: { add: 70, rem: 4 }, planned_change: { intent: "DecisionWeights gains carry_s (0 to 5 s) and carry_cost (0 to 5), each serde default 0.0 so an older file plays as today. A new optional block clearances (serde default, garde dive) holds aim_spread (0 to 1.6 rad, default 0.6, the constant hard-set today) and the cross clearance values cross_reach, cross_chance, cross_speed, cross_spread and cross_loft (cross_chance default 0.0, off). The RestartDelays default mirrors the new content values. TUNING_VERSION stays 2." } }
  - { path: "content/tuning.json", status: modified, role: config, module: tuning, loc: 198, delta: { add: 12, rem: 4 }, planned_change: { intent: "restart_delay_s throw_in 13.8, goal_kick 23.2, corner 31.8, free_kick 32.5 (the sourced medians); kick_off, penalty and drop_ball unchanged. The carry values and the clearances block at their starting values, then at the values the tuning loop chooses, each inside its bounds." } }
  - { path: "crates/engine/src/decision.rs", status: modified, role: domain, module: decide, loc: 803, delta: { add: 25, rem: 6 }, planned_change: { intent: "Kick gains a Clear variant. options(): while the carrier has held the ball for less than carry_s and no opponent is within 2.5 m, carry_cost is subtracted from the pass and the clearance scores (a shot is exempt; no draw is added). Choice::Clear returns Kick::Clear with the aim spread read from clearances.aim_spread. Every agent still decides every tick." } }
  - { path: "crates/engine/src/sim.rs", status: modified, role: domain, module: play, loc: 1399, delta: { add: 90, rem: 8 }, planned_change: { intent: "Summary gains clearances, restart_kicks (per team) and live_ticks. kick_ball counts an open-play pass in passes and tracks its completion; a clearance in clearances; the first kick of a restart taker in restart_kicks (a shot stays a shot). live_ticks counts every open-play tick outside the shoot-out. A fast open-play pass inside the defending side's penalty area under reach height can be cleared: each defending outfield player within cross_reach rolls once per flight (a referee draw); a clearance deflects the ball with shot::deflect, the defending side is the last touch, the pass is not completed, and it counts as a clearance. The existing out-of-play rule then gives a corner only when the ball crosses the goal line (RIM-9)." } }
  - { path: "crates/engine/src/rules/mod.rs", status: modified, role: domain, module: play, loc: 1098, delta: { add: 12, rem: 2 }, planned_change: { intent: "take_restart marks the restart taker so his first kick counts as a restart kick; the mark and the cross-clearance mask are cleared wherever pass_in_flight is cleared at a dead ball." } }
  - { path: "crates/engine/src/rules/restart.rs", status: modified, role: domain, module: play, loc: 509, delta: { add: 0, rem: 0 }, planned_change: { intent: "No code change expected: delay_ticks already reads restart_delay_s and the hard limit stays three times the delay. Listed because the longer delays pass through it." } }
  - { path: "crates/engine/src/snapshot.rs", status: modified, role: contract, module: records, loc: 1182, delta: { add: 8, rem: 1 }, planned_change: { intent: "VERSION 5 to 6; the three new Summary counters are written and read. The reader already refuses a file from another build, so no older file is migrated." } }
  - { path: "crates/engine/src/observe/mod.rs", status: modified, role: contract, module: records, loc: 831, delta: { add: 20, rem: 2 }, planned_change: { intent: "MatchFigures gains stats.clearances and stats.restart_kicks (two integers) and stats.ball_in_play_s (integer seconds, the shoot-out excluded). stats.passes now counts open-play passes only, and stats.pass_accuracy_pct is over those passes." } }
  - { path: "crates/engine-cli/src/report/mod.rs", status: modified, role: contract, module: records, loc: 1527, delta: { add: 15, rem: 0 }, planned_change: { intent: "SuiteFigures gains ball_in_play_min_per_90_mean, a reported figure beside the bands (not a band): the mean over recorded matches of ball_in_play_s / 60 x 90 / minutes, three decimals." } }
