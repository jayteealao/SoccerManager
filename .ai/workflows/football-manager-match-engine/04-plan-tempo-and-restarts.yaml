  - { path: "schemas/observability/run-report.schema.json", status: modified, role: contract, module: records, loc: 650, delta: { add: 1, rem: 0 }, planned_change: { intent: "An optional ball_in_play_min_per_90_mean number in the suite figures." } }
  - { path: "crates/engine/src/scenario.rs", status: modified, role: test-support, module: seams, loc: 310, delta: { add: 15, rem: 0 }, planned_change: { intent: "Scene::clear(dir, speed, loft): the carrier clears the ball, as Scene::kick passes it. The scenario feature only." } }
  - { path: "crates/engine/tests/tempo_and_restarts.rs", status: new, role: test, module: tests, loc: 0, delta: { add: 360, rem: 0 }, planned_change: { intent: "Fast scenes: a clearance counts as a clearance and not a pass; a throw-in, a goal kick, a corner and a kick-off count as restart kicks and not passes, and the next open-play pass counts; a fast pass into the box with a defender in reach and a scripted draw is cleared (the defending side last, no completion, one clearance); a throw-in is not taken before 13.8 s; live ticks plus dead-ball ticks equal the ticks played. Slow and ignored: 200 matches of the default clubs on seeds 1 to 200, shared through a OnceLock, give one test per criterion (passes 350 to 550 per team and accuracy 75 to 88 percent; ball in play 52 to 65 minutes per 90; throw-ins 35 to 55 per match) and a census that prints each restart kind's median dead-ball time and the corners by origin, checking every corner follows a defending touch over the goal line." } }
  - { path: "crates/engine/tests/match_stats.rs, content.rs, snapshot.rs, plugin_hooks.rs", status: modified, role: test, module: tests, loc: 915, delta: { add: 40, rem: 6 }, planned_change: { intent: "Pins for the new tuning values and the default of an older file; the scripted pass test keeps its pass count; the snapshot round trip carries the new counters at version 6; moved expectations are re-derived and recorded." } }
  - { path: "crates/engine/tests/keeper_and_shots.rs (set_pieces_arise_from_play)", status: external, role: test, module: tests, loc: 0, delta: { add: 0, rem: 0 }, planned_change: { intent: "Unchanged: it must still pass on the new play (at least 1.2 corners per team and 10 goal kicks per match, every corner after a defending touch over the goal line)." } }
  - { path: "docs/reference/data-files.md, docs/reference/protocol.md, .ai/observability.md", status: modified, role: docs, module: docs, loc: 1174, delta: { add: 30, rem: 3 }, planned_change: { intent: "The carry and clearance rows and the new restart delays; stats.passes described as open-play passes; the three new match-stats keys in the key list and the match-stats paragraph." } }
