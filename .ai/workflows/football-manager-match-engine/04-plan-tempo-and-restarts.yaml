risks:
  - { title: "The ball stays in play for more than 65 minutes", severity: high, body: "On bce0144 (24 matches, seed 42) the ball is live for 90.0 of 94.1 minutes. The engine awards 20.4 throw-ins, 12.3 goal kicks, 2.6 corners and 12.8 fouls per match, fewer than real matches. At the four sourced medians those counts give about 20 minutes of dead time, so the figure could stay near 70.", mitigation: "The tempo change and the throw-in and cross-clearance levers add stoppages; the census prints each kind's median dead time. The four delays never go above the medians. If the figure stays above 65 with every lever in bounds, implement stops and reports the figures." }
  - { title: "Throw-ins are 20 to 24 per match, not 33 to 43", severity: high, body: "The slice expected throw-ins already in band; the keeper-and-shots gate measured 22.4 to 24.1, and the probe 20.4. Fewer passes can lower them further.", mitigation: "The clearance aim spread and the cross clearance are tuned so more balls cross a touchline. A throw-in only ever comes from a ball crossing the touchline. If 35 is out of reach in bounds, implement stops and reports." }
  - { title: "Pass accuracy leaves 75 to 88 percent", severity: medium, body: "Accuracy is 86.6 percent today with clearances and restart kicks counted. Taking out clearances raises it and taking out throw-ins lowers it.", mitigation: "Step 3 measures the counting change alone before any tuning. The pass weights (lane, min_lane, distance) are secondary levers, inside their bounds." }
  - { title: "Every seeded result moves", severity: medium, body: "The carry window changes decisions, the longer delays move every stoppage, and the cross-clearance rolls consume draws.", mitigation: "Each moved expectation is re-derived and recorded with its reason. No tolerance is widened." }
  - { title: "Goals fall further", severity: low, body: "Less live time means fewer shots and goals until realism-tuning.", mitigation: "Accepted by the product owner (slice Risks); band misses are recorded, not failed (Q-E4)." }
