files:
  - { path: "web/lineup.mjs", status: new, role: domain, module: logic, loc: 140, delta: { add: 140, rem: 0 }, planned_change: { intent: "Pure lineup legality: eleven starters, the goalkeeper slot filled by a goalkeeper, no player placed twice, bench at most seven. Returns the first failing reason as text for the inline message. Unit-tested under node --test. Contract-independent." } }
  - { path: "web/pending.mjs", status: new, role: domain, module: logic, loc: 110, delta: { add: 110, rem: 0 }, planned_change: { intent: "The pending-change list: mirrors the engine queue keyed by change.queue_id; Queued -> Applies now -> Applied, or Rejected with the engine's reason; each chip carries its state word. Reads change.state, change.rejected_reason, and change.applied_tick, which the engine now emits." } }
  - { path: "web/lineup-editor.mjs", status: new, role: ui, module: panels, loc: 260, delta: { add: 260, rem: 0 }, planned_change: { intent: "DOM editor: formation picker, eleven slots, up to seven bench slots, click-to-place primary and drag as an enhancement, role fit and fitness per slot, inline reason, kick-off disabled until legal. BLOCKED on OQ-1: squad delivery and lineup submission." } }
