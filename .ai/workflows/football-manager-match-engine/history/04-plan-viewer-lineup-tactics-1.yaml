risks:
  - { title: "No path carries a page-chosen lineup to the engine", severity: high, body: "serve builds MatchConfig with the home team as the human manager and the AI pre-match setup (serve.rs:19-23, ai.rs:128) before the page connects (serve.rs:71); the gate produces at once (control.rs:32-33); the opening message carries club identity and kit only.", mitigation: "OQ-1 to the product owner: choose the contract for squad delivery, lineup submission, and the pre-match hold." }
  - { title: "The queue-change detail is still opaque on the wire", severity: high, body: "The engine now has a tactics model, a substitution limit, and a change queue (tactics/change.rs:30,194; content/tactics.json), but the socket change is acknowledged and not applied (protocol.md:187-191). The tactics plan left the wire payload to this plan's OQ-2.", mitigation: "OQ-2 to the product owner: schema delivery and detail shape; the bridge then maps onto the engine's internal Change type." }
  - { title: "Squad delivery overlaps the match-day panels question", severity: medium, body: "The match-day plan's open question Q-1 asks how player rosters reach the page; OQ-1 asks the same for the editor.", mitigation: "Answer both together so one roster message serves both panels." }
  - { title: "Keyboard criterion names a tool outside the stack", severity: low, body: "The slice names a Testing Library test; the repository has no package.json and no DOM under node --test.", mitigation: "Resolved as an implementation detail: drive keyboard operation in the in-app browser (in stack), reading document.activeElement per Tab press." }
