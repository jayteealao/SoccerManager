artifact: plan
schema: sdlc/v1
slug: football-manager-match-engine
slice: viewer-lineup-tactics
rev: 0
status: awaiting-input
modules:
  - { id: page, label: "web/ (page shell and styles)", role: ui }
  - { id: logic, label: "web/ pure modules (lineup rules, pending-change list)", role: domain }
  - { id: panels, label: "web/ panels (lineup editor, tactics panel, substitution picker, chips)", role: ui }
  - { id: jstests, label: "web/tests (node --test)", role: test }
  - { id: protocol, label: "crates/protocol (messages; contract fork OQ-1 and OQ-2 open)", role: domain }
  - { id: stream, label: "crates/stream (session, control channel)", role: service }
  - { id: cli, label: "crates/engine-cli (serve)", role: cli }
  - { id: docs, label: "docs/reference/protocol.md", role: docs }
files:
  - { path: "web/lineup.mjs", status: new, role: domain, module: logic, loc: 140, delta: { add: 140, rem: 0 }, planned_change: { intent: "Pure lineup legality: eleven starters, exactly one goalkeeper slot filled by a player, no player placed twice, bench at most seven. Returns the first failing reason as text for the inline message. Unit-tested under node --test. Contract-independent." } }
  - { path: "web/pending.mjs", status: new, role: domain, module: logic, loc: 110, delta: { add: 110, rem: 0 }, planned_change: { intent: "The pending-change list: mirrors the engine queue keyed by change.queue_id; transitions Queued -> Applies now -> Applied, or Rejected with the engine's reason; each chip carries its state word. Driven by ack, reject, and change events. The applied/rejected event field names depend on the tactics-and-ai plan." } }
  - { path: "web/lineup-editor.mjs", status: new, role: ui, module: panels, loc: 260, delta: { add: 260, rem: 0 }, planned_change: { intent: "DOM editor: formation picker, eleven slots, up to seven bench slots, click-to-place as the primary path and drag as an enhancement, role fit and fitness per slot, inline reason, kick-off control disabled until legal. BLOCKED on OQ-1: the squad data and the lineup submission path." } }
  - { path: "web/tactics-panel.mjs", status: new, role: ui, module: panels, loc: 220, delta: { add: 220, rem: 0 }, planned_change: { intent: "Mentality, team instructions, roles and duties per slot, rendered from the tactics schema so a new instruction needs no UI change. BLOCKED on OQ-2: where the page reads the tactics schema from." } }
  - { path: "web/substitution-picker.mjs", status: new, role: ui, module: panels, loc: 150, delta: { add: 150, rem: 0 }, planned_change: { intent: "Pick an on-pitch player and a bench player, queue a substitution change, show the remaining count, show the engine's rejection reason. BLOCKED on OQ-2: the remaining count and the substitution detail shape." } }
  - { path: "web/components/chip.css", status: new, role: ui, module: page, loc: 60, delta: { add: 60, rem: 0 }, planned_change: { intent: "Pending-change chip styles from the --tl- tokens; state word always present; success, warning, danger tokens from steer.md." } }
  - { path: "web/index.html", status: modified, role: ui, module: page, loc: 115, delta: { add: 40, rem: 6 }, planned_change: { intent: "Pre-match editor region and the tactics panel region in the right column. Replace the placeholder note that names an internal work item with product wording." } }
  - { path: "web/main.mjs", status: modified, role: ui, module: page, loc: 270, delta: { add: 60, rem: 4 }, planned_change: { intent: "Wire the editor, the panel, the picker and the pending list to the socket; extend the window.__touchline hook with pending() and lineup() readers for the drives." } }
  - { path: "web/tests/lineup.test.mjs", status: new, role: test, module: jstests, loc: 120, delta: { add: 120, rem: 0 }, planned_change: { intent: "Every illegal case (ten starters, no goalkeeper, a player twice, eight on the bench) and the legal case." } }
  - { path: "web/tests/pending.test.mjs", status: new, role: test, module: jstests, loc: 110, delta: { add: 110, rem: 0 }, planned_change: { intent: "Chip lifecycle: queued, applies now, applied clears, rejected keeps the reason; out-of-order and unknown queue ids." } }
  - { path: "crates/protocol/src/message.rs", status: modified, role: domain, module: protocol, loc: 259, delta: { add: 0, rem: 0 }, planned_change: { intent: "PENDING OQ-1 and OQ-2: any new server message (squads, tactics schema) or client command (lineup) is a public contract change the product owner decides." } }
  - { path: "crates/stream/src/control.rs", status: modified, role: service, module: stream, loc: 289, delta: { add: 0, rem: 0 }, planned_change: { intent: "PENDING OQ-1: the gate starts producing at once today; a pre-match hold until a lineup arrives changes session behaviour for every client." } }
  - { path: "crates/engine-cli/src/serve.rs", status: modified, role: cli, module: cli, loc: 120, delta: { add: 0, rem: 0 }, planned_change: { intent: "PENDING OQ-1: MatchConfig is built from the team files before any client connects; a page-chosen lineup needs it built after the lineup arrives." } }
  - { path: "docs/reference/protocol.md", status: modified, role: docs, module: docs, loc: 240, delta: { add: 0, rem: 0 }, planned_change: { intent: "PENDING OQ-1 and OQ-2: the reference document changes with whatever contract the product owner picks; the document test keeps it honest." } }
edges:
  - { from: "web/lineup-editor.mjs", to: "web/lineup.mjs", kind: import }
  - { from: "web/substitution-picker.mjs", to: "web/pending.mjs", kind: import }
  - { from: "web/tactics-panel.mjs", to: "web/pending.mjs", kind: import }
  - { from: "web/main.mjs", to: "web/lineup-editor.mjs", kind: import }
  - { from: "web/main.mjs", to: "web/tactics-panel.mjs", kind: import }
  - { from: "web/main.mjs", to: "web/substitution-picker.mjs", kind: import }
  - { from: "web/lineup-editor.mjs", to: "crates/protocol/src/message.rs", kind: api-contract }
  - { from: "web/tactics-panel.mjs", to: "crates/protocol/src/message.rs", kind: api-contract }
risks:
  - { title: "No path carries a page-chosen lineup to the engine", severity: high, body: "serve builds MatchConfig from the team files before any client connects (crates/engine-cli/src/serve.rs:17-20), the gate starts producing at once (crates/stream/src/control.rs:32), and the engine takes the first eleven players in file order (crates/engine/src/team.rs:88-92). No message carries a squad to the page or a lineup back.", mitigation: "OQ-1 to the product owner: choose the contract for squad delivery, lineup submission, and the pre-match hold." }
  - { title: "Tactics schema and change detail are owned by a sibling plan in flight", severity: medium, body: "queue-change detail is opaque today (docs/reference/protocol.md, queue-change). The tactics model, the substitution limit, and the applied-change event payload are tactics-and-ai scope, planned in parallel.", mitigation: "OQ-2 to the product owner; the cohesion check aligns this plan once tactics-and-ai is written." }
  - { title: "Keyboard criterion names a tool outside the stack", severity: low, body: "The slice names a Testing Library test; the repository has no package.json and no DOM under node --test.", mitigation: "Resolved as an implementation detail: drive keyboard operation in the in-app browser (in stack), reading document.activeElement per Tab press." }
