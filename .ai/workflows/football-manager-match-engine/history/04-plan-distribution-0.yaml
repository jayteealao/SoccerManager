files:
  - { path: ".cargo/config.toml", status: new, role: config, module: build, loc: 6, delta: { add: 6, rem: 0 }, planned_change: { intent: "Link the C runtime statically for x86_64-pc-windows-msvc (-C target-feature=+crt-static). The current release binary imports VCRUNTIME140.dll, which a clean Windows 11 machine does not carry." } }
  - { path: "crates/engine-cli/src/cli.rs", status: modified, role: domain, module: cli, loc: 300, delta: { add: 14, rem: 3 }, planned_change: { intent: "On the launcher options added by the reports-and-recovery work: --seed becomes optional (a clock-derived seed, printed to stderr), --web becomes optional (discovered), and --open is added (open the page address in the default browser). Help lines under 80 columns." } }
  - { path: "crates/engine-cli/src/launch.rs", status: modified, role: domain, module: cli, loc: 260, delta: { add: 30, rem: 2 }, imports: ["crate::web"], planned_change: { intent: "Resolve the page folder through web::resolve_web_dir, choose the seed when none is given, and after printing the page address run cmd /C start with it when --open is set. Worker supervision unchanged." } }
  - { path: "crates/engine-cli/src/web.rs", status: modified, role: domain, module: cli, loc: 300, delta: { add: 35, rem: 0 }, planned_change: { intent: "resolve_web_dir(flag): the flag, then SM_WEB_DIR, then ./web, then the web folder beside the binary, each accepted only when it holds index.html; the refusal names every folder tried. Mirrors ContentDir::resolve. serve --web and replay --web keep a required explicit path." } }
  - { path: "crates/engine-cli/tests/install_layout.rs", status: new, role: test, module: clitests, loc: 130, delta: { add: 130, rem: 0 }, planned_change: { intent: "Copy the built binary, content/, and web/ into a temp install layout; run launch --minutes 1 from an unrelated working folder with SM_CONTENT_DIR, SM_WEB_DIR, and SM_ENGINE_PATH cleared; assert the page is served, engine.json reaches state running with a socket port, and a viewer connection receives hello. A layout without web/ is refused naming the folders tried." } }
  - { path: "crates/engine-cli/tests/release_version.rs", status: new, role: test, module: clitests, loc: 90, delta: { add: 90, rem: 0 }, planned_change: { intent: "engine-cli --version, the hello engine_version read over a real socket, and the workspace version in Cargo.toml are one string; packaging/windows/build.ps1 derives the installer name from engine-cli --version, never from a literal." } }
  - { path: "packaging/windows/installer.nsi", status: new, role: infra, module: packaging, loc: 120, delta: { add: 120, rem: 0 }, planned_change: { intent: "NSIS 3 MUI2 per-user installer (RequestExecutionLevel user) into $LOCALAPPDATA\\Programs\\SoccerManager: engine-cli.exe, content\\, web\\, both licence files; a Start-menu shortcut that runs engine-cli.exe launch --open; an uninstaller and an HKCU uninstall entry with DisplayVersion = VERSION. VERSION and STAGE come from /D defines." } }
  - { path: "packaging/windows/build.ps1", status: new, role: infra, module: packaging, loc: 70, delta: { add: 70, rem: 0 }, planned_change: { intent: "cargo build --release --locked; read the version from engine-cli --version; stage dist/stage; run makensis /DVERSION /DSTAGE; write dist/SoccerManager-<version>-windows-x64-setup.exe and its .sha256." } }
  - { path: "packaging/windows/smoke.ps1", status: new, role: infra, module: packaging, loc: 150, delta: { add: 150, rem: 0 }, planned_change: { intent: "Runs on the clean machine: silent install (/S), launch the Start-menu shortcut, wait for engine.port and a kick-off record in events.jsonl, headless Edge screenshot of a second launch run, read hello over a WebSocket on the port from engine.json and compare engine_version with the installed --version, write results.json and the screenshots to the evidence folder, uninstall." } }
  - { path: "packaging/windows/run-sandbox.ps1", status: new, role: infra, module: packaging, loc: 60, delta: { add: 60, rem: 0 }, planned_change: { intent: "Write a .wsb with absolute host paths (dist read-only, evidence writable, networking disabled), start Windows Sandbox, wait for results.json, print the verdict. A missing WindowsSandbox.exe exits with the named fallback." } }
  - { path: "packaging/README.md", status: new, role: docs, module: packaging, loc: 60, delta: { add: 60, rem: 0 }, planned_change: { intent: "How to build the installer, what it installs and where, how to run the clean-machine smoke test, and the unsigned-installer SmartScreen note." } }
  - { path: ".gitignore", status: modified, role: config, module: root, loc: 5, delta: { add: 1, rem: 0 }, planned_change: { intent: "Ignore dist/." } }
  - { path: "README.md", status: modified, role: docs, module: root, loc: 120, delta: { add: 12, rem: 0 }, planned_change: { intent: "An Install section: download the setup file, run it, start Soccer Manager from the Start menu; engine-cli launch --open for a development build." } }
edges:
  - { from: "crates/engine-cli/src/launch.rs", to: "crates/engine-cli/src/web.rs", kind: calls }
  - { from: "packaging/windows/build.ps1", to: "packaging/windows/installer.nsi", kind: calls }
  - { from: "packaging/windows/run-sandbox.ps1", to: "packaging/windows/smoke.ps1", kind: calls }
  - { from: "packaging/windows/installer.nsi", to: "crates/engine-cli/src/launch.rs", kind: contract }
  - { from: "crates/engine-cli/tests/release_version.rs", to: "packaging/windows/build.ps1", kind: contract }
risks:
  - { title: "Operating systems beyond Windows are undecided", severity: high, body: "The slice leaves macOS and Linux to the product owner at plan (U-3). The plan covers Windows and stops for the answer.", mitigation: "Open question OQ-1 with three options; Linux can be built and smoke-tested natively in the WSL Ubuntu 24.04 install on the reference laptop; macOS has no build or test environment." }
  - { title: "How the user starts a match is a user-visible choice", severity: medium, body: "A browser page cannot start a native program; the engine already serves the page (viewer-pitch Q1). The plan proposes a Start-menu shortcut that runs the launcher, which starts the engine and opens the page.", mitigation: "Open question OQ-2; recommended option reuses the launcher the reports-and-recovery plan adds." }
  - { title: "Clean machine lacks the Visual C++ runtime", severity: high, body: "target/release/engine-cli.exe imports VCRUNTIME140.dll (checked this run).", mitigation: "Step 1 links the C runtime statically; the sandbox smoke run is the proof." }
  - { title: "Unsigned installer meets SmartScreen", severity: medium, body: "A downloaded unsigned setup file shows the SmartScreen warning; the sandbox copy carries no download mark, so verify does not reproduce it.", mitigation: "Documented in packaging/README.md; signing is out of scope beyond what the platform requires to run." }
  - { title: "Windows Sandbox unavailable at verify", severity: low, body: "WindowsSandbox.exe is present but was not launched this run.", mitigation: "Fallback chain: Hyper-V VM from the Windows 11 evaluation image, then a pre-registered deferral with a provisionable clearing event." }
