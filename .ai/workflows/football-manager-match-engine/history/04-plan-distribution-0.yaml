rev: 0
status: awaiting-input
modules:
  - { id: build, label: "workspace build configuration (.cargo/)", role: config }
  - { id: cli, label: "crates/engine-cli/src (launcher options, page-folder discovery)", role: domain }
  - { id: clitests, label: "crates/engine-cli/tests (install-layout and release-version tests)", role: test }
