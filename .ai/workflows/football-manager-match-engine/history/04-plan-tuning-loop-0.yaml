files:
  - { path: "crates/engine/src/sim.rs", status: modified, role: domain, module: engine, loc: 1157, delta: { add: 25, rem: 0 }, planned_change: { intent: "Simulation::send_off_before_kickoff(i): public, not behind the scenario feature. It does what Scene::sent_off does (drop the carrier, discipline::send_off, set the team's AI manager due) and resets the team timeline to the current tick, so the validator reads the reduced team from kick-off. It takes no random draw." } }
  - { path: "crates/engine/src/scenario.rs", status: modified, role: test, module: engine, loc: 283, delta: { add: 2, rem: 8 }, planned_change: { intent: "Scene::sent_off calls Simulation::send_off_before_kickoff, so the slow test and the calibrate suite share one code path for the send-off." } }
  - { path: "crates/engine/tests/defending.rs", status: modified, role: test, module: tests, loc: 228, delta: { add: 30, rem: 4 }, planned_change: { intent: "A fast parity test: the Scene path and the public path give the same goals on three seeds. The slow red-card test prints its figures to 4 decimals, so verify can compare them with the calibrate report." } }
  - { path: "crates/engine-cli/src/cli.rs", status: modified, role: interface, module: cli, loc: 531, delta: { add: 60, rem: 3 }, planned_change: { intent: "SuiteArg gains red-card. New repeatable --pairing NAME (for example \"4-4-1-1 v 4-4-2\", either order), repeatable --band NAME, and --baseline FILE. A hidden worker flag carries the selected pairing numbers. Help lines stay within 80 columns." } }
  - { path: "crates/engine-cli/src/calibrate/mod.rs", status: modified, role: application, module: calib, loc: 571, delta: { add: 170, rem: 25 }, planned_change: { intent: "Resolves the selection (suites from --suite and --band, pairings from --pairing) and refuses an unknown name with the list of valid names. Loads and checks the baseline before the run folder is made and before any worker starts. Plans, reads back and checks only the selected fixtures. Clamps jobs to the selected matches. Writes calib.selection, calib.red_card, calib.baseline and calib.diff, and prints the diff table on standard error." } }
  - { path: "crates/engine-cli/src/calibrate/fixtures.rs", status: modified, role: application, module: calib, loc: 264, delta: { add: 60, rem: 2 }, planned_change: { intent: "formation_fixtures_for(matches, pairings, selected) keeps each fixture's index from the full list, so a selected pairing plays the same match seeds as in a full run. red_card_fixtures(seed, matches): four arms (control, keeper 11, centre-back 13, striker 21) x matches, on the engine seeds seed to seed + matches - 1. Unit tests." } }
  - { path: "crates/engine-cli/src/calibrate/worker.rs", status: modified, role: application, module: calib, loc: 255, delta: { add: 70, rem: 5 }, planned_change: { intent: "Plays only the selected pairings. A red-card worker plays the default clubs with red_base, yellow_base and yellow_aggression_weight set to 0 on the match configuration, sends the arm's player off before kick-off, and writes the usual statistics record." } }
  - { path: "crates/engine-cli/src/report/mod.rs", status: modified, role: domain, module: report, loc: 1031, delta: { add: 200, rem: 10 }, planned_change: { intent: "Suite::RedCard (code red-card, number 3; not in Suite::ALL, so --suite all is unchanged). BandCheck gains se, the sampling error of the value: sd/sqrt(n) for means, sqrt(p(1-p)/n) for shares, the ratio-estimator error for ratios, the binomial error for the win rate. RedCardFigures (control home and away, each arm's full and reduced goals, the limit 1.6 x control home, pass) and two band rows per arm. CalibrationReport gains calib.selection, calib.red_card, calib.baseline and calib.diff." } }
  - { path: "crates/engine-cli/src/report/baseline.rs", status: new, role: domain, module: report, loc: 0, delta: { add: 190, rem: 0 }, planned_change: { intent: "Reads a baseline run report and refuses it before play, naming each difference (seed, match count, and the identity key that the product owner's answer to Q-P1 selects), or a baseline without sampling errors. Pairs rows with compare::compare (wall_ms left out), adds the change's error sqrt(se_b^2 + se_n^2), marks |change| <= 2 x error as noise, and renders a fixed-width table: band, baseline, new, change, error, noise or change, verdict." } }
  - { path: "crates/engine-cli/tests/calibrate_targeted.rs", status: new, role: test, module: tests, loc: 0, delta: { add: 260, rem: 0 }, planned_change: { intent: "A pairing-only run holds that pairing only and plays exactly --matches matches; a targeted pairing and a targeted suite equal the same entries of a full run on the same seed; each baseline refusal exits non-zero with no statistics file written and names the difference; the diff prints every column and marks an identical rerun as noise; a red-card run has four arms and a verdict." } }
  - { path: "crates/engine-cli/tests/calibrate.rs", status: modified, role: test, module: tests, loc: 279, delta: { add: 8, rem: 0 }, planned_change: { intent: "The smoke run's band checks each carry a sampling error of 0 or more." } }
  - { path: "crates/engine-cli/tests/schemas.rs", status: modified, role: test, module: tests, loc: 166, delta: { add: 20, rem: 0 }, planned_change: { intent: "A targeted run with a baseline and a red-card run validate against the run-report schema." } }
  - { path: "schemas/observability/run-report.schema.json", status: modified, role: contract, module: contract, loc: 0, delta: { add: 70, rem: 1 }, planned_change: { intent: "Additive: suite enum gains red-card; band items gain se; new optional calib.selection, calib.red_card, calib.baseline and calib.diff. schema.version stays 1." } }
  - { path: ".ai/observability.md", status: modified, role: contract, module: contract, loc: 0, delta: { add: 4, rem: 1 }, planned_change: { intent: "The run-report key list names the new keys and the red-card suite." } }
  - { path: "Cargo.toml", status: modified, role: config, module: build, loc: 36, delta: { add: 5, rem: 0 }, planned_change: { intent: "Only if the measurement keeps it: [profile.calibrate] inherits release with lto fat and codegen-units 1. A native CPU target is never committed to a config file, because the shipped binary must run on other CPUs." } }
  - { path: "docs/reference/cli.md", status: modified, role: docs, module: docs, loc: 0, delta: { add: 30, rem: 2 }, planned_change: { intent: "The calibrate section names --pairing, --band, --baseline, the red-card suite, the diff table and the refusal messages." } }
  - { path: "docs/how-to/calibration.md", status: new, role: docs, module: docs, loc: 0, delta: { add: 110, rem: 0 }, planned_change: { intent: "How to measure a tuning change: make a baseline once, run the targeted suite, pairing or band, read the diff and its noise marks, run the red-card experiment, and run the full suites before a gate." } }
  - { path: "crates/engine-cli/tests/docs.rs", status: modified, role: test, module: tests, loc: 120, delta: { add: 2, rem: 0 }, planned_change: { intent: "The new how-to is in the document set, and its commands are real commands." } }
