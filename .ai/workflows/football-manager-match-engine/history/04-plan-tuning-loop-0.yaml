risks:
  - { title: "The baseline guard refuses every tuning change", severity: high, body: "The report's content.hash covers tuning.json and every flag state (crates/engine/src/data/mod.rs:274-278 and 310-321; sim.rs:91-109). A guard on it refuses a baseline after any tuning-value edit, which is the change the loop exists to measure.", mitigation: "Open question Q-P1 for the product owner; the plan is awaiting input until it is answered." }
  - { title: "Targeted and full runs drift apart", severity: medium, body: "A formations fixture's match seed comes from its index in the full list (fixtures.rs:68-84, 113-115).", mitigation: "The selection keeps the full-list index; a unit test and an agreement test compare a targeted run with a full run on the same seed." }
  - { title: "A native CPU target moves seeded results", severity: medium, body: "Vector code paths in dependencies can change float results.", mitigation: "A profile is kept only when every figure of the report is identical per seed; a native target is never committed to a config file." }
  - { title: "The 2-minute budget is tight for a 1,000-match suite", severity: low, body: "About 80 seconds at 12.5 matches per second, plus the 6-match single-thread figure and start-up.", mitigation: "Measured on the reference machine in step 12; the bench figure stays, because the paired run's guardrail reads it." }
