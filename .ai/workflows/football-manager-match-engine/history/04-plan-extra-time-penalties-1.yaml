risks:
  - { title: "Q-1 open: how the shoot-out is simulated", severity: high, body: "A shoot-out resolved by attribute draws sits outside the per-tick positional model the product owner ratified; one simulated on the pitch makes the announced maximum match length unbounded under sudden death.", mitigation: "Plan stops at awaiting-input with three options; everything else is planned." }
  - { title: "A missed field breaks resume in extra time", severity: medium, body: "Any clock field not in the snapshot makes a resumed match drift.", mitigation: "Snapshot version 4 and a continuation test from the break before extra time." }
  - { title: "The default match changes by accident", severity: medium, body: "One extra draw or reordered branch changes every tick file.", mitigation: "Extra-time draws only when extra time starts; the unchanged determinism test is the gate." }
  - { title: "Knockout matches are longer", severity: low, body: "The announced maximum rises from 360,000 to 480,000 ticks, about 45 MB of page history.", mitigation: "Only when --knockout is set; the default match is unchanged, and the benchmark runs the default match." }
