files:
  - { path: "web/match-state.mjs", status: new, role: domain, module: state, loc: 180, delta: { add: 180, rem: 0 }, planned_change: { intent: "Pure reducer from event messages to the match state at a given tick: score, feed entries, cards per player, and the goal ticks. Events are keyed by tick and released by the rendered tick, never by arrival, because the stream runs up to 500 ticks ahead of playback and rewind moves the cursor backwards." } }
  - { path: "web/feed.mjs", status: new, role: ui, module: panels, loc: 170, delta: { add: 170, rem: 0 }, imports: [match-state, signal], planned_change: { intent: "A per-frame batcher (pure core) plus the feed renderer. Released entries collect in one array and flush once per animation frame through one DocumentFragment, so an 8x burst of more than 10 events per second inserts every event with none dropped. Goals, cards, substitutions, and injuries carry a highlight class and a text label. Each line is the commentary field every play event now carries; the event kind in words is the fallback for a tactics-change row, which has no commentary." } }
  - { path: "web/scoreboard.mjs", status: new, role: ui, module: panels, loc: 120, delta: { add: 120, rem: 0 }, imports: [mark], planned_change: { intent: "The 56-pixel header: team names, kit chips drawn by the mark function, score bug in Barlow Condensed 700, clock and speed indicator in tabular numerals. Reads 0 to 0 at kick-off." } }
  - { path: "web/lineups.mjs", status: new, role: ui, module: panels, loc: 160, delta: { add: 160, rem: 0 }, planned_change: { intent: "Two columns with position, name, fatigue bar, condition marker, and cards. The fatigue band maps to a state word (Fresh, Tiring, Exhausted) that is always written beside the colour. Source of names and positions depends on Q-1." } }
  - { path: "web/stats.mjs", status: new, role: ui, module: panels, loc: 130, delta: { add: 130, rem: 0 }, planned_change: { intent: "Pure mapping from a statistics message to the panel model (nine rows, home and away), and the renderer. Updates on message arrival, never per tick. Field names depend on Q-1." } }
  - { path: "web/goal-moment.mjs", status: new, role: ui, module: panels, loc: 110, delta: { add: 110, rem: 0 }, planned_change: { intent: "Score-bug pulse, banner in from the pitch edge and out within 1.5 seconds, and the feed highlight, all applied in the same animation frame as the goal tick. Under prefers-reduced-motion the banner appears and leaves without motion and the pulse is off." } }
  - { path: "web/components/panels.css", status: new, role: ui, module: page, loc: 220, delta: { add: 220, rem: 0 }, planned_change: { intent: "Score bug, banner, feed rows, lineup rows, fatigue bar, and statistics grid, all on the existing --tl- tokens. Transitions on opacity and transform only; a reduced-motion block sets them to 0.01ms." } }
  - { path: "web/index.html", status: modified, role: ui, module: page, loc: 115, delta: { add: 70, rem: 12 }, planned_change: { intent: "Replace the three empty regions and the header placeholder with the panel markup, the empty-state feed text, and the banner element." } }
  - { path: "web/main.mjs", status: modified, role: service, module: page, loc: 270, delta: { add: 60, rem: 8 }, planned_change: { intent: "Route event, statistics, and roster messages into match-state; flush panels once per frame from the rendered tick; extend the read-only hook with matchDay(); name full time distinctly from a dropped stream." } }
  - { path: "web/layout.css", status: modified, role: ui, module: page, loc: 300, delta: { add: 30, rem: 20 }, planned_change: { intent: "Header layout for the score bug, and the right-column and statistics regions filled instead of empty." } }
  - { path: "web/tokens.css", status: modified, role: ui, module: page, loc: 82, delta: { add: 6, rem: 0 }, planned_change: { intent: "Motion durations for the banner and the pulse as tokens, so the 1.5-second rule is one value." } }
  - { path: "web/pitch.mjs", status: modified, role: ui, module: page, loc: 258, delta: { add: 12, rem: 1 }, planned_change: { intent: "Skip drawing a marker whose position is a parking spot beside the pitch (a sent-off player), mirroring is_parking_spot in crates/engine/src/pitch.rs:161." } }
  - { path: "web/tests/helpers.mjs", status: modified, role: test, module: jstests, loc: 90, delta: { add: 40, rem: 0 }, planned_change: { intent: "A synthetic event burst generator and a statistics message factory." } }
  - { path: "web/tests/match-state.test.mjs", status: new, role: test, module: jstests, loc: 120, delta: { add: 120, rem: 0 }, planned_change: { intent: "Score and feed at any tick equal the events up to that tick; rewind backwards removes later entries; kick-off state is 0 to 0 with no entries." } }
  - { path: "web/tests/feed.test.mjs", status: new, role: test, module: jstests, loc: 100, delta: { add: 100, rem: 0 }, planned_change: { intent: "A burst of 40 events inside one second at 8x flushes all 40 across frames with none dropped and order preserved; each frame performs one insert." } }
  - { path: "web/tests/stats.test.mjs", status: new, role: test, module: jstests, loc: 80, delta: { add: 80, rem: 0 }, planned_change: { intent: "Every field of a statistics message appears in the panel model with an equal value." } }
  - { path: "web/tests/lineups.test.mjs", status: new, role: test, module: jstests, loc: 60, delta: { add: 60, rem: 0 }, planned_change: { intent: "Every fatigue band maps to a state word; no band returns a colour without a word." } }
  - { path: "crates/protocol/src/message.rs", status: modified, role: domain, module: protocol, loc: 259, delta: { add: 60, rem: 0 }, planned_change: { intent: "PENDING Q-1. The wire shape for the roster, the live statistics, and player condition. Not decided by this plan." } }
  - { path: "crates/protocol/src/lib.rs", status: modified, role: domain, module: protocol, loc: 336, delta: { add: 10, rem: 0 }, planned_change: { intent: "PENDING Q-1. Message field lists and, if the product owner chooses, the version rule." } }
  - { path: "crates/protocol/tests/document.rs", status: modified, role: test, module: protocol, loc: 90, delta: { add: 10, rem: 0 }, planned_change: { intent: "PENDING Q-1. The document test reads the new tables." } }
  - { path: "docs/reference/protocol.md", status: modified, role: docs, module: protocol, loc: 210, delta: { add: 40, rem: 3 }, planned_change: { intent: "PENDING Q-1. The stats section today reads Sent once, at full time; the new cadence and fields are documented here." } }
  - { path: "crates/engine-cli/src/serve.rs", status: modified, role: service, module: engine, loc: 120, delta: { add: 15, rem: 0 }, planned_change: { intent: "PENDING Q-1. The live hello (built at serve.rs:35) carries the squads from the loaded team files, if the product owner puts the roster in the hello." } }
  - { path: "crates/engine-cli/src/record.rs", status: modified, role: service, module: engine, loc: 90, delta: { add: 10, rem: 0 }, planned_change: { intent: "PENDING Q-1. The recorded hello (record.rs:34) matches the live one, so a recorded match file carries the same roster." } }
  - { path: "crates/engine-cli/src/bench.rs", status: modified, role: service, module: engine, loc: 200, delta: { add: 5, rem: 0 }, planned_change: { intent: "PENDING Q-1. The benchmark hello (bench.rs:149) fills the new field so the benchmark keeps compiling." } }
  - { path: "crates/engine-cli/src/stream_run.rs", status: modified, role: service, module: engine, loc: 130, delta: { add: 45, rem: 2 }, planned_change: { intent: "PENDING Q-1. Send the running statistics and each player's energy at the chosen cadence from sim.summary(), which already keeps shots, shots on target, expected goals, passes, completed passes, possession ticks, fouls, corners, and offsides (sim.rs:289-328)." } }
  - { path: "crates/engine/src/sim.rs", status: modified, role: domain, module: engine, loc: 620, delta: { add: 10, rem: 0 }, planned_change: { intent: "PENDING Q-1. A read-only accessor for each player's energy (player.rs:137) in wire-slot order; no new counter is needed." } }
