risks:
  - { title: "Q-1 open: the stream carries no roster, no fatigue, and no live statistics", severity: high, body: "The engine now keeps every value the panels need (all nine statistics, each player's energy, injury and substitution events, commentary), but no message carries the roster, the running statistics, or energy. Choosing that wire shape changes the versioned protocol and the recorded match files. It is a contract decision for the product owner, and it overlaps the open squad-delivery question of the lineup and tactics plan.", mitigation: "Plan stays at awaiting-input with the question narrowed to the wire shape and three options recorded; everything else is planned in full." }
  - { title: "Events arrive ahead of playback", severity: high, body: "The server leads the page by up to 500 ticks; showing an event on arrival would announce a goal before the pitch draws it.", mitigation: "Release events by the rendered tick; a unit test drives a goal that arrives 400 ticks early." }
  - { title: "Panels steal frame budget", severity: medium, body: "Nine statistics rows, 22 lineup rows, and a feed at 8x.", mitigation: "One flush per frame, only changed nodes written, statistics per message, never per tick." }
  - { title: "No reduced-motion emulation in the browser tool", severity: medium, body: "The in-app browser exposes colour-scheme emulation only; Playwright is absent.", mitigation: "Proxy through a shared reduced-motion rule plus a deferral cleared by the operator switching Windows animation effects off." }
  - { title: "A later event-contract redesign renames event kinds and raises event volume", severity: medium, body: "docs/design/realism/02-event-contract-redesign.md (a planned later programme) names this slice as a consumer to migrate: event kinds move to provider names, the protocol version rises, and a match may carry about 1,400 events instead of about 150.", mitigation: "Keep every event-kind string the new modules read in one exported table in match-state.mjs (beside the existing STOPS_PLAY set in web/stoppages.mjs), so a rename touches two known places; keep the feed batcher independent of the event count. No redesign work is planned in this slice." }
lanes:
  - { service: page, label: "Page (web/)", files: ["web/match-state.mjs", "web/feed.mjs", "web/scoreboard.mjs", "web/lineups.mjs", "web/stats.mjs", "web/goal-moment.mjs", "web/main.mjs"] }
  - { service: engine, label: "Engine and protocol (pending Q-1)", files: ["crates/protocol/src/message.rs", "crates/engine-cli/src/serve.rs", "crates/engine-cli/src/stream_run.rs", "crates/engine/src/sim.rs"] }
