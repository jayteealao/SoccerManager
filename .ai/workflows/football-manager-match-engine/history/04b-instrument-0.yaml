artifact: instrument
framework: "serde_json JSON Lines per .ai/observability.md plan-version 1; tracing to stderr for diagnostics"
signals:
  - name: "match-stats.simulate"
    kind: event
    path: "crates/engine-cli/src/simulate.rs:end"
    note: "One record per simulate run: record.kind, schema.version, match.id, owner.id, seed, service, version, build.hash, env, operation, duration_ms, outcome, engine.ticks_per_s, ticks.written, validate.ran, validate.violations, possession.changes, ball.max_speed, ball.idle_ticks."
  - name: "run-report.bench"
    kind: event
    path: "crates/engine-cli/src/bench.rs:end"
    note: "One record per bench run: record.kind, schema.version, run.id, seed, service, version, build.hash, env, operation, outcome, bench.matches, bench.match_wall_ms (median), bench.cpu_ms, bench.peak_mem_mb, engine.ticks_per_s, bench.cpu_wall_ratio, machine.hash, machine.cpu_model, machine.power_plan, budget.pass."
  - name: "engine.ticks_per_s"
    kind: gauge
    path: "crates/engine/src/sim.rs:run"
    note: "Ticks divided by elapsed wall seconds; carried in both records."
  - name: "bench.cpu_wall_ratio"
    kind: gauge
    path: "crates/engine-cli/src/bench.rs:measure"
    note: "CPU time over wall time for one thread; below 0.9 flags contention on the benchmark machine."
  - name: "validate.violation"
    kind: log
    path: "crates/engine/src/validate.rs:check"
    note: "One line per violation: tick, rule, player.id, value; the count rides in match-stats as validate.violations."
  - name: "tickfile.header"
    kind: event
    path: "crates/engine/src/record.rs:write_header"
    note: "magic, schema.version, seed, dt_ms, expected ticks, float width; emitted as a tracing info line."
  - name: "tickfile.trailer"
    kind: event
    path: "crates/engine/src/record.rs:finish"
    note: "ticks.written and the byte length; a reader that finds no trailer or a count mismatch refuses the file."
  - name: "diag.simulate.span"
    kind: trace
    path: "crates/engine-cli/src/simulate.rs:run"
    note: "tracing span with seed and minutes; stderr only; never in a record."
dark_paths:
  - path: "crates/engine-cli/src/simulate.rs:abort"
    reason: "A killed simulate leaves a header and no trailer; nothing said the file was partial."
  - path: "crates/engine/src/validate.rs:pass"
    reason: "A validator that never ran looks the same as one that passed; match-stats carries validate.ran."
  - path: "crates/engine-cli/src/bench.rs:contention"
    reason: "A benchmark on a busy machine fails or passes for the wrong reason; the CPU-to-wall ratio and the power plan make it visible."
  - path: "crates/engine/src/decision.rs:no-possession"
    reason: "A match where nobody gains possession runs silently to full time; possession.changes and ball.idle_ticks expose it."
pii_warnings: 0
