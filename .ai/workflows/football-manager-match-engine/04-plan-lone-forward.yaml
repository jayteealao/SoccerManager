risks:
  - { title: "Both levers at their bounds cannot pass a criterion", severity: high, body: "The worst arm today is the keeper arm: reduced 5.82 against full 2.06 (defending-and-discipline implement record). 4-4-1-1 scores 5.18 against a 4.0 limit.", mitigation: "The tuning loop may change only the five new values and foul_base inside their bounds. A criterion that still fails stops implement with the failing arm or pairing; no limit, card chance or keeper value moves (RIM-12)." }
  - { title: "The lone terms reach other formations", severity: medium, body: "Any carrier with no outfield team-mate ahead is lone, so the eight passing pairings and the default-teams matches move too.", mitigation: "every_formation_holds reruns all ten pairings; the eight kept pairings are a criterion; the full calibrate gate records band moves against the copied baseline." }
  - { title: "Fewer fouls move the card figures", severity: medium, body: "A higher win share lowers fouls, so yellow cards and sending-offs fall; the bands may be missed.", mitigation: "discipline_is_realistic is rerun; band misses are recorded, not failed (Q-E4)." }
  - { title: "Hold-up play invites contact", severity: medium, body: "A holding forward stays in reach of the presser, and each tick in reach draws a tackle.", mitigation: "The hold weight decays with hold_per_s, and the tackle odds are tuned in the same loop; the contact scene pins the draw split." }
  - { title: "Every seeded result moves", severity: medium, body: "New weights and tackle odds change the random stream use and outcomes of pinned tests.", mitigation: "The neutral-value step shows no change first; each moved expectation is re-derived and recorded, and no tolerance is widened." }
