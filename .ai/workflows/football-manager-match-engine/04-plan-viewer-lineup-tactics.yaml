risks:
  - { title: "Two queues give one change two identifiers", severity: high, body: "The socket queue acknowledges q-{socket tick}-{n}; Simulation::queue_change assigns its own q-{engine tick}-{n} from a counter the computer manager also uses (change.rs:228-236).", mitigation: "The driver keeps an engine-id to socket-id map for the home team and writes the socket id on the change event; a test asserts the applied event carries the acknowledged id." }
  - { title: "The hold changes every serve session", severity: medium, body: "Gate::new produces at once today (control.rs:32-33) and the page never sends start (no start command in web/*.mjs).", mitigation: "Only serve holds; record, bench, resume, and the stream tests keep Gate::new. The kick-off control sends start. The product owner ratified the hold (OQ-1 option 1)." }
  - { title: "Version 3 refuses version 2 recordings", severity: medium, body: "The fixture reader refuses any other protocol version (crates/stream/src/record.rs:219).", mitigation: "Accepted with the version bump; no recording is committed to the repository; the tests record fresh fixtures." }
  - { title: "Opening-message builder collides with the match-day roster work", severity: medium, body: "The match-day slice, ordered first, adds a roster to each hello team at the same three builder sites.", mitigation: "Extend its builder if it exists; otherwise add hello.rs and let the roster use it. Raise the version once." }
  - { title: "A queued change made while paused could apply at resume", severity: low, body: "AC-e requires the next dead ball, not resume.", mitigation: "The inbox drains only after wait_until_running, so the change queues on the first running tick and waits for the next opening stoppage; the stream_run test covers it." }
