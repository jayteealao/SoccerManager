  - { path: "crates/engine/tests (content.rs, full_match.rs, commentary.rs, common/mod.rs, keeper_and_shots.rs, match_stats.rs and others the retune moves)", status: modified, role: test, module: tests, loc: 2000, delta: { add: 40, rem: 40 }, planned_change: { intent: "Pins that tuning.json equals Tuning::default(); seeded expectations the retune moves, each re-derived and recorded with its reason. No tolerance is widened." } }
