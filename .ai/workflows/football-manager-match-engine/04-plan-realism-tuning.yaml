files:
  - { path: "content/tuning.json", status: modified, role: config, module: tuning, loc: 198, delta: { add: 30, rem: 30 }, planned_change: { intent: "The chosen setting: restart delays at the sourced medians (13.8, 31.8, 23.2, 32.5 s), contest levers, foul_base, foul_booked_factor, foul_cooldown_ticks, decision weights and carry window, shot weights, shot_range, shot and aim noise, refitted xG coefficients, and the new corner-source chance. Every value inside its declared bound. The card chance per foul, the save curve and the hold share do not change." } }
  - { path: "crates/engine/src/tuning.rs", status: modified, role: config, module: tuning, loc: 620, delta: { add: 25, rem: 20 }, planned_change: { intent: "Tuning::default() mirrors the new content values. The clearances block gains the corner-source value (serde default 0.0, so an older file plays as today) with a garde bound." } }
  - { path: "crates/engine/src/sim.rs", status: modified, role: domain, module: play, loc: 1420, delta: { add: 60, rem: 5 }, planned_change: { intent: "A new corner source: a pressured clearance or a cross clearance near the defenders' own goal line can go off the defender at a wide angle, with one referee draw per event. The ball then crosses the goal line or not as the physics decides, and the existing out-of-play rule gives a corner only after a defending touch over the goal line (RIM-9)." } }
  - { path: "crates/engine/src/decision.rs", status: modified, role: domain, module: play, loc: 810, delta: { add: 10, rem: 2 }, planned_change: { intent: "Only if the corner source needs it: the clearance direction under pressure reads the new value. No change to how often a player decides." } }
  - { path: "crates/engine/tests/corner_source.rs", status: new, role: test, module: tests, loc: 0, delta: { add: 160, rem: 0 }, planned_change: { intent: "Scenes: a pressured clearance at the goal line with a scripted draw goes over the own goal line and gives a corner; the same scene with the value at 0.0 gives no corner; a ball that stops before the line gives no corner; the last touch is the defending side." } }
  - { path: "crates/engine/tests/defending.rs", status: modified, role: test, module: tests, loc: 300, delta: { add: 20, rem: 6 }, planned_change: { intent: "every_formation_holds judges total goals per match (both sides) against 2.4 to 3.2 for each formation against 4-4-2, 120 matches, read from content/realism-bands.json. The doc comment is updated. a_sending_off_gives_no_advantage is unchanged and must pass." } }
  - { path: "crates/engine/tests/tempo_and_restarts.rs", status: modified, role: test, module: tests, loc: 560, delta: { add: 3, rem: 8 }, planned_change: { intent: "The three tests marked as later-tuning targets in d6ccbb7 get the plain slow marker back, and the targets paragraph is removed. Limits unchanged: passes 350 to 550 per team at 75 to 88 percent, ball in play 52 to 65 minutes, throw-ins 35 to 55." } }
