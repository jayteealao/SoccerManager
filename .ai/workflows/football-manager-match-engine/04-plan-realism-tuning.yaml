risks:
  - { title: "No setting passes every gated band on five seeds", severity: high, body: "Bands pull against each other: more fouls help yellows and ball in play but hurt the sending-off band and discipline; more contest helps passes, shots and the red card but lowers goals; more clear helps throw-ins but raises passes. b0 already failed discipline and the stronger-team test.", mitigation: "A feasibility stage tests the four walls first; tune jointly within 8 rounds, then check five seeds. If no setting passes, stop and report the closest result and the conflicting pair. Never widen a band." }
  - { title: "Goals and the red-card control are linked", severity: high, body: "The red-card test caps the full side at 1.6 times the control. At b0 the reduced side scored less in every arm, but the control scored too little, so the test failed on the cap.", mitigation: "Proportional goals leave the cap ratio unchanged, so the feasibility stage measures the control and all three arms early, and the loop measures them every round. The xG refit corrects goals per xG only; it does not drive saves." }
  - { title: "The 10 v 4-4-2 formations test is still far out", severity: high, body: "Today only 4-2-3-1 is clearly inside 2.4 to 3.2; 4-1-2-1-2 gives 0.84 and 3-4-3 gives 3.76.", mitigation: "The feasibility stage sweeps 4-1-2-1-2, 3-4-3 and 4-4-2 on the exact test fixtures first. If shared values cannot bring every pairing into band, stop and report." }
  - { title: "The corner source changes other bands", severity: medium, body: "More corners add dead time and set pieces, so ball in play, shots and goals move too.", mitigation: "Build the source at 0.0 first, commit it with its scenes, then tune its chance together with the other values." }
  - { title: "Seeded browser tests stop scoring", severity: medium, body: "match-day.spec.mjs needs seed 3 to score early; first-match.spec.mjs needs seed 42 to score at 8x.", mitigation: "Re-pick the seed only when it no longer scores, and record it." }
