artifact: instrument
framework: "serde_json JSON Lines per .ai/observability.md plan-version 1 (match-event, match-stats, run-report records) plus tracing to stderr. The page side is unchanged."
signals:
  - name: "match-event (change verdicts at a stoppage)"
    kind: event
    path: "crates/engine-cli/src/stream_run.rs:event mapping"
    note: "One tactics-change record per applied or rejected change, with change.kind, change.queue_id, change.queued_tick, change.applied_tick (contract key, applied only), change.state, change.rejected_reason, and team.id, which was absent on change events before this slice."
  - name: "match-event (substitution, injury, ai-decision)"
    kind: event
    path: "crates/engine-cli/src/stream_run.rs:event mapping"
    note: "Three event types the contract already lists. substitution: player.id (off), player.secondary_id (on), team.id. injury: player.id, team.id. ai-decision: team.id and ai.decision (contract key) with a short code such as mentality-up-trailing or sub-fatigue."
  - name: "change.applied"
    kind: event
    path: "crates/engine/src/tactics/change.rs:apply_at_stoppage"
    note: "One tracing debug line per applied change: tick, team, kind, queue_id, waited_ticks (applied minus queued), stoppage kind."
  - name: "change.rejected"
    kind: log
    path: "crates/engine/src/tactics/change.rs:apply_at_stoppage"
    note: "One tracing info line per rejection: tick, team, kind, queue_id, reason. The same reason reaches the event and the page."
  - name: "ai.decision"
    kind: event
    path: "crates/engine/src/ai.rs:in_match"
    note: "One tracing info line per AI choice: tick, minute, team, code, score state. It mirrors the ai-decision event for developers reading stderr."
  - name: "injury.occurred"
    kind: event
    path: "crates/engine/src/rules/mod.rs:injure"
    note: "One tracing info line: tick, team, player, source (tackle or background), energy at the time."
  - name: "match-stats tactics fields"
    kind: gauge
    path: "crates/engine/src/observe/mod.rs:MatchStats"
    note: "stats.shots per team, injury.count, fatigue.mean_pct at full time, darkpath.change_never_applied (contract keys); extras changes.queued, changes.applied, changes.rejected, substitutions per team, ai.decisions."
  - name: "tactics.plan"
    kind: log
    path: "crates/engine/src/tactics/mod.rs:TeamPlan::from"
    note: "One tracing debug line each time a team's plan is recomputed: tick, team, formation, mentality, press count, block depth. Shows what a change did to the numbers the decision layer reads."
  - name: "run-report per-match processor time"
    kind: gauge
    path: "crates/engine-cli/src/bench.rs:report"
    note: "No new field. The gate reads bench.cpu_ms and bench.matches, and bench.cpu_us_per_tick and bench.ticks_per_match are reported beside it; all four already exist."
dark_paths:
  - path: "crates/engine/src/tactics/change.rs:change never applied"
    reason: "The shape's dark path. A change still pending at full time is counted in darkpath.change_never_applied, and every change ends as an applied or rejected event, so a silent drop shows as a count above zero."
  - path: "crates/engine/src/ai.rs:silent AI"
    reason: "An AI that never acts looks the same as a match with nothing to react to. Every choice emits an ai-decision event, and ai.decisions counts them, which the AI-decisions dashboard reads."
  - path: "crates/engine/src/fatigue.rs:invisible fatigue"
    reason: "Energy changes play and nothing shows it. fatigue.mean_pct at full time and the energy in injury.occurred make it visible, and calibration reads the statistic."
  - path: "crates/engine/src/tactics/change.rs:rejection without a reason"
    reason: "A rejected change with no reason leaves the manager guessing. Every rejection carries change.rejected_reason in the event and in the change.rejected line."
pii_warnings: 0
