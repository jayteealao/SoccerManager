artifact: instrument
framework: "serde_json JSON Lines per .ai/observability.md plan-version 1 (match-event, match-stats, run-report records) plus tracing to stderr. The page side from viewer-pitch is unchanged."
signals:
  - name: "match-event (law types)"
    kind: event
    path: "crates/engine-cli/src/stream_run.rs:event mapping"
    note: "One match-event record per offside, foul, card, throw-in, corner, goal-kick, free-kick, penalty, and half-time, with player.id and player.secondary_id (contract keys) and the extras card.kind, foul.advantage, minute.added, added_time.s. The contract's event.type list already names every type except the advantage flag, which rides on foul."
  - name: "rules.added_time"
    kind: event
    path: "crates/engine/src/rules/clock.rs:end of regulation per half"
    note: "One tracing info line per half: half, tally_s, variance_s, added_s, announced_min. Makes the AC-e formula visible in a real match, not only in a test."
  - name: "rules.dead_ball_stalled"
    kind: log
    path: "crates/engine/src/rules/mod.rs:dead-ball hard limit"
    note: "One tracing warn line when a dead ball reaches three times its tuned delay and the restart is forced: tick, kind, team, waited_ticks, taker_distance_m. The slice risk 'restart positioning fights the steering agents' becomes a counted event."
  - name: "rules.abandoned"
    kind: log
    path: "crates/engine/src/rules/discipline.rs:abandoned"
    note: "One tracing warn line when a team falls below min_players: tick, team.id, on_pitch. The match-stats outcome becomes abandoned instead of success."
  - name: "snapshot.written"
    kind: event
    path: "crates/engine/src/snapshot.rs:write_atomic"
    note: "One tracing debug line per snapshot: match.id, snapshot.tick (contract key), kind, bytes. Debug level, because about 100 rows per match would flood info."
  - name: "snapshot.write_failed"
    kind: log
    path: "crates/engine-cli/src/simulate.rs and serve.rs:snapshot sink"
    note: "One tracing error line when a snapshot cannot be written: match.id, snapshot.tick, path (relative to SM_DATA_DIR), reason. The match continues; a lost snapshot is named rather than discovered at the next crash."
  - name: "snapshot.refused"
    kind: log
    path: "crates/engine-cli/src/resume.rs:read"
    note: "One tracing error line when resume refuses a file: path (relative), reason (bad magic, unknown version, truncated, length mismatch, checksum mismatch, build mismatch, content mismatch, team mismatch). The same reason reaches stderr and exit code 1."
  - name: "match.resumed"
    kind: event
    path: "crates/engine-cli/src/resume.rs:after from_snapshot"
    note: "One tracing info line: match.id, snapshot.tick, half, home.score, away.score, build.hash. States where a resumed match picked up."
  - name: "match-stats law fields"
    kind: gauge
    path: "crates/engine/src/observe/mod.rs:MatchStats"
    note: "stats.fouls, stats.offsides, stats.corners per team and rules.pack_version (contract keys); extras cards.yellow, cards.red, added_time.s per half, ticks.played, rules.stoppages, rules.dead_ball_ticks, rules.offside_checks, snapshot.writes."
  - name: "run-report per-tick fields"
    kind: gauge
    path: "crates/engine-cli/src/bench.rs:report"
    note: "bench.ticks_per_match (median) and bench.cpu_us_per_tick. The product owner chose to judge the benchmark gate per tick (plan Round 4 Q13), so the report must carry the unit the gate reads."
dark_paths:
  - path: "crates/engine/src/rules/mod.rs:dead-ball stall"
    reason: "A dead ball whose taker never reaches the ball would freeze the match with no statement of why. rules.dead_ball_stalled names the forced restart, and rules.dead_ball_ticks totals the dead time."
  - path: "crates/engine-cli/src/simulate.rs:lost snapshot"
    reason: "A snapshot that fails to write is found only when a crash needs it. snapshot.write_failed names it at the stoppage, and snapshot.writes counts the successes."
  - path: "crates/engine/src/rules/discipline.rs:silent abandonment"
    reason: "A match that ends below seven players would look like a short match. rules.abandoned and the abandoned outcome state it."
  - path: "crates/engine/src/sim.rs:stoppage with no consumer"
    reason: "The shape's dark path 'a queued change that never applies' starts here: this slice opens stoppages and nothing drains the queue yet. rules.stoppages counts the hook calls, so the next slice can prove each queued change met a stoppage."
  - path: "crates/engine/src/rules/offside.rs:unseen cost"
    reason: "The offside set is the per-pass cost the slice names as its top risk, and nothing counts how often it runs. rules.offside_checks makes the count a statistic beside the benchmark."
pii_warnings: 0
