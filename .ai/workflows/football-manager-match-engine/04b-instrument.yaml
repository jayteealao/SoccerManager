artifact: instrument
framework: "serde_json JSON Lines per .ai/observability.md plan-version 1; tracing to stderr for diagnostics"
signals:
  - name: "content.loaded"
    kind: event
    path: "crates/engine/src/data/mod.rs:load_json"
    note: "One tracing info line per content file: kind (attributes, tuning, rules, team), path relative to the content folder, schema_version, item count, and the 12-hex file hash."
  - name: "content.refused"
    kind: log
    path: "crates/engine/src/data/mod.rs:load_json"
    note: "One tracing error line per refused file before the error returns: kind, relative path, field path, reason. The same text becomes the EngineError::Data message."
  - name: "content.hash"
    kind: gauge
    path: "crates/engine/src/data/mod.rs:Content::hash"
    note: "12 hex characters of SHA-256 over attributes, tuning, rules, team A, team B in that order; carried in match-stats and run-report so a record names the content it ran on."
  - name: "match-stats.teams"
    kind: event
    path: "crates/engine-cli/src/simulate.rs:end"
    note: "match-stats gains teams: [{team.id, team.name}] for sides A and B, from the loaded club ids; additive to the engine-core key set."
  - name: "generator.league"
    kind: event
    path: "crates/engine/src/data/generator.rs:generate_league"
    note: "One tracing info line per generated league: seed, clubs, players, attribute mean, min, and max across the league, and the content.hash of the schema and tuning used."
  - name: "identity.owner_created"
    kind: event
    path: "crates/engine/src/observe/identity.rs:load_or_create"
    note: "One tracing info line when owner.id is created for the first time: the relative path owner.id inside the runtime data folder; the value itself rides only in records."
  - name: "tickfile.header"
    kind: event
    path: "crates/engine/src/record.rs:write_header"
    note: "Existing signal extended: schema.version 2 adds owner.id (16 bytes) and the match.id millisecond stamp (8 bytes) to the header line."
dark_paths:
  - path: "crates/engine/src/data/mod.rs:refusal"
    reason: "A refused content file exits 1 with one stderr line and no record; nothing else says which file and field failed. content.refused carries kind, path, field, and reason."
  - path: "crates/engine-cli/src/simulate.rs:unknown-content"
    reason: "A match that ran on edited content looks identical to one on the shipped defaults. content.hash in match-stats and run-report names the content."
  - path: "crates/engine/src/data/generator.rs:drift"
    reason: "A generator whose distribution drifted outside the tuning bounds produces squads that look valid. generator.league reports league-wide mean, min, and max; the calibration slice checks the bands."
  - path: "crates/engine/src/observe/identity.rs:regenerated"
    reason: "A deleted owner.id file is silently recreated and every later record carries a new owner. identity.owner_created marks the creation."
pii_warnings: 0
