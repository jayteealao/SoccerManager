risks:
  - { id: R1, severity: medium, title: "Determinism breaks when attributes become per-player", body: "The array-backed Attributes and the Derived values change the arithmetic on the hot path; an iteration over a BTreeMap at load time is ordered, but a stray HashMap or a float reduction order change would break byte-identical output.", mitigation: "No HashMap anywhere in crates/engine; Derived is computed once at load in schema order; the determinism test and the generator same-seed test run on every verify." }
  - { id: R2, severity: medium, title: "Benchmark shifts or the loader lands on the timed path", body: "Loaded teams change per-player speeds, so the wall time moves; a Content::load inside the per-match loop would add file reads to every timed match.", mitigation: "bench loads Content and the two team files once before the warm-up; compare mode judges by the 10 percent CPU and 25 percent memory tripwires against 387 ms and 5.06 MB, not by equality." }
  - { id: R3, severity: medium, title: "garde raises the MSRV and needs crates.io", body: "garde 0.23 declares rust-version 1.87; the workspace pins 1.86; garde, garde_derive, compact_str, and smallvec are not in the registry.", mitigation: "Step 1 bumps rust-version to 1.87 (rustc 1.92 is installed); the first build fetches four crates; the license of each is MIT OR Apache-2.0 (NFR-5)." }
  - { id: R4, severity: medium, title: "The teams key in match-stats is outside the contract vocabulary", body: "Block A lists team.id as a string; match-stats now carries two clubs.", mitigation: "Emit teams: [{team.id, team.name}] as an additive extra; the observability audit settles the vocabulary; verify's key check counts extras and does not fail on them." }
  - { id: R5, severity: low, title: "Tick-file schema 2 refuses every existing .ticks file", body: "Files written by engine-core carry version 1 and no identity bytes.", mitigation: "*.ticks is gitignored and no fixture ships a tick file; the reader's refusal message names both versions." }
  - { id: R6, severity: low, title: "Content folder not found under cargo run", body: "The binary under target/release has no content/ beside it; a run from another working directory fails.", mitigation: "Resolution order flag, SM_CONTENT_DIR, ./content, <exe dir>/content; the error names every path tried; README documents it." }
