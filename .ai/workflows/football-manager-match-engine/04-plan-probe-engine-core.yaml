risks:
  - { title: "Calibration output changes after its verification", severity: medium, body: "Calibration writes failure today in per-match records and in its run report. Option C changes the word to error and adds two keys. Run folders saved before the change fail the new schema.", mitigation: "The product owner accepted this: earlier run folders are not a compatibility target. The calibrate tests and a real calibration drive with an injected failure prove the new shape." }
  - { title: "An error run report without the error keys", severity: medium, body: "Today a calibration run with a failed worker writes outcome failure and no error key. After the schema change an error record without error.type, error.code, and error.retriable is refused.", mitigation: "Step 10 adds the three keys to the run report, and the injected worker failure drives the path against the real schema." }
  - { title: "The injected failure leaks into a real run", severity: low, body: "The calibrate test seam makes a match or a worker fail on purpose.", mitigation: "The flag is hidden, off by default, applies to shard 0 only, and the hidden-seam test asserts it stays out of the help." }
  - { title: "Help text keeps growing with each slice", severity: low, body: "Later slices took the over-width count from 9 options to 47 lines. The existing test reads --help only, on 7 of 10 surfaces.", mitigation: "The test reads -h and --help on every surface, so a later option fails the gate." }
  - { title: "Stdout consumers of a failed run", severity: low, body: "A script that treats non-empty stdout as success would misread a failed simulate or bench run.", mitigation: "The exit code stays 1, and the command reference and the README state what a failed run prints." }
