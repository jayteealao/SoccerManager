  - { path: "crates/engine/src/observe/mod.rs", status: modified, role: domain, module: engine, loc: 693, delta: { add: 70, rem: 0 }, planned_change: { intent: "FailureRecord implements Record: envelope, operation, correlation keys, seed, content.hash, duration_ms, outcome error, error.type, error.code, error.retriable, and no statistic key. MatchFigures gains optional error.code and error.retriable beside error.type. Unit tests on the key sets." } }
  - { path: "crates/engine-cli/src/main.rs", status: modified, role: cli, module: cli, loc: 53, delta: { add: 40, rem: 3 }, planned_change: { intent: "On Err from simulate or bench, print one FailureRecord on stdout (match-stats for simulate, run-report for bench), then the prose line on stderr, then exit 1. The other seven subcommands keep prose only." } }
  - { path: "crates/engine-cli/src/bench.rs", status: modified, role: cli, module: cli, loc: 263, delta: { add: 2, rem: 1 }, planned_change: { intent: "The --matches 0 check (lines 22-23) returns EngineError::InvalidConfig in place of an untyped bail." } }
  - { path: "crates/engine-cli/src/calibrate/worker.rs", status: modified, role: cli, module: cli, loc: 208, delta: { add: 20, rem: 13 }, planned_change: { intent: "A failed match writes outcome error (was failure) with error.type, error.code, and error.retriable from the moved classifier. The private error_type() (lines 199-208) is removed. The injected match failure fails fixture 0 of shard 0 through the same failure() path." } }
  - { path: "crates/engine-cli/src/calibrate/mod.rs", status: modified, role: cli, module: cli, loc: 480, delta: { add: 30, rem: 3 }, planned_change: { intent: "The run report says outcome error (was failure) when a worker failed, and then carries error.type worker, error.code worker-failed, error.retriable false. worker_command forwards --inject-failure to shard 0." } }
  - { path: "crates/engine-cli/src/report/mod.rs", status: modified, role: cli, module: cli, loc: 666, delta: { add: 12, rem: 1 }, planned_change: { intent: "CalibrationReport gains optional error.type, error.code, and error.retriable. The strength-suite test marks its failed record outcome error. The filters compare against success and do not change." } }
  - { path: "schemas/observability/match-stats.schema.json", status: modified, role: contract, module: schemas, planned_change: { intent: "Product-owner answer Q-2 = C. outcome accepts success and error only; error.code and error.retriable are declared; the statistic keys are required only when outcome is not error; an error record requires error.type, error.code, and error.retriable. The envelope and correlation keys stay required." } }
  - { path: "schemas/observability/run-report.schema.json", status: modified, role: contract, module: schemas, planned_change: { intent: "Same rule: outcome success or error; the bench.* keys and the operation branches apply only when outcome is not error; an error record requires the three error keys; error.* declared." } }
  - { path: "docs/reference/cli.md", status: modified, role: docs, module: docs, planned_change: { intent: "The simulate and bench sections state that a failed run prints one record with outcome error on standard output and exits 1. The calibrate section names outcome error for a failed match and a failed worker." } }
  - { path: "README.md", status: modified, role: docs, module: docs, loc: 107, delta: { add: 2, rem: 0 }, planned_change: { intent: "One sentence beside the benchmark exit codes that a failed run prints one record and exits 1." } }
