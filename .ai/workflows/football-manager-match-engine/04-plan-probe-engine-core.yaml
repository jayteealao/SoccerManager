files:
  - { path: "crates/engine-cli/src/cli.rs", status: modified, role: cli, module: cli, loc: 401, delta: { add: 66, rem: 47 }, planned_change: { intent: "Finding 5 residual and finding 1. Shorten every short-help string whose -h line exceeds 80 columns: 47 lines over 10 help surfaces at HEAD 89fe959 (serve -h reaches 116 columns, calibrate -h 145). Hide the possible values of calibrate --suite and --keep-events in the option line and name them in long_help. resume --json gets the replace-rule long_help of simulate --json. Add the hidden test seam calibrate --inject-failure <match|worker>." } }
  - { path: "crates/engine-cli/tests/cli_args.rs", status: modified, role: test, module: cli-tests, loc: 216, delta: { add: 170, rem: 9 }, planned_change: { intent: "The 80-column test reads -h and --help on all 10 help surfaces (20 checks). Regression tests: the --json dump replaces the extension; an unwritable --ticks-out names the OS error once; redirected stderr carries no ESC byte. Failure-record tests for simulate and bench validated against the record schemas; calibration drives with the injected failure; the hidden-seam test covers --inject-failure." } }
  - { path: "crates/engine-cli/tests/schemas.rs", status: modified, role: test, module: cli-tests, loc: 92, delta: { add: 40, rem: 0 }, planned_change: { intent: "Negative schema checks: outcome failure is refused by both schemas; a success record without stats.goals is refused; an error record without error.code is refused." } }
