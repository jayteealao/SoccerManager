files:
  - { path: "crates/engine/src/flags.rs", status: new, role: domain, module: engine, loc: 190, delta: { add: 190, rem: 0 }, planned_change: { intent: "FlagDef { owner, hypothesis, removal_condition, state: off|on, overrides: dotted tuning path -> JSON value } with garde length(min = 1) on the three text fields; CODE_FLAGS, the registry of flags read by engine code (empty when this slice lands); FlagStates parsed from name=on|off; apply(&TuningFile, &FlagStates) -> Result<(TuningFile, ActiveFlags)> patches the overrides of every flag that is on, then re-deserializes and re-validates the whole file, so the garde bounds hold for a flagged value too." } }
  - { path: "crates/engine/src/data/tuning.rs", status: modified, role: domain, module: engine, loc: 240, delta: { add: 8, rem: 0 }, planned_change: { intent: "TuningFile gains flags: BTreeMap<String, FlagDef> with serde default and garde dive plus a custom rule: a flag with no overrides must be named in CODE_FLAGS, otherwise it switches nothing and is refused naming the flag. TUNING_VERSION does not change; the block is additive." } }
  - { path: "crates/engine/src/data/mod.rs", status: modified, role: domain, module: engine, loc: 390, delta: { add: 40, rem: 2 }, planned_change: { intent: "Content::with_flags(&FlagStates) -> Result<Content> applies the states, emits flag.active per flag that is on, and mixes the sorted on-list into the content digest when any state differs from the file, so a snapshot or report from a flagged run never matches an unflagged one. An unknown flag name in the states is refused naming it." } }
  - { path: "crates/engine/src/lib.rs", status: modified, role: domain, module: engine, loc: 40, delta: { add: 2, rem: 0 }, planned_change: { intent: "pub mod flags; pub use flags::{FlagStates, ActiveFlags}." } }
  - { path: "crates/engine/src/sim.rs", status: modified, role: domain, module: engine, loc: 700, delta: { add: 6, rem: 0 }, planned_change: { intent: "MatchConfig gains flags: ActiveFlags (sorted names that are on), copied from Content in MatchConfig::new; ActiveFlags::is_on(name) is the one call engine code uses for a code flag, with a debug assertion that the name is in CODE_FLAGS." } }
  - { path: "crates/engine/src/observe/mod.rs", status: modified, role: observability, module: engine, loc: 540, delta: { add: 45, rem: 0 }, planned_change: { intent: "MatchStats gains tuning.flags_on (serde default, additive at schema.version 1); CalibrationReport gains calib.flags (every declared flag with its state) and, on a paired run, calib.pair { flag, owner, hypothesis, removal_condition, pinned }, calib.arms { off, on } each holding the suite aggregates, wall times, dark paths, and benchmark figures, calib.compare rows, and calib.verdict." } }
  - { path: "crates/engine/tests/flags.rs", status: new, role: test, module: engine-tests, loc: 170, delta: { add: 170, rem: 0 }, planned_change: { intent: "AC-2: a tuning file whose flag lacks owner, hypothesis, or removal_condition (missing key and empty string, six cases) is refused with EngineError::Data whose field names flags.<name>.<field>; a flag with no overrides and no code registration is refused naming it; an override to an unknown path or out of its garde bound is refused naming the flag and the path; apply with the flag on changes exactly the overridden value; the content digest differs between on and off." } }
  - { path: "crates/engine/tests/content.rs", status: modified, role: test, module: engine-tests, loc: 115, delta: { add: 12, rem: 0 }, planned_change: { intent: "The shipped tuning.json declares every CODE_FLAGS entry, and every declared flag passes validation; the shipped flags block is pinned (empty when this slice lands)." } }
  - { path: "crates/engine-cli/src/cli.rs", status: modified, role: cli, module: cli, loc: 270, delta: { add: 22, rem: 0 }, planned_change: { intent: "Calibrate gains --flag <name=on|off> (repeatable; pins a state for the whole run) and --pair <name> (runs the off arm and the on arm on the same fixtures and seeds). A value other than on or off is refused by clap's value parser; --pair together with --flag on the same name is refused. Hidden worker arguments forward the resolved states. Help lines stay under 80 columns." } }
  - { path: "crates/engine-cli/src/calibrate/mod.rs", status: modified, role: cli, module: calibrate, loc: 240, delta: { add: 55, rem: 6 }, planned_change: { intent: "Resolves the flag states against the loaded content before any worker starts. Unpaired: one run as today with the states forwarded. Paired: two arms, off first, into runs/<run.id>/arms/<off|on>/, each arm with its own workers, suite timing, and single-thread benchmark under that arm's states; one report.json with both arms and the comparison; a side-by-side text table on stderr. Exit 0 when both arms complete with zero dark paths and zero validator violations, otherwise 2; the verdict does not set the exit code." } }
  - { path: "crates/engine-cli/src/calibrate/worker.rs", status: modified, role: cli, module: calibrate, loc: 160, delta: { add: 10, rem: 2 }, planned_change: { intent: "Loads content, applies the forwarded states with Content::with_flags, and writes tuning.flags_on into every match-stats record. The fixture list and match seeds do not depend on the flag states, so both arms play the same fixtures on the same seeds." } }
  - { path: "crates/engine-cli/src/bench.rs", status: modified, role: cli, module: cli, loc: 250, delta: { add: 4, rem: 2 }, planned_change: { intent: "measure() takes the Content it runs on, so each arm's single-thread figure is measured under that arm's flags. The bench command output stays key-for-key identical." } }
  - { path: "crates/engine-cli/src/report/compare.rs", status: new, role: observability, module: report, loc: 160, delta: { add: 160, rem: 0 }, planned_change: { intent: "Pure functions: compare(off, on, bands) -> Vec<CompareRow { suite, band, lo, hi, off, on, delta, off_pass, on_pass }> for the four bands; verdict(rows, guardrails) -> on-better | off-better | no-difference | on-rejected per the experiment design's decision rule (bands passed first, then summed normalized distance to the band centre with a 0.05 margin; on-rejected when the on arm has a dark path, a validator violation, or a single-thread time more than 10 percent above the off arm); render_table(rows) for stderr. Unit tests with hand-built aggregates cover each verdict." } }
  - { path: "crates/engine-cli/src/report/mod.rs", status: modified, role: observability, module: report, loc: 240, delta: { add: 20, rem: 2 }, planned_change: { intent: "RunBuilder is built once per arm; a PairBuilder holds two RunBuilders and calls compare::compare and compare::verdict at run end. The outlier rule and the event-file pruning run per arm unchanged." } }
  - { path: "crates/engine-cli/tests/calibrate_pair.rs", status: new, role: test, module: cli, loc: 190, delta: { add: 190, rem: 0 }, planned_change: { intent: "AC-1 on a temporary content folder whose tuning.json declares one test flag with an override of engine.shot_range: calibrate --seed 1 --matches 4 --minutes 5 --jobs 2 --pair <flag> writes 16 statistics files under arms/off and arms/on; the two arms hold the same match seeds; report.json validates against run-report.schema.json with boon and holds calib.arms.off, calib.arms.on, and a calib.compare row per suite and band with both values; the off arm's figures equal an unpaired run with the same seed; tuning.flags_on is [] in every off record and [<flag>] in every on record. Also: --flag unknown=on and --flag <flag>=maybe both exit non-zero naming the flag or the value." } }
  - { path: "schemas/observability/run-report.schema.json", status: modified, role: contract, module: schemas, loc: 230, delta: { add: 80, rem: 0 }, planned_change: { intent: "Under operation calibrate: optional calib.flags; calib.pair, calib.arms, calib.compare, and calib.verdict, required together when calib.pair is present (dependentRequired). additionalProperties stays true." } }
  - { path: "schemas/observability/match-stats.schema.json", status: modified, role: contract, module: schemas, loc: 140, delta: { add: 6, rem: 0 }, planned_change: { intent: "Optional tuning.flags_on: array of strings, unique items." } }
  - { path: "content/tuning.json", status: modified, role: data, module: content, loc: 135, delta: { add: 1, rem: 0 }, planned_change: { intent: "An explicit empty flags block, so modders see where flags go. No flag ships with this slice." } }
  - { path: "content/README.md", status: modified, role: docs, module: content, loc: 200, delta: { add: 30, rem: 0 }, planned_change: { intent: "A flags section: the five fields, the rule that a flag must switch something, the override path form, and a pointer to the removal checklist." } }
  - { path: "docs/how-to/modding.md", status: modified, role: docs, module: docs, loc: 140, delta: { add: 45, rem: 0 }, planned_change: { intent: "A section on comparing two models: declare the flag, run the paired calibration, read the side-by-side table and the verdict, then the removal checklist for the losing arm (delete the flag entry, fold a winning override into the base value or delete the losing code path, remove the CODE_FLAGS entry, rerun calibrate and bench, update the pinned tests)." } }
