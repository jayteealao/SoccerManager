risks:
  - { title: "Flags outlive their experiment", severity: medium, body: "A flag left in the tuning file keeps two code paths alive and makes every later calibration ambiguous.", mitigation: "owner, hypothesis, and removal_condition are required and non-empty; a flag must switch something; every flag that is on is logged at load; the paired report echoes the removal condition; the how-to carries the removal checklist." }
  - { title: "The calibration harness is planned but not built", severity: medium, body: "Every file under crates/engine-cli/src/calibrate and report comes from the calibration plan; names or shapes may move when that slice lands.", mitigation: "Step 1 reads the landed harness and stops for a plan re-review when RunBuilder, the worker arguments, bench::measure, or the run folder layout differ." }
  - { title: "A flagged override escapes the garde bounds", severity: medium, body: "A patch applied after validation would let a flag set a value the file itself could not hold.", mitigation: "apply() re-deserializes and re-validates the whole patched file; the flags test sets an out-of-bound override and expects a refusal naming the flag." }
  - { title: "A paired run doubles the wall time", severity: low, body: "Two arms of two 1000-match suites is 4000 matches.", mitigation: "The 30-minute budget stays per 1000-match suite; the report carries each arm's suite times; --suite narrows a paired run to one suite." }
  - { title: "Flag states reach a snapshot or report unmarked", severity: low, body: "A resumed match or an archived report would not say which model produced it.", mitigation: "The on-list is mixed into the content digest when any state differs from the file, and tuning.flags_on rides in every match-stats record." }
