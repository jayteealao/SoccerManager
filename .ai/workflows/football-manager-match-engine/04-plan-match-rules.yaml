risks:
  - { title: "Per-tick processor time exceeds the 10 percent tripwire", severity: high, body: "The referee runs on every tick; offside, exit detection, and the dead-ball state add work to a 1.42 microsecond tick.", mitigation: "Offside is computed only at a pass and checked only at a first touch; exit detection is two comparisons; step 22 measures before the tests are finalised and a miss is reported to the product owner with the levers." }
  - { title: "A resumed match drifts from the uninterrupted one", severity: high, body: "Exact continuation fails if any state is missing from the snapshot: facing, control_since, last_touch, the offside set, pending cards, the added-time tally, or the generator's word position.", mitigation: "The snapshot covers every Simulation field except the scratch buffer and the drained event list; the byte-for-byte continuation test and a write-read-write identity test run on every verify." }
  - { title: "Restart positioning fights the steering agents", severity: medium, body: "Players may never reach restart targets, or opponents stay inside 9.15 m, so a dead ball lasts too long or a restart is illegal.", mitigation: "During a dead ball decisions are suspended and every agent steers to its restart target; an encroaching opponent targets the nearest point on the 9.15 m circle; the restart is taken when the delay has passed and the taker is ready, with a hard limit of three times the delay; rules.dead_ball_ticks makes a stall visible." }
  - { title: "Existing files and the recorded fixture are refused", severity: medium, body: "PROTOCOL_VERSION 2 and tick-file schema 4 refuse every earlier .ticks file and the local .smfx fixture.", mitigation: ".ticks and .smfx files are not in the repository; step 23 regenerates the local fixture, and both refusals name the found and expected version." }
  - { title: "The viewer draws a sent-off player beside the pitch", severity: low, body: "The tick record and the wire frame hold 22 positions and no status bit, so a sent-off player's marker sits at the parking spot.", mitigation: "The parking spot is outside the pitch drawing area's play surface; viewer-match-day hides parked markers using the card events." }
  - { title: "Foul, card, and added-time rates are far from real matches", severity: low, body: "The defaults are estimates from 2024-25 league figures, several of them unsourced.", mitigation: "full_match.rs holds only a sanity band; the calibration slice tunes the rates against the realism bands." }
