artifact: design-contract
component: match-control
based-on: 02b-design.md
direction-confirmed-by: in-session
confirmed-at: "2026-09-24T11:22:17Z"
direction-status: interim
summary: >-
  The Touchline match screen at 1280 by 800: 36 OKLCH --tl- tokens, a 336 / 616 / 296
  grid under a 56-pixel header, a 616 by 411 pitch canvas, a 40-pixel playback strip,
  two locally bundled typefaces, and one function that draws the touchline mark. Ten
  fidelity items reach implementation; four belong to viewer-pitch and six are pinned
  for the later viewer slices. Both design gates close here: the image gate on steer.md,
  the brief-confirm gate on a user-confirmed PRODUCT.md.
tokens:
  - --tl-bg
  - --tl-panel
  - --tl-fg
  - --tl-fg-muted
  - --tl-line
  - --tl-brand
  - --tl-brand-hover
  - --tl-brand-pressed
  - --tl-on-brand
  - --tl-pitch
  - --tl-pitch-line
  - --tl-pitchside-bg
  - --tl-ring
  - --tl-success
  - --tl-warning
  - --tl-danger
  - --tl-card-yellow
  - --tl-skeleton
  - --tl-radius-sm
  - --tl-radius-md
  - --tl-radius-lg
  - --tl-radius-xl
  - --tl-padx-md
  - --tl-pady-md
  - --tl-gap
  - --tl-font-display
  - --tl-font-md
  - --tl-font-num
  - --tl-ease
  - --tl-shadow-1
  - --tl-header-h
  - --tl-col-left
  - --tl-col-mid
  - --tl-col-right
  - --tl-pitch-h
  - --tl-controls-h
states: [default, hover, focus, active, disabled, loading, empty, error]
sizes: [desktop]
themes: [light, pitchside]
contract:
  - element: "Page grid"
    tokens: [--tl-header-h, --tl-col-left, --tl-col-mid, --tl-col-right, --tl-gap, --tl-bg]
    states: [default, loading, error]
    requirement: >-
      CSS Grid at 1280 by 800. Row one is the 56-pixel header; row two holds three fixed
      columns of 336, 616 and 296 pixels with an 8-pixel gutter. No breakpoints and no
      fluid tracks, because stack.platforms names one desktop target. viewer-pitch builds
      the header and both side columns empty so the pitch lands at its shipping position.
  - element: "Pitch canvas"
    tokens: [--tl-pitch, --tl-pitch-line, --tl-pitch-h, --tl-col-mid, --tl-radius-md, --tl-line]
    states: [loading, empty, default, error]
    requirement: >-
      Exactly 616 by 411 CSS pixels, with the backing store multiplied by devicePixelRatio
      and the context scaled to match. Markings are drawn from the engine's own 105 by 68
      metre space centred on the origin, so a rendered position maps one to one onto a
      simulated position. The loading state is a skeleton pitch in --tl-skeleton, never a
      spinner. role="img" with a label, plus a visually hidden aria-live region mirroring
      clock, speed and lag in text.
  - element: "Player marker"
    tokens: [--tl-pitch, --tl-pitch-line, --tl-fg, --tl-on-brand]
    states: [default]
    requirement: >-
      A disc filled with the club's safe kit primary; a ring in the safe kit secondary when
      that colour measures 3:1 against turf, otherwise --tl-pitch-line. The shirt number is
      white or ink, whichever contrasts more with the fill, drawn at 10 pixels in IBM Plex
      Sans 600. Every kit hex converts to OKLCH and clamps its lightness into 0.20 to 0.88
      before the 3:1 test runs, because content/teams/default-a.json ships pure black.
  - element: "Ball and trail"
    tokens: [--tl-pitch-line, --tl-fg]
    states: [default]
    requirement: >-
      The ball plus the last N tick positions at falling alpha, drawn as one path rather
      than N strokes. The trail belongs to the ball alone; no player carries one.
  - element: "match-control button"
    tokens: [--tl-brand, --tl-brand-hover, --tl-brand-pressed, --tl-on-brand, --tl-ring, --tl-radius-sm, --tl-padx-md, --tl-pady-md, --tl-gap, --tl-font-md, --tl-ease, --tl-shadow-1]
    states: [default, hover, focus, active, disabled]
    requirement: >-
      Four heights (28, 36, 44, 52) and two themes defined in full, with viewer-pitch
      shipping the 28 and 36 sizes so later slices add no new geometry. Colour transition
      at 150 ms on --tl-ease; no press-scale, because the playback strip is pressed tens of
      times per match and animate.md's frequency rule removes motion there. A static
      variant turns the press-scale off. Focus ring at 3:1 via :focus-visible. Any button
      under 40 by 40 carries a centred pseudo-element hit area, and adjacent hit areas
      never overlap.
  - element: "Playback control strip"
    tokens: [--tl-controls-h, --tl-panel, --tl-radius-md, --tl-gap, --tl-line]
    states: [default, disabled]
    requirement: >-
      A 40-pixel strip immediately under the pitch, holding play and pause, the 1x to 8x
      speed selector, skip to next stoppage, and the rewind scrubber. Concentric radius:
      6 pixels of padding around --tl-radius-sm buttons gives the strip --tl-radius-md. The
      play triangle shifts 2 pixels right of geometric centre.
  - element: "Lag notice"
    tokens: [--tl-warning, --tl-fg, --tl-panel, --tl-radius-sm, --tl-font-num, --tl-ease]
    states: [default, error]
    requirement: >-
      Names the sustained speed in words and digits, for example "Playing at 3x - the
      engine sustains 3x". Colour never carries the state alone. Enter at 200 ms on
      --tl-ease with opacity and an 8-pixel rise; exit at 150 ms on ease-in. A transition,
      never a keyframe, so a rapidly re-triggered notice retargets instead of restarting.
  - element: "Numeric readouts"
    tokens: [--tl-font-num, --tl-fg, --tl-panel, --tl-fg-muted]
    states: [default]
    requirement: >-
      Clock, speed, frame-time counter and memory gauge all carry font-variant-numeric
      tabular-nums so the row does not twitch as values change. Each must measure at least
      4.5:1 against --tl-panel, proved before any banner motion is written. This is the
      brief's named top risk and PRODUCT.md's second strategic principle.
  - element: "Touchline mark"
    tokens: [--tl-pitch, --tl-pitch-line, --tl-pitchside-bg]
    states: [default]
    requirement: >-
      One exported JavaScript function draws three zones: the field above, a white line at
      58 percent of the tile height, and the pitchside band below. Inputs are the tile size
      and a corner radius of tile size times 0.21. One marker and the ball sit on the
      field. Four variants: primary, reversed, pitchside, mono. Never loaded from an image
      file. Club crests call the same function with kit colours in place of the turf.
  - element: "Token file"
    tokens: [--tl-bg, --tl-fg, --tl-brand, --tl-pitch, --tl-ring, --tl-ease, --tl-shadow-1]
    states: [default]
    requirement: >-
      One :root block in web/tokens.css is the single source of every colour, radius,
      spacing, font and easing value. Every value is OKLCH; no pure black and no pure white
      appears anywhere. The --tl- prefix supersedes the --mv- prefix in 02b-design.md and
      02b-design.yaml, which were written before the product was named. DESIGN.md gains the
      ten new rows in the same step so the two files never disagree.
anti-patterns:
  - "Football Manager 3D clutter: no overlay on the pitch beyond the score bug and the goal banner, and nothing drawn over a player marker."
  - "Sponsor-board clutter: no logos and no advertising boards on or beside the pitch."
  - "Arcade styling: no drop shadow, glow, or motion trail on a player marker. The trail belongs to the ball alone."
  - "Purple-blue gradient anywhere, including the header band, which stays flat --tl-brand."
  - "Nested cards: the pitch panel holds the canvas directly and contains no second card."
  - "Decorative side accent stripe on a panel. Use a full hairline or a background tint."
  - "Bounce or elastic easing, including on the scrubber handle. bounce stays 0."
  - "Pure black or pure white, including a kit colour read from a team file. Clamp the lightness first."
  - "A spinner in a content area. The pitch shows a skeleton."
  - "A font service. Both faces load from web/fonts/ as woff2."
  - "A logo loaded from an image file. The mark is drawn by web/mark.mjs."
  - "Colour as the only state signal. The lag notice carries its state in words."
