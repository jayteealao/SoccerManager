files:
  - { path: "Cargo.toml", status: modified, role: config, module: root, loc: 32, delta: { add: 6, rem: 1 }, planned_change: { intent: "Add crates/protocol and crates/stream to members; add tungstenite = { version = \"0.30\", default-features = false, features = [\"handshake\"] } to workspace.dependencies." } }
  - { path: "crates/protocol/Cargo.toml", status: new, role: config, module: protocol, loc: 20, delta: { add: 20, rem: 0 }, planned_change: { intent: "Library crate; depends on serde, serde_json, thiserror only. No network dependency, so a later WebAssembly build can use it." } }
  - { path: "crates/protocol/src/lib.rs", status: new, role: domain, module: protocol, loc: 70, delta: { add: 70, rem: 0 }, planned_change: { intent: "PROTOCOL_VERSION: u16 = 1; re-exports Frame, ServerMessage, ClientCommand, MatchEvent, TickCodec, ProtocolError; MESSAGES: &[MessageSpec] is the enumeration the document test reads." } }
  - { path: "crates/protocol/src/message.rs", status: new, role: domain, module: protocol, loc: 200, delta: { add: 200, rem: 0 }, imports: [serde], planned_change: { intent: "ServerMessage { Hello, Tick, Event, Stats, Ack, Reject } and ClientCommand { Start, Pause, SetSpeed, QueueChange } as serde enums with deny_unknown_fields and dotted rename keys; Hello carries protocol.version, engine.version, build.hash, owner.id, match.id, seed, dt_ms, ticks_expected, keyframe_interval, teams." } }
  - { path: "crates/protocol/src/codec.rs", status: new, role: domain, module: protocol, loc: 240, delta: { add: 240, rem: 0 }, planned_change: { intent: "TickCodec: 98-byte keyframe (tick u32, ball 3x i16 cm, 22 players 2x i16 cm) every KEYFRAME_INTERVAL = 50 ticks, 47-byte delta frame (i8 cm steps) between; encode_into(&mut [u8]) with no allocation; decode reconstructs absolute positions; a delta that would exceed i8 forces a keyframe." } }
  - { path: "crates/protocol/src/event.rs", status: new, role: domain, module: protocol, loc: 120, delta: { add: 120, rem: 0 }, imports: [serde], planned_change: { intent: "MatchEvent with the contract keys (tick, minute, event.type, team.id, home.score, away.score) and EventType limited to kick-off, goal, full-time in this slice; Record impl so the envelope matches match-stats." } }
  - { path: "crates/protocol/src/command.rs", status: new, role: domain, module: protocol, loc: 150, delta: { add: 150, rem: 0 }, planned_change: { intent: "ChangeKind (tactics, substitution) checked against the loaded RulePack; Queue holds pending changes in order, assigns queue ids q-{tick}-{n}, and answers Ack { queue_id, queued_tick } or Reject { reason }; nothing is applied to play." } }
  - { path: "crates/protocol/src/frame.rs", status: new, role: domain, module: protocol, loc: 90, delta: { add: 90, rem: 0 }, planned_change: { intent: "Frame { Binary(Vec<u8>) | Text(String) } with a 1-byte kind tag for the fixture file; one place decides that ticks are binary frames and control messages are JSON text frames." } }
  - { path: "crates/protocol/tests/document.rs", status: new, role: test, module: protocol, loc: 90, delta: { add: 90, rem: 0 }, planned_change: { intent: "AC-f: parse the message tables of docs/reference/protocol.md and assert that every MessageSpec name and field appears, and that the document names no message the code does not define." } }
  - { path: "crates/stream/Cargo.toml", status: new, role: config, module: stream, loc: 22, delta: { add: 22, rem: 0 }, planned_change: { intent: "Library plus test targets; depends on engine, protocol, tungstenite, serde_json, tracing." } }
  - { path: "crates/stream/src/lib.rs", status: new, role: service, module: stream, loc: 60, delta: { add: 60, rem: 0 }, planned_change: { intent: "Re-exports Server, ServeOptions, Session, Recorder, Replayer, StreamError; StreamError wraps EngineError and protocol errors with the Read-style explicit source, never #[from] on a type whose display repeats its source." } }
  - { path: "crates/stream/src/server.rs", status: new, role: service, module: stream, loc: 260, delta: { add: 260, rem: 0 }, imports: [tungstenite, tracing], planned_change: { intent: "Server::bind(127.0.0.1:0) reads the assigned port, writes SM_DATA_DIR/engine.port, emits socket.listening; accept() runs the tungstenite handshake with an Origin allowlist (null, file://, http://localhost) and a protocol-version check, emits socket.client or socket.refused; set_nodelay(true) on every stream; one thread per client." } }
  - { path: "crates/stream/src/session.rs", status: new, role: service, module: stream, loc: 280, delta: { add: 280, rem: 0 }, planned_change: { intent: "SocketSink implements engine::TickSink and pushes encoded frames into a sync_channel(BUFFER_TICKS); the writer thread drains it; a full channel blocks the simulation thread, which is the backpressure; emits socket.backpressure once per pause with paused_ms and the resume count; exposes a buffer gauge (Arc<AtomicUsize> high-water mark) for the test." } }
  - { path: "crates/stream/src/control.rs", status: new, role: service, module: stream, loc: 180, delta: { add: 180, rem: 0 }, planned_change: { intent: "Reads client commands on the same connection: Start and Pause gate production, SetSpeed is stored and echoed in the acknowledgement, QueueChange goes to protocol::Queue; every verdict is also written as a match-event row." } }
  - { path: "crates/stream/src/record.rs", status: new, role: service, module: stream, loc: 200, delta: { add: 200, rem: 0 }, planned_change: { intent: "Recorder writes a .smfx fixture: 32-byte header (magic SMFX, protocol version, match millis, frame count placeholder), then length-prefixed frames with their kind tag and tick index, then a trailer with the count and hash; emits fixture.recorded." } }
  - { path: "crates/stream/src/replay.rs", status: new, role: service, module: stream, loc: 200, delta: { add: 200, rem: 0 }, planned_change: { intent: "Replayer serves the same WebSocket protocol from a .smfx file, writing the stored bytes back out with no re-encoding, paced at speed x 50 frames per second through Instant; emits fixture.replayed." } }
  - { path: "crates/stream/src/events.rs", status: new, role: service, module: stream, loc: 140, delta: { add: 140, rem: 0 }, planned_change: { intent: "Watches the simulation for kick-off or restart, goal, and full-time; writes each as a JSON Lines row into matches/<match.id>/events.jsonl through one writer opened at kick-off, and sends the same message over the socket." } }
  - { path: "crates/stream/tests/hello.rs", status: new, role: test, module: stream, loc: 110, delta: { add: 110, rem: 0 }, planned_change: { intent: "AC-a: a client connects to a pre-bound listener and asserts the first message is the hello with engine version, owner id, and match id, before any tick frame." } }
  - { path: "crates/stream/tests/throughput.rs", status: new, role: test, module: stream, loc: 150, delta: { add: 150, rem: 0 }, planned_change: { intent: "AC-b: an unthrottled client reads a full 270,000-tick match; every tick arrives once and in order (the decoder rebuilds absolute positions and checks the tick counter), and the buffer high-water mark never exceeds the bound." } }
  - { path: "crates/stream/tests/backpressure.rs", status: new, role: test, module: stream, loc: 140, delta: { add: 140, rem: 0 }, planned_change: { intent: "AC-c: a client that sleeps between reads; the producer pauses at the bound (socket.backpressure fires, the gauge stays at the bound) and resumes on drain; the tick count at the end equals the tick count sent, so nothing is dropped." } }
  - { path: "crates/stream/tests/fixture.rs", status: new, role: test, module: stream, loc: 130, delta: { add: 130, rem: 0 }, planned_change: { intent: "AC-d: record a fixture, replay it, and compare the client-received byte sequence with the frame bytes in the file, the way determinism.rs compares two tick files." } }
  - { path: "crates/stream/tests/commands.rs", status: new, role: test, module: stream, loc: 120, delta: { add: 120, rem: 0 }, planned_change: { intent: "AC-e: an unknown change type is rejected with a message naming the type, verbatim; a valid change is acknowledged with a queue id and appears in the pending list." } }
  - { path: "crates/stream/tests/common/mod.rs", status: new, role: test, module: stream, loc: 90, delta: { add: 90, rem: 0 }, planned_change: { intent: "serve_on_ephemeral_port(config) -> (port, JoinHandle); connect(port) -> client; read_message(client); throttled_client(delay); mirrors the style of crates/engine/tests/common/mod.rs and sets SM_DATA_DIR per test." } }
  - { path: "crates/engine/src/sim.rs", status: modified, role: domain, module: engine, loc: 357, delta: { add: 30, rem: 2 }, planned_change: { intent: "Simulation gains take_events() -> Vec<EngineEvent> (kick-off, goal, full-time) filled during step(); the goal path already detects a goal and traces match.goal, so the event is recorded at the same place. No network type enters this crate." } }
  - { path: "crates/engine/src/record.rs", status: modified, role: domain, module: engine, loc: 351, delta: { add: 14, rem: 2 }, planned_change: { intent: "TickRecord gains a restart flag carried in the spare header bits of the frame (not the 192-byte file record, which is unchanged); FanoutSink<A, B> forwards on_tick to two sinks so a run can write a file and stream at once." } }
  - { path: "crates/engine/src/validate.rs", status: modified, role: domain, module: engine, loc: 140, delta: { add: 8, rem: 6 }, planned_change: { intent: "The anchor and jump rules read the restart flag instead of guessing from a ball jump above two metres; the sdlc-debt: marker at line 77 is removed with its shortcut." } }
  - { path: "crates/engine/src/data/tuning.rs", status: modified, role: domain, module: engine, loc: 120, delta: { add: 10, rem: 1 }, planned_change: { intent: "StreamTuning { buffer_ticks: 500 (range 10..=5000), keyframe_interval: 50 (range 1..=500) } as a fourth block in TuningFile, with garde ranges." } }
  - { path: "content/tuning.json", status: modified, role: data, module: content, loc: 90, delta: { add: 5, rem: 0 }, planned_change: { intent: "A stream block with buffer_ticks 500 and keyframe_interval 50 (PO Q10)." } }
  - { path: "content/README.md", status: modified, role: docs, module: content, loc: 150, delta: { add: 12, rem: 0 }, planned_change: { intent: "Document the stream block: every field, its unit, its default, and its bound." } }
