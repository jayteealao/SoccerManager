  - { path: "crates/engine-cli/src/serve.rs", status: new, role: cli, module: cli, loc: 120, delta: { add: 120, rem: 0 }, planned_change: { intent: "Loads content and teams, builds the config and the identity, binds the server, prints the port, and runs the simulation under client control until the client disconnects or the match ends; writes stats.json as simulate does." } }
