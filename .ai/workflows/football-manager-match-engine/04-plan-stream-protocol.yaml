risks:
  - { id: R1, severity: high, title: "The encoder lands on the hot path", body: "The engine produces 694,087 ticks per second; an allocation or a copy per tick inside on_tick would show up as wall time and as peak memory against the 384 ms and 5.62 MB tripwires.", mitigation: "encode_into writes into one reused 98-byte buffer owned by the sink; the channel carries a fixed-size frame, never a Vec per tick; step 19 measures bench --stream before the tests are declared done." }
  - { id: R2, severity: high, title: "Determinism through a second sink", body: "A stream run and a file run of one seed must produce the same ticks; a FanoutSink that reorders or drops would break the byte-identity test that engine-core and data-schemas-generator both rely on.", mitigation: "FanoutSink calls A then B in order and returns the first error; the existing determinism test keeps running on the file path, and the fixture test compares recorded bytes rather than re-encoded ones." }
  - { id: R3, severity: medium, title: "tungstenite buffers without a bound by default", body: "max_write_buffer_size defaults to usize::MAX, so a slow client would grow the write buffer instead of blocking, and the bounded-buffer criterion would pass in the channel and fail in the socket.", mitigation: "Set max_write_buffer_size to a few keyframes at construction; treat WriteBufferFull as the same pause signal as a full channel; the throttled-client test asserts the high-water mark, not just the absence of an error." }
  - { id: R4, severity: medium, title: "A delta step wider than one signed byte", body: "An i8 centimetre delta covers 1.27 m per tick; the ball cap of 40 m/s is 0.80 m per tick, but a teleport at a restart is unbounded.", mitigation: "The encoder forces a keyframe whenever any delta would overflow, and the restart event marks the tick; the codec test drives a restart and asserts a keyframe at that tick." }
  - { id: R5, severity: medium, title: "The Origin allowlist blocks the real viewer", body: "A page served from a future local HTTP server on another port would be refused by an allowlist of null, file://, and http://localhost.", mitigation: "The allowlist accepts any http://localhost and http://127.0.0.1 origin regardless of port, and the refusal line names the origin, so viewer-pitch can diagnose it in one look." }
  - { id: R6, severity: medium, title: "change.queue_id is outside the contract vocabulary", body: "Block A reserves change.queued_tick, change.applied_tick, and change.rejected_reason, but no key for the identifier the acknowledgement returns.", mitigation: "Emit change.queue_id as an additive extra, exactly as content.hash and teams were; the observability audit settles it and verify counts extras without failing." }
  - { id: R7, severity: low, title: "Three new threads inside one binary", body: "The simulation thread, the writer thread, and the reader thread must all end when the match ends or the client disconnects, or engine-cli serve hangs.", mitigation: "The channel disconnect is the shutdown signal in both directions; every test joins its handles with a timeout, and the CLI test asserts the process exits." }
  - { id: R8, severity: low, title: "The port file is stale after a crash", body: "engine.port holds the port of the last run; a page that reads it after a crash connects to nothing.", mitigation: "serve removes the file on a clean exit and the hello message carries match.id, so a page that reaches the wrong engine sees a different match and can reconnect." }
