files:
  - { path: "crates/protocol/src/message.rs", status: modified, role: domain, module: protocol, loc: 200, delta: { add: 14, rem: 2 }, planned_change: { intent: "TeamRef gains team.kit.primary and team.kit.secondary as lower-case hex strings with a leading #. The hello is the only place a page can learn a club's colours; today it carries team.id and team.name only. PROTOCOL_VERSION stays 1 because no field changes meaning and no message is removed." } }
  - { path: "crates/protocol/src/lib.rs", status: modified, role: domain, module: protocol, loc: 190, delta: { add: 4, rem: 2 }, planned_change: { intent: "The MESSAGES field list for hello gains the two kit keys, so the completeness test and the document test both see them." } }
  - { path: "crates/protocol/tests/document.rs", status: modified, role: test, module: rusttests, loc: 90, delta: { add: 6, rem: 0 }, planned_change: { intent: "The document test reads the two new hello fields out of docs/reference/protocol.md, so the reference cannot drift from the code." } }
  - { path: "crates/stream/src/server.rs", status: modified, role: service, module: stream, loc: 260, delta: { add: 12, rem: 2 }, planned_change: { intent: "The hello builder reads club.kit.primary and club.kit.secondary from the two loaded TeamFile values. Unit test: a hello built from the shipped defaults carries #c8102e for team A." } }
  - { path: "crates/stream/src/replay.rs", status: modified, role: service, module: stream, loc: 200, delta: { add: 60, rem: 22 }, imports: [protocol, tracing], planned_change: { intent: "Forward the stored hello verbatim instead of synthesising a new one. This retires a latent fault: the current code hard-codes keyframe_interval to DEFAULT_KEYFRAME_INTERVAL rather than reading the fixture, so a fixture recorded under a tuned interval would announce the wrong interval to the page. Carrying the stored hello also delivers the kit colours through replay with no extra work. Add the --sustain cap: serve() takes Option<f32> and paces at min(speed, sustain) while the hello still announces the requested speed, so the page receives a stream slower than it asked for. fixture.replayed gains sustain, null when absent." } }
  - { path: "crates/stream/src/lib.rs", status: modified, role: service, module: stream, loc: 60, delta: { add: 8, rem: 0 }, planned_change: { intent: "StreamError::FixtureNoHello, naming the fixture path when its first stored entry is not a hello. Explicit #[source], never #[from] on a type whose display repeats its source." } }
  - { path: "crates/engine-cli/src/web.rs", status: new, role: service, module: cli, loc: 220, delta: { add: 220, rem: 0 }, imports: [tracing], planned_change: { intent: "A std::net::TcpListener on 127.0.0.1:0, one thread, a blocking read of the request line, and a file response from the --web directory. GET and HEAD only; anything else answers 405. Any path containing .. or an absolute drive path answers 403. MIME table covers html, css, mjs, js, woff2, json, png, svg. Every response carries Cross-Origin-Opener-Policy: same-origin and Cross-Origin-Embedder-Policy: require-corp, which performance.measureUserAgentSpecificMemory requires, plus Cache-Control: no-store. Emits web.serving with dir, files, isolated, port." } }
  - { path: "crates/engine-cli/src/cli.rs", status: modified, role: cli, module: cli, loc: 170, delta: { add: 18, rem: 0 }, planned_change: { intent: "--web <DIR> on both ServeOpts and ReplayOpts, optional. --sustain <f32> on ReplayOpts only, optional, help text naming it a test harness for the viewer's lag notice. Every help line stays inside 80 columns." } }
  - { path: "crates/engine-cli/src/serve.rs", status: modified, role: cli, module: cli, loc: 90, delta: { add: 14, rem: 2 }, planned_change: { intent: "Start the static server before the socket and print both addresses, the page address last so it is the line a reader copies." } }
  - { path: "crates/engine-cli/src/replay.rs", status: modified, role: cli, module: cli, loc: 80, delta: { add: 18, rem: 3 }, planned_change: { intent: "Same two-address start, plus pass the sustain cap through to Replayer::serve." } }
  - { path: "crates/engine-cli/src/main.rs", status: modified, role: cli, module: cli, loc: 60, delta: { add: 4, rem: 1 }, planned_change: { intent: "Register the web module and thread the new options through the dispatcher." } }
  - { path: "crates/engine-cli/tests/web_cli.rs", status: new, role: test, module: rusttests, loc: 160, delta: { add: 160, rem: 0 }, planned_change: { intent: "The page address is printed; a missing --web directory is refused naming the path; a request path containing .. answers 403; a .mjs response carries text/javascript; every response carries both isolation headers; a POST answers 405." } }
  - { path: "crates/engine-cli/tests/cli_args.rs", status: modified, role: test, module: rusttests, loc: 170, delta: { add: 14, rem: 0 }, planned_change: { intent: "The two new options appear in help and no help line exceeds 80 columns." } }
  - { path: "crates/engine-cli/tests/stream_cli.rs", status: modified, role: test, module: rusttests, loc: 150, delta: { add: 22, rem: 0 }, planned_change: { intent: "--speed 8 --sustain 3 delivers at three times real time within 5 percent over ten seconds of match time; a replay's hello is byte-identical to the recorded one; a fixture whose first entry is not a hello is refused naming the path." } }
  - { path: "web/index.html", status: new, role: ui, module: page, loc: 90, delta: { add: 90, rem: 0 }, planned_change: { intent: "The page shell. Header band, three body columns, the pitch canvas and the control strip in the middle column, the side columns and the header present and empty for viewer-match-day to fill. The canvas carries role=img with a label and is paired with a visually hidden aria-live=polite region mirroring clock, speed and lag in text." } }
  - { path: "web/tokens.css", status: new, role: ui, module: page, loc: 70, delta: { add: 70, rem: 0 }, planned_change: { intent: "One :root block holding all 36 --tl- tokens from 02c-craft.md section 4. Every value is OKLCH; no pure black and no pure white appears anywhere. This supersedes the --mv- prefix in 02b-design.md and 02b-design.yaml." } }
  - { path: "web/layout.css", status: new, role: ui, module: page, loc: 110, delta: { add: 110, rem: 0 }, planned_change: { intent: "CSS Grid at 1280 by 800: a 56-pixel header row, then three fixed columns of 336, 616 and 296 pixels with an 8-pixel gutter. No breakpoints and no fluid tracks, because stack.platforms names one desktop target." } }
  - { path: "web/fonts/fonts.css", status: new, role: ui, module: page, loc: 40, delta: { add: 40, rem: 0 }, planned_change: { intent: "@font-face at font-display: swap for Barlow Condensed 700 and IBM Plex Sans 400/500/600, all four loaded from web/fonts/ and never from a font service." } }
  - { path: "web/fonts/barlow-condensed-700.woff2", status: new, role: asset, module: page, loc: 0, delta: { add: 0, rem: 0 }, planned_change: { intent: "SIL Open Font License display face for the score bug, the goal banner and report titles." } }
  - { path: "web/fonts/ibm-plex-sans-400.woff2", status: new, role: asset, module: page, loc: 0, delta: { add: 0, rem: 0 }, planned_change: { intent: "SIL Open Font License body face. Carries real OpenType tabular figures, which font-variant-numeric: tabular-nums needs." } }
  - { path: "web/fonts/ibm-plex-sans-500.woff2", status: new, role: asset, module: page, loc: 0, delta: { add: 0, rem: 0 }, planned_change: { intent: "Numeric weight for the clock, the score, the statistics and the frame-time counter." } }
  - { path: "web/fonts/ibm-plex-sans-600.woff2", status: new, role: asset, module: page, loc: 0, delta: { add: 0, rem: 0 }, planned_change: { intent: "Control-label weight and the canvas shirt numbers." } }
  - { path: "web/components/match-control.css", status: new, role: ui, module: page, loc: 140, delta: { add: 140, rem: 0 }, planned_change: { intent: "The button primitive of record. Four heights (28, 36, 44, 52), five states, two themes, all defined; this slice uses the 28 and 36 sizes so later slices add no new geometry. Colour transition at 150 ms; no press-scale, because the playback strip is pressed tens of times per match. Focus ring at 3:1 via :focus-visible. A centred pseudo-element lifts any control under 40 by 40 to a 40 by 40 hit area." } }
  - { path: "web/signal.mjs", status: new, role: domain, module: logic, loc: 60, delta: { add: 60, rem: 0 }, planned_change: { intent: "One exported signal(name, fields) that stamps the viewer-event envelope, writes one JSON Lines row to console.info, and pushes into a 256-row ring. The only transport the page-side signals have; /wf observability owns closing that gap." } }
  - { path: "web/colour.mjs", status: new, role: domain, module: logic, loc: 130, delta: { add: 130, rem: 0 }, planned_change: { intent: "hexToOklch, clampLightness into 0.20 to 0.88, contrast(a, b), and safeKit returning the fill, the ring and the shirt-number colour. The ring is the clamped secondary when it measures at least 3:1 against --tl-pitch, otherwise --tl-pitch-line. Needed because content/teams/default-a.json ships #000000, which DESIGN.md bans and which would pass a bare 3:1 test." } }
  - { path: "web/decode.mjs", status: new, role: domain, module: logic, loc: 150, delta: { add: 150, rem: 0 }, planned_change: { intent: "The constants ported from codec.rs and frame.rs, and decodeInto(buffer, prev, out) reading a DataView at fixed little-endian offsets and writing centimetres straight into caller arrays. A keyframe or restart writes absolutes; a delta adds signed-byte steps. A short frame or an unknown tag is refused through viewer.decode_refused and returns null. No allocation per tick." } }
  - { path: "web/interpolate.mjs", status: new, role: domain, module: logic, loc: 40, delta: { add: 40, rem: 0 }, planned_change: { intent: "between(a, b, t) with t clamped to [0, 1], writing into a caller-supplied output array. The function cannot express a position outside the segment, which is RIM-5 as a type constraint rather than a comment. This is commitment C2 in forty lines." } }
  - { path: "web/history.mjs", status: new, role: domain, module: logic, loc: 160, delta: { add: 160, rem: 0 }, planned_change: { intent: "Three Int16Array buffers sized from hello.ticks_expected, plus tickAt(i), append(...) and bytes(). 270,000 ticks at 47 components is 25,380,000 bytes, twelvefold under the 300 MB budget, and rewind is a direct index rather than a 49-step keyframe walk. Buffers double if stoppage time runs the match past ticks_expected. Emits viewer.history with the exact byte count and the browser gauge." } }
  - { path: "web/schedule.mjs", status: new, role: domain, module: logic, loc: 190, delta: { add: 190, rem: 0 }, planned_change: { intent: "A fixed-timestep accumulator driven by requestAnimationFrame timestamps. Each frame advances simulated time by elapsed x speed, consumes whole ticks, and renders at the fraction between the last two consumed ticks. When ticks owed exceed ticks available the cursor jumps and the skipped count rises; no path extrapolates. Frame rate is derived from consecutive timestamp deltas, never from a callback count, and refresh_hz rides beside it so a 144 Hz panel cannot produce a false pass." } }
  - { path: "web/stoppages.mjs", status: new, role: domain, module: logic, loc: 90, delta: { add: 90, rem: 0 }, planned_change: { intent: "One sorted index merged from restart-flagged ticks and event-message ticks, with two entries inside 25 ticks collapsed to the earlier so a goal and its restart are one stoppage. next(fromTick) and prev(fromTick). Merging two sources that already exist beats adding a third." } }
  - { path: "web/mark.mjs", status: new, role: ui, module: render, loc: 110, delta: { add: 110, rem: 0 }, planned_change: { intent: "One exported function drawing the three zones from a tile size, a corner radius of size times 0.21, and the three pitch tokens, with four variants. Generates the favicon at load. No logo is ever loaded from an image file; club crests call the same function with kit colours in place of the turf." } }
  - { path: "web/pitch.mjs", status: new, role: ui, module: render, loc: 260, delta: { add: 260, rem: 0 }, imports: [colour, mark], planned_change: { intent: "The coordinate map from the engine's centred metre space (x -52.5..52.5, y -34..34) onto 616 by 411 pixels, the markings, the 22 markers with rings and shirt numbers, and the ball with its falling-alpha trail drawn as one path. Backing store scaled by devicePixelRatio; getContext with alpha: false; integer coordinates; one fillStyle change per team; static markings pre-rendered once to an offscreen canvas and blitted each frame." } }
  - { path: "web/socket.mjs", status: new, role: service, module: wire, loc: 140, delta: { add: 140, rem: 0 }, imports: [decode, signal], planned_change: { intent: "binaryType = 'arraybuffer', which avoids the asynchronous Blob step the default would force at 400 frames per second. The hello is decoded once; binary frames go to decode.mjs and text frames to the message handler. Emits viewer.connected and viewer.socket_drops at the two ends." } }
  - { path: "web/playback.mjs", status: new, role: service, module: wire, loc: 240, delta: { add: 240, rem: 0 }, imports: [stoppages, history, signal], planned_change: { intent: "Play and pause, the 1x to 8x speed selector, skip to next stoppage, the rewind scrubber over the history, and the sustained-rate estimator. The estimator compares tick arrival against the requested speed, drops playback to the measured rate, and emits viewer.lag. The browser exposes no inbound-queue depth, so this measurement is the only way the notice can exist." } }
  - { path: "web/main.mjs", status: new, role: service, module: wire, loc: 180, delta: { add: 180, rem: 0 }, imports: [socket, playback, schedule, pitch, history, signal], planned_change: { intent: "Builds the shell, starts the socket, drives the scheduler, renders through pitch.mjs, and exposes window.__touchline with lastRendered(), signals, history and frame. The hook is the observability seam three acceptance criteria read; it is read-only and exposes no setter." } }
  - { path: "web/tests/helpers.mjs", status: new, role: test, module: jstests, loc: 90, delta: { add: 90, rem: 0 }, planned_change: { intent: "A synthetic tick stream, an injectable clock for the scheduler, and recorded frame bytes captured from the seed-7 fixture. Mirrors the shape of crates/stream/tests/common/mod.rs." } }
  - { path: "web/tests/interpolate.test.mjs", status: new, role: test, module: jstests, loc: 70, delta: { add: 70, rem: 0 }, planned_change: { intent: "AC-b. t = 0 returns a exactly; t = 1 returns b exactly; every t in [0, 1] lies on the segment within one centimetre; t = 1.5 and t = -0.5 clamp and never exceed b or precede a." } }
  - { path: "web/tests/schedule.test.mjs", status: new, role: test, module: jstests, loc: 130, delta: { add: 130, rem: 0 }, planned_change: { intent: "AC-c. At 8x with 50 ticks per second arriving, the scheduler consumes 400 ticks per second and the rendered cursor never passes the newest received tick; at 1x no tick is skipped; a 16-millisecond stall causes no extrapolation." } }
  - { path: "web/tests/history.test.mjs", status: new, role: test, module: jstests, loc: 90, delta: { add: 90, rem: 0 }, planned_change: { intent: "AC-g part one. 270,000 ticks report exactly 25,380,000 history bytes; a read at tick N returns exactly what was written at tick N; growth past ticks_expected preserves every earlier tick." } }
  - { path: "web/tests/decode.test.mjs", status: new, role: test, module: jstests, loc: 110, delta: { add: 110, rem: 0 }, planned_change: { intent: "Over recorded bytes: a keyframe round-trips; a 50-frame cycle reconstructs every absolute position exactly; a restart frame is reported as a restart; a truncated frame is refused and named." } }
  - { path: "web/tests/colour.test.mjs", status: new, role: test, module: jstests, loc: 80, delta: { add: 80, rem: 0 }, planned_change: { intent: "#000000 clamps to lightness 0.20 and never returns pure black; #c8102e survives unchanged; a secondary failing 3:1 returns the pitch-line fallback; the chosen shirt-number colour is always the higher-contrast of the two." } }
  - { path: "web/tests/stoppages.test.mjs", status: new, role: test, module: jstests, loc: 70, delta: { add: 70, rem: 0 }, planned_change: { intent: "A goal at tick T and a restart at T + 12 collapse to one entry at T; a restart with no event stands alone; next past the last entry returns null." } }
  - { path: "docs/reference/protocol.md", status: modified, role: docs, module: docs, loc: 210, delta: { add: 34, rem: 2 }, planned_change: { intent: "The hello table gains team.kit.primary and team.kit.secondary. A new section documents the static file server, its MIME table, and the two isolation headers, including the constraint that require-corp refuses any cross-origin subresource. The document test parses these tables, so the reference cannot drift." } }
  - { path: "README.md", status: modified, role: docs, module: docs, loc: 90, delta: { add: 26, rem: 2 }, planned_change: { intent: "The run instructions the shape's Documentation Plan requires: build the engine, run engine-cli serve --seed 42 --web web, open the printed address. Audience is contributors and players; engine internals stay out." } }
  - { path: "DESIGN.md", status: modified, role: docs, module: docs, loc: 60, delta: { add: 14, rem: 0 }, planned_change: { intent: "The ten new --tl- token rows the visual contract adds beyond the original set, so DESIGN.md and web/tokens.css never disagree." } }
