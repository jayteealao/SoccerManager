risks:
  - { id: R1, severity: high, title: "The refresh-rate false pass", body: "requestAnimationFrame fires at the display's refresh rate, not at 60 Hz. On a 120 or 144 Hz panel a callback count reports 120 or 144, and a naive 60-frames-per-second assertion passes for the wrong reason while telling nobody anything true.", mitigation: "Derive frame rate from consecutive timestamp deltas, never from a count, and report refresh_hz beside every reading in viewer.frame_budget. Verify records both numbers or the drive does not count." }
  - { id: R2, severity: high, title: "No browser has ever opened this socket", body: "Three slices verified the protocol against a Rust client only; 06-verify-stream-protocol.md line 241 says so directly. A handshake, Origin, version-query or isolation-header fault would otherwise surface tangled up with rendering code.", mitigation: "Step 12 is a deliberate ten-line page that connects, reads the hello and logs it, driven in the in-app browser before any rendering code exists. Confirm in particular that require-corp does not refuse the four same-origin woff2 files." }
  - { id: R3, severity: medium, title: "Interpolation that quietly extrapolates", body: "This is RIM-5 and commitment C2: a viewer that invents movement between ticks satisfies the criterion in letter and breaks the promise in spirit.", mitigation: "Structural, not a review note. between(a, b, t) clamps t into [0, 1] and cannot express a position outside the segment; the scheduler moves the cursor rather than the fraction. Two unit tests drive t = 1.5 and t = -0.5 directly." }
  - { id: R4, severity: medium, title: "The --sustain cap is a test harness only", body: "It exists to make AC-e drivable. Reachable from a real match, it would silently throttle a live engine.", mitigation: "It sits on replay alone, never on serve, and its help text names it a test harness for the viewer's lag notice. Watch that a later slice does not promote it." }
  - { id: R5, severity: medium, title: "The isolation headers restrict what the page may load later", body: "Cross-Origin-Embedder-Policy: require-corp refuses any cross-origin subresource. Everything this page loads is same-origin, so nothing is lost today, but a later slice wanting an external resource will hit it.", mitigation: "web.serving reports isolated so a run with the headers off is visible rather than silently ungauged, and docs/reference/protocol.md records the constraint beside the header." }
  - { id: R6, severity: medium, title: "The fixture must be re-recorded", body: "From step 3 onward the stored hello is forwarded verbatim, so a fixture recorded before step 1 carries no kit colours and the page would draw grey markers with no error anywhere.", mitigation: "Step 7 re-records at seed 7, and step 3's byte-identity test makes a stale fixture fail loudly rather than render wrongly." }
  - { id: R7, severity: medium, title: "History growth past ticks_expected", body: "Stoppage time makes a match run longer than the hello predicts, and a fixed buffer would either refuse or silently drop the closing minutes.", mitigation: "Buffers double rather than refusing, and a test drives growth past ticks_expected and asserts every earlier tick survives." }
  - { id: R8, severity: low, title: "Path traversal against the static server", body: "The server serves an operator-named directory on loopback to a browser the operator opened, so the exposure is small, but a .. path would still read outside the directory.", mitigation: "Refuse any path containing .. or an absolute drive path with 403, serve GET and HEAD only, and answer anything else with 405. A test drives each case." }
  - { id: R9, severity: low, title: "page_bytes never resolves", body: "performance.measureUserAgentSpecificMemory is asynchronous and the browser may coalesce or defer it, so the gauge can read null at the moment verify looks.", mitigation: "Write null, never block a frame, and treat a null at verify as a failed drive rather than a pass. The exact history byte count sits beside it and is always available, which is why plan Round 3 Q9 kept both numbers." }
  - { id: R10, severity: low, title: "viewer-event is a fifth record kind", body: "The observability contract's Block A names four record kinds and this is not one of them.", mitigation: "Emit it as an additive extra, exactly as content.hash and change.queue_id were, and let /wf observability audit settle whether it is a kind of its own or a variant of match-event." }
