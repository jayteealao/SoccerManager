risks:
  - { title: "A scripted hook breaks the 10 percent processor-time budget", severity: high, body: "The carrier decides every tick (product-owner choice); an interpreted call per tick would cost several times the budget.", mitigation: "Offsets are cached and refreshed on a carrier change, a stoppage, or every refresh_ticks (default 25); step 2 measures the call cost first and stops for the product owner if one decide call exceeds 3 microseconds; decision_interval_ticks is never changed." }
  - { title: "The plan is written before tactics-and-ai and calibration are built", severity: high, body: "The scored-options layer, the commentator, the calibrate harness, and the calibration baseline are drawn from sibling plans.", mitigation: "Step 1 re-reads the landed seams and stops for a plan re-review if the option set, the card call site, or the commentary attachment point differs." }
  - { title: "The default rhai engine can read files through import", severity: medium, body: "Engine::new() installs a FileModuleResolver (upstream src/engine.rs, read this run).", mitigation: "The sandbox replaces it with a resolver that refuses and records every import; the import-escape fixture proves it." }
  - { title: "A script call perturbs determinism", severity: medium, body: "A hook that drew from the engine random stream or kept state would change every later draw or diverge on resume.", mitigation: "No random function is exposed, scripts are stateless per call, the cache clears at every stoppage, and a test compares two seeded runs byte for byte." }
  - { title: "Script output corrupts the record stream", severity: medium, body: "rhai print writes to stdout by default, and stdout carries JSON records.", mitigation: "on_print and on_debug route to tracing; a test asserts stdout holds only records." }
