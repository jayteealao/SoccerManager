  - { path: "Cargo.toml", status: modified, role: config, module: root, loc: 40, delta: { add: 3, rem: 1 }, planned_change: { intent: "Add crates/script to the workspace members; add rhai = { version = \"1.26\", features = [\"sync\"] } to workspace.dependencies." } }
  - { path: "Cargo.lock", status: modified, role: config, module: root, loc: 0, delta: { add: 60, rem: 0 }, planned_change: { intent: "Regenerated by cargo; rhai 1.26.x and its pure-Rust dependencies (smallvec, thin-vec, ahash, num-traits, once_cell, bitflags, smartstring, rhai_codegen)." } }
  - { path: "crates/script/Cargo.toml", status: new, role: config, module: script, loc: 25, delta: { add: 25, rem: 0 }, planned_change: { intent: "Package script; depends on engine, rhai (workspace, sync), serde, serde_json, garde, sha2, thiserror, tracing; dev-dependency criterion; license MIT OR Apache-2.0 from the workspace." } }
  - { path: "crates/script/src/lib.rs", status: new, role: domain, module: script, loc: 60, delta: { add: 60, rem: 0 }, planned_change: { intent: "Public entry: ScriptPack::load(dir) -> Result<LoadedPack, ScriptError>, LoadedPack::plugins() -> engine::plugin::Plugins; re-exports; crate docs name the sandbox limits." } }
  - { path: "crates/script/src/pack.rs", status: new, role: domain, module: script, loc: 170, delta: { add: 170, rem: 0 }, planned_change: { intent: "pack.json schema version 1 with deny_unknown_fields and garde: id (kebab, 1-40), version (semver text), name, plugin_api (must equal engine PLUGIN_API_VERSION), entry (a .rhai file name inside the pack folder, no path separators), hooks (subset of decision, rule, commentary, at least one), decision.refresh_ticks 5..=250 default 25, limits.max_operations 1000..=50000 default 10000. Reads the entry file, rejects a path that leaves the folder, computes sha256 over pack.json then the entry bytes; identity text id@version+sha12. Every refusal names the file, the field path, and the reason." } }
  - { path: "crates/script/src/sandbox.rs", status: new, role: domain, module: script, loc: 200, delta: { add: 200, rem: 0 }, planned_change: { intent: "Builds rhai::Engine::new() then: set_module_resolver(DenyResolver) that refuses every import and records a denial; disable_symbol(\"eval\"); on_print and on_debug routed to tracing (never stdout, which carries records); set_max_operations(pack limit); set_max_call_levels(16); set_max_expr_depths(64, 32); set_max_string_size(1024); set_max_array_size(256); set_max_map_size(64); on_progress checks a 2 ms wall-clock backstop every 256 operations. Compiles the AST once, runs top-level statements once under the same budget, then calls with CallFnOptions eval_ast(false). Classifies errors: ErrorTooManyOperations and ErrorTerminated -> Aborted(budget); ErrorModuleNotFound from DenyResolver and ErrorFunctionNotFound -> Denied(name); anything else -> Aborted(error)." } }
  - { path: "crates/script/src/hooks.rs", status: new, role: domain, module: script, loc: 220, delta: { add: 220, rem: 0 }, planned_change: { intent: "ScriptDecisionHook, ScriptRuleHook, ScriptCommentaryHook implement the engine traits. Contexts are registered custom types with getters (no map building per call). decide(ctx) returns an object map of per-option offsets {pass, dribble, shoot, clear, hold}; a missing key is 0; a non-finite or out-of-range value (outside -10..10) is an error. card(ctx) returns \"none\", \"yellow\", \"red\", or () to keep the referee's call. line(ctx) returns a string of at most 280 characters or () to keep the native line. Circuit breaker: three consecutive aborts or denials disable that hook for the rest of the match and report Disabled." } }
  - { path: "crates/script/tests/sandbox.rs", status: new, role: test, module: script-tests, loc: 170, delta: { add: 170, rem: 0 }, planned_change: { intent: "AC-2: the looping pack aborts on a tick, a Script event with outcome aborted is recorded, the tracing warning is captured, and the carrier's option equals the no-pack option on that tick; the match runs to full time. AC-3: the import pack and the network-call pack are denied, a Script event with outcome denied names the import or the function, and the match continues. Also: three consecutive aborts disable the hook; eval in a pack is refused at load; print output never reaches stdout." } }
  - { path: "crates/script/tests/decision.rs", status: new, role: test, module: script-tests, loc: 140, delta: { add: 140, rem: 0 }, planned_change: { intent: "AC-1 engine side: seed 42, 90 minutes, the shoot-bias fixture pack raises summed shots above the no-pack match and a scenario scene flips the carrier from pass to shot; the same seed and pack twice give byte-identical tick records; without a pack the tick records equal the pre-slice build (sha256 recorded at step 0)." } }
  - { path: "crates/script/tests/fixtures/", status: new, role: test, module: script-tests, loc: 90, delta: { add: 90, rem: 0 }, planned_change: { intent: "Five fixture packs, pack.json plus main.rhai each (10 files): shoot-bias (large shoot offset in range), looping (loop {} in decide), import-escape (import \"../../../Cargo\" as x), network-call (http_get(\"http://example.invalid\")), bad-return (returns a NaN offset)." } }
  - { path: "crates/script/benches/hook_call.rs", status: new, role: test, module: script-tests, loc: 70, delta: { add: 70, rem: 0 }, planned_change: { intent: "Criterion: one decide call of the sample pack with a representative context; one card call; gate read at step 2 (median at most 3 microseconds per decide call)." } }
  - { path: "crates/engine/src/plugin.rs", status: new, role: domain, module: engine, loc: 180, delta: { add: 180, rem: 0 }, planned_change: { intent: "The versioned plugin interface: PLUGIN_API_VERSION = 1; HookPoint { Decision, Rule, Commentary }; HookOutcome<T> { Value(T), Keep, Aborted(AbortReason), Denied(DenialKind), Disabled }; DecisionContext, FoulContext, LineContext (plain Copy data); OptionOffsets([f64; 5]); traits DecisionHook, RuleHook, CommentaryHook: Send; Plugins { pack: Option<PackIdentity>, decision, rule, commentary, stats: ScriptStats { calls, aborts, denials, disabled } }. No dependency on any runtime." } }
  - { path: "crates/engine/src/lib.rs", status: modified, role: domain, module: engine, loc: 60, delta: { add: 2, rem: 0 }, planned_change: { intent: "pub mod plugin; re-export PLUGIN_API_VERSION." } }
  - { path: "crates/engine/src/sim.rs", status: modified, role: domain, module: engine, loc: 700, delta: { add: 60, rem: 2 }, planned_change: { intent: "Simulation gains plugins: Plugins (empty by default) and script_cache { carrier, until_tick, offsets }; set_plugins(Plugins) before the first step; the cache clears at every stoppage and every carrier change; EngineEventKind::Script with a Copy ScriptNote { hook, outcome }; MatchConfig::fold_pack_hash(sha) sets content_hash = hex12(sha256(content_hash bytes || pack sha)) so the snapshot's existing content check refuses a resume with a different or missing pack." } }
  - { path: "crates/engine/src/decision.rs", status: modified, role: domain, module: engine, loc: 420, delta: { add: 40, rem: 2 }, planned_change: { intent: "After the scored options are computed and before the best is chosen, add the cached offsets; refresh the cache through the decision hook on a carrier change, after a stoppage, or when refresh_ticks have passed; an aborted, denied, or disabled result keeps zero offsets for that refresh and pushes a Script event. No random draw on this path, so the random stream stays aligned with the no-pack match." } }
  - { path: "crates/engine/src/rules/mod.rs", status: modified, role: domain, module: engine, loc: 480, delta: { add: 18, rem: 1 }, planned_change: { intent: "At the card_outcome call site, after the referee's draw, offer the card to the rule hook; Value replaces it, Keep and any failure keep the referee's card; a failure pushes a Script event." } }
  - { path: "crates/engine/src/scenario.rs", status: modified, role: domain, module: engine, loc: 130, delta: { add: 8, rem: 0 }, planned_change: { intent: "Builder method plugins(Plugins) so tests attach a pack to a scene." } }
