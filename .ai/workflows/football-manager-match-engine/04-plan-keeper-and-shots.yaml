risks:
  - { title: "The red-card criterion still fails", severity: high, body: "On shipped play the lone-forward verify measured control home 1.0083, keeper arm full 1.6375 against reduced 2.6667, striker 1.2083 against 1.7875, limit 1.6133. The measured cause is that a side with ten men attacks as if it had eleven, which the save and block model touches only indirectly.", mitigation: "The criterion test runs unchanged after tuning. If it fails, implement stops and reports each arm with its figures. No limit is raised and no lever outside this slice's scope is added (steer.md, Q-LF2)." }
  - { title: "Corners stay under 3.0 per team", severity: high, body: "Today 0.005 corners per team. Corners now depend on parries, blocks and deflections physically crossing the goal line.", mitigation: "The parry and block speed, spread and loft are tuned in the inner loop; the census test shows which outcome is short. No corner is ever created without a crossing (RIM-9)." }
  - { title: "The save curve and the xG refit feed each other", severity: medium, body: "If the save chance read the reported xG, every refit would change the save rate.", mitigation: "The save curve reads a fixed quality model (today's coefficients) and the reported xG is refitted separately, last." }
  - { title: "Every seeded result moves", severity: medium, body: "The on-target check, block rolls and save rolls consume draws, so pinned tests move (shoot-out, extra time, match stats, full match, determinism).", mitigation: "Each moved expectation is re-derived and recorded with its reason. No tolerance is widened." }
  - { title: "Goals leave the band", severity: low, body: "Goals per match may leave the 2.4 to 3.2 band until realism-tuning.", mitigation: "Accepted by the product owner (slice Risks); band misses are recorded, not failed (Q-E4)." }
