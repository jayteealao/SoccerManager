files:
  - { path: "crates/engine/src/tuning.rs", status: modified, role: config, module: tuning, loc: 474, delta: { add: 90, rem: 0 }, planned_change: { intent: "A nested ShotTuning block (field shots, serde default, garde dive): loft_max, save_high 0.891 and save_low 0.272 (the sourced save curve), a fixed quality model with today's xG coefficients, save_hold, parry_speed, parry_spread, parry_loft, block_reach, block_chance, block_speed, block_spread, penalty_xg, and the three shoot-out constants moved from rules/mod.rs (penalty_spread, keeper_dive_m, keeper_stays). Each value has garde bounds. TUNING_VERSION stays 2." } }
  - { path: "content/tuning.json", status: modified, role: config, module: tuning, loc: 0, delta: { add: 20, rem: 3 }, planned_change: { intent: "The shots block at its starting values, then at the values the tuning loop chooses. shot_noise and keeper_reach may move inside their bounds, and the three xg coefficients are refitted last." } }
  - { path: "crates/engine/src/shot.rs", status: new, role: domain, module: shot, loc: 0, delta: { add: 180, rem: 0 }, planned_change: { intent: "Pure functions with unit tests: on_target(ball, attack_x, t) integrates a copy of the ball to the goal line and reports whether it crosses between the posts under the bar; quality(from, attack_x, t) is the fixed shot-quality model; save_chance(quality, t) is the linear curve from save_high at 0.05 to save_low at 0.40, clamped; deflect(vel, away, speed_share, spread, loft, draw) gives the velocity of a parry or a block. No random draw is taken inside; the caller passes the draws." } }
  - { path: "crates/engine/src/lib.rs", status: modified, role: domain, module: shot, loc: 71, delta: { add: 1, rem: 0 }, planned_change: "Declares the shot module." }
  - { path: "crates/engine/src/decision.rs", status: modified, role: domain, module: shot, loc: 803, delta: { add: 3, rem: 1 }, planned_change: { intent: "shot_kick draws the loft from 0 to shots.loft_max instead of 0 to 2.5, so a shot can rise over the bar. The draw order does not change." } }
  - { path: "crates/engine/src/sim.rs", status: modified, role: domain, module: contest, loc: 1181, delta: { add: 110, rem: 20 }, planned_change: { intent: "apply_kick computes on-target from the trajectory after the kick and counts it then; a penalty shot's xG is shots.penalty_xg. resolve_possession: while a shot is in flight, an opposing outfield player within block_reach rolls once per flight to block (the ball is deflected, the defending side is the last touch); the keeper attempts a save only on an on-target flight, one roll per flight with save_chance(quality), then held (save_hold) or parried (deflected, defending last touch). An off-target shot is never touched by the keeper while fast. gain() no longer counts a keeper catch as on target. A read accessor last_touch() under the scenario feature. New transient flight fields are cleared at every dead ball and never enter the snapshot." } }
  - { path: "crates/engine/src/rules/mod.rs", status: modified, role: domain, module: contest, loc: 1095, delta: { add: 25, rem: 25 }, planned_change: { intent: "goal() stops counting on-target (counted at the kick). take_restart marks the penalty kick for its xG and uses shots.penalty_spread. The shoot-out save uses the same save model on the penalty's quality instead of keeper_catch_chance x SHOOTOUT_HOLD; its dive uses shots.keeper_dive_m and shots.keeper_stays. The three hand-set constants and their known-limit comment are removed." } }
  - { path: "crates/engine/src/scenario.rs", status: modified, role: test-support, module: seams, loc: 281, delta: { add: 25, rem: 0 }, planned_change: { intent: "Scene::penalty(team, taker): a penalty dead ball ready on the next tick, as the referee would set it. The scenario feature only." } }
  - { path: "crates/engine/tests/keeper_and_shots.rs", status: new, role: test, module: tests, loc: 0, delta: { add: 420, rem: 0 }, planned_change: { intent: "Fast scenes on the real engine: wide, over the bar, blocked, held, parried to a corner, and scored, each with scripted referee draws; a wide shot is not on target, draws no save roll and restarts with a goal kick. 500 scripted penalty scenes convert 70 to 85 percent. Slow and ignored: set pieces arise from play over 200 matches (every corner follows a defending last touch and a crossing of the goal line), an outcome census, and the xG refit harness that prints three fitted coefficients." } }
  - { path: "crates/engine/tests/content.rs", status: modified, role: test, module: tests, loc: 236, delta: { add: 30, rem: 0 }, planned_change: { intent: "Pins the shots block, and a tuning block without it loads with the defaults." } }
  - { path: "crates/engine/tests/acting_keeper.rs", status: modified, role: test, module: tests, loc: 242, delta: { add: 15, rem: 15 }, planned_change: { intent: "The stand-in keeper's fast-shot test scripts the save roll and the hold roll of the new model instead of setting keeper_catch_chance; the penalty and shoot-out stand-in tests keep their meaning." } }
  - { path: "crates/engine/tests/match_stats.rs", status: modified, role: test, module: tests, loc: 0, delta: { add: 10, rem: 3 }, planned_change: { intent: "The scripted shot counts on target at the kick when its trajectory is on target, and not when it is wide." } }
  - { path: "crates/engine/tests/rules_shootout.rs", status: modified, role: test, module: tests, loc: 270, delta: { add: 5, rem: 5 }, planned_change: { intent: "Seeded shoot-out expectations are re-derived and recorded; forced-outcome tests are unchanged." } }
  - { path: "crates/engine/tests/defending.rs (a_sending_off_gives_no_advantage)", status: external, role: test, module: tests, loc: 0, delta: { add: 0, rem: 0 }, planned_change: { intent: "Unchanged: the red-card criterion test on balanced fixtures (seeds 1 to 120 in both club orders), with its limits." } }
  - { path: "docs/reference/data-files.md", status: modified, role: docs, module: docs, loc: 427, delta: { add: 25, rem: 1 }, planned_change: { intent: "The shots block rows and one paragraph on on-target, saves, parries and blocks; keeper_catch_chance now covers fast balls that are not shots." } }
