files:
  - { path: "web/match-state.mjs", status: new, role: domain, module: state, loc: 200, delta: { add: 200, rem: 0 }, planned_change: { intent: "Pure reducer from event, stats, and condition messages to the match state at a given tick: score, feed entries, cards, injuries, substitutions, goal ticks, the newest statistics, and the newest energy values. Everything is keyed by tick and released by the rendered tick, never by arrival, because the stream runs up to 500 ticks ahead of playback and rewind moves the cursor backwards. One exported table holds every event-kind string the new modules read." } }
  - { path: "web/feed.mjs", status: new, role: ui, module: panels, loc: 170, delta: { add: 170, rem: 0 }, imports: [match-state, signal], planned_change: { intent: "A per-frame batcher (pure core) plus the feed renderer. Released entries collect in one array and flush once per animation frame through one DocumentFragment, so an 8x burst of more than 10 events per second inserts every event with none dropped. Goals, cards, substitutions, and injuries carry a highlight class and a text label. Each line is the event's commentary field; a tactics-change row shows the event kind in words." } }
  - { path: "web/scoreboard.mjs", status: new, role: ui, module: panels, loc: 120, delta: { add: 120, rem: 0 }, imports: [mark], planned_change: { intent: "The 56-pixel header: team names, kit chips drawn by the mark function, score bug in Barlow Condensed 700, clock and speed indicator in tabular numerals. Reads 0 to 0 at kick-off." } }
  - { path: "web/lineups.mjs", status: new, role: ui, module: panels, loc: 170, delta: { add: 170, rem: 0 }, planned_change: { intent: "Two columns from the hello roster (position, shirt, name) with a fatigue bar and a condition word from the released condition message, plus card, injury, and sent-off words from released events. The band word (Fresh, Tiring, Exhausted) is always written beside the colour. A substitution swaps the row to the bench entry named by player.secondary_id." } }
  - { path: "web/stats.mjs", status: new, role: ui, module: panels, loc: 130, delta: { add: 130, rem: 0 }, planned_change: { intent: "Pure mapping from a stats message to the panel model (nine rows, home and away, read from the stats.* keys), and the renderer. Updates when a newer stats message is released, never per tick." } }
  - { path: "web/goal-moment.mjs", status: new, role: ui, module: panels, loc: 110, delta: { add: 110, rem: 0 }, planned_change: { intent: "Score-bug pulse, banner in and out within 1.5 seconds of wall time, and the feed highlight, all applied in the same animation frame as the goal tick. Under prefers-reduced-motion the banner appears and leaves without motion and the pulse is off." } }
  - { path: "web/components/panels.css", status: new, role: ui, module: page, loc: 220, delta: { add: 220, rem: 0 }, planned_change: { intent: "Score bug, banner, feed rows, lineup rows, fatigue bar, and statistics grid, all on the existing --tl- tokens. Transitions on opacity and transform only; a reduced-motion block (shared with the data-motion proxy) sets them to 0.01ms." } }
  - { path: "web/index.html", status: modified, role: ui, module: page, loc: 115, delta: { add: 70, rem: 12 }, planned_change: { intent: "Replace the three empty regions and the header placeholder with the panel markup, the empty-state feed text, and the banner element." } }
  - { path: "web/main.mjs", status: modified, role: service, module: page, loc: 280, delta: { add: 70, rem: 8 }, planned_change: { intent: "Pass the hello roster to the lineups; route event, stats, and condition messages into match-state; flush panels once per frame from the rendered tick; extend the read-only hook with matchDay(); name full time distinctly from a dropped stream." } }
  - { path: "web/layout.css", status: modified, role: ui, module: page, loc: 300, delta: { add: 30, rem: 20 }, planned_change: { intent: "Header layout for the score bug, and the right-column and statistics regions filled instead of empty." } }
  - { path: "web/tokens.css", status: modified, role: ui, module: page, loc: 82, delta: { add: 6, rem: 0 }, planned_change: { intent: "Motion durations for the banner and the pulse as tokens, so the 1.5-second rule is one value." } }
  - { path: "web/pitch.mjs", status: modified, role: ui, module: page, loc: 258, delta: { add: 12, rem: 1 }, planned_change: { intent: "Skip drawing a marker whose position is a parking spot beside the pitch (a sent-off player), mirroring is_parking_spot in crates/engine/src/pitch.rs:161." } }
  - { path: "web/tests/helpers.mjs", status: modified, role: test, module: jstests, loc: 90, delta: { add: 50, rem: 0 }, planned_change: { intent: "A synthetic event burst generator, a stats message factory, a condition message factory, and a hello with a roster." } }
  - { path: "web/tests/match-state.test.mjs", status: new, role: test, module: jstests, loc: 140, delta: { add: 140, rem: 0 }, planned_change: { intent: "Score, feed, statistics, and energy at any tick equal the messages up to that tick; rewind removes later entries; kick-off state is 0 to 0 with no entries; a goal that arrives 400 ticks early stays hidden until the rendered tick reaches it." } }
  - { path: "web/tests/feed.test.mjs", status: new, role: test, module: jstests, loc: 100, delta: { add: 100, rem: 0 }, planned_change: { intent: "A burst of 40 events inside one second at 8x flushes all 40 across frames with none dropped and order preserved; each frame performs one insert." } }
  - { path: "web/tests/stats.test.mjs", status: new, role: test, module: jstests, loc: 90, delta: { add: 90, rem: 0 }, planned_change: { intent: "Every field of a stats message (a factory message and one line captured from a recorded match) appears in the panel model with an equal value." } }
  - { path: "web/tests/lineups.test.mjs", status: new, role: test, module: jstests, loc: 70, delta: { add: 70, rem: 0 }, planned_change: { intent: "Every fatigue band maps to a state word; no band returns a colour without a word; a substitution swaps the row to the named bench entry." } }
  - { path: "web/tests/pitch.test.mjs", status: new, role: test, module: jstests, loc: 40, delta: { add: 40, rem: 0 }, planned_change: { intent: "The parking-spot test accepts all 22 parking spots and rejects points on the pitch." } }
  - { path: "crates/protocol/src/message.rs", status: modified, role: domain, module: protocol, loc: 300, delta: { add: 75, rem: 2 }, planned_change: { intent: "RosterEntry (player.id, player.name, player.shirt, player.position, player.squad_index) and a roster list on TeamRef; nine stats.* fields as home-first pairs on Stats; a new Condition message (tick, energy with 22 values in wire-slot order) in ServerMessage." } }
  - { path: "crates/protocol/src/lib.rs", status: modified, role: domain, module: protocol, loc: 350, delta: { add: 25, rem: 2 }, planned_change: { intent: "PROTOCOL_VERSION becomes 3 with the reason written in its doc comment (stats changes cadence from once to every simulated second, and a new message type joins); MESSAGES and the exhaustive name test gain condition and the new fields." } }
  - { path: "crates/protocol/tests/document.rs", status: modified, role: test, module: protocol, loc: 90, delta: { add: 10, rem: 0 }, planned_change: { intent: "The document test covers the new condition section and the new stats and roster fields." } }
  - { path: "docs/reference/protocol.md", status: modified, role: docs, module: protocol, loc: 230, delta: { add: 45, rem: 3 }, planned_change: { intent: "Version 3; the hello roster table; stats sent once per simulated second and once more at full time with the nine fields; a new condition section." } }
  - { path: "crates/engine-cli/src/serve.rs", status: modified, role: service, module: engine, loc: 125, delta: { add: 6, rem: 16 }, planned_change: { intent: "Create the simulation before the hello and build the hello teams through the shared helper, so the roster reflects the pre-match lineup." } }
  - { path: "crates/engine-cli/src/record.rs", status: modified, role: service, module: engine, loc: 92, delta: { add: 5, rem: 14 }, planned_change: { intent: "The same order and helper as serve, so a recorded match file carries the same roster." } }
  - { path: "crates/engine-cli/src/bench.rs", status: modified, role: service, module: engine, loc: 200, delta: { add: 3, rem: 14 }, planned_change: { intent: "The benchmark hello uses the shared helper." } }
  - { path: "crates/engine-cli/src/stream_run.rs", status: modified, role: service, module: engine, loc: 320, delta: { add: 80, rem: 10 }, planned_change: { intent: "A shared hello_teams(sim) helper; a stats message built from sim.summary() and MatchFigures::new (the same rounding as the match-stats record) sent once per simulated second and once at full time; a condition message with each player's energy, rounded to three decimals, at the same cadence." } }
  - { path: "crates/stream/tests/common/mod.rs", status: modified, role: test, module: rstests, loc: 230, delta: { add: 12, rem: 0 }, planned_change: { intent: "The test hello and stats literals fill the new fields." } }
  - { path: "crates/stream/tests/fixture.rs", status: modified, role: test, module: rstests, loc: 150, delta: { add: 4, rem: 0 }, planned_change: { intent: "The test hello fills the roster field." } }
