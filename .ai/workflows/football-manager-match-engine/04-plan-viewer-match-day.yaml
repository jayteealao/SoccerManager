risks:
  - { title: "Events arrive ahead of playback", severity: high, body: "The server leads the page by up to 500 ticks; showing an event, a stats message, or a condition message on arrival would announce a goal or a number before the pitch draws it.", mitigation: "Release every message by the rendered tick; a unit test drives a goal that arrives 400 ticks early." }
  - { title: "Protocol version 3 refuses every recorded file made before it", severity: medium, body: "The recorded-file header carries the protocol version and replay refuses a mismatch (crates/stream/src/record.rs:219). No recorded file is tracked in the repository, but any local fixture from an earlier build stops replaying.", mitigation: "Verify records a fresh fixture after the change; the refusal names both versions." }
  - { title: "Periodic messages cost stream throughput and memory", severity: medium, body: "About 5,400 stats and 5,400 condition messages per full match join the 270,000 tick frames on the socket and in recorded files.", mitigation: "Energy rounded to three decimals; the stream throughput and stream peak memory targets are re-measured against the 8.55 MB tripwire." }
  - { title: "Panels steal frame budget", severity: medium, body: "Nine statistics rows, 22 lineup rows, and a feed at 8x.", mitigation: "One flush per frame, only changed nodes written, statistics and energy per released message, never per tick." }
  - { title: "No reduced-motion emulation in the browser tool", severity: medium, body: "The in-app browser exposes colour-scheme emulation only; Playwright is absent.", mitigation: "Proxy through a shared reduced-motion rule plus a deferral cleared by the operator switching Windows animation effects off." }
  - { title: "The lineup editor changes the roster before kick-off", severity: medium, body: "The next viewer slice adds a pre-match hold and a set-lineup command in the same protocol version; the hello roster built here reflects the computer manager's pre-match lineup.", mitigation: "Roster entries carry the squad index so that slice can re-order them; that slice owns telling the page about a changed lineup." }
  - { title: "A later event-contract redesign renames event kinds and raises event volume", severity: medium, body: "docs/design/realism/02-event-contract-redesign.md names this slice as a consumer to migrate.", mitigation: "One exported event-kind table in match-state.mjs beside STOPS_PLAY in web/stoppages.mjs; a feed batcher independent of the event count." }
lanes:
  - { service: page, label: "Page (web/)", files: ["web/match-state.mjs", "web/feed.mjs", "web/scoreboard.mjs", "web/lineups.mjs", "web/stats.mjs", "web/goal-moment.mjs", "web/main.mjs"] }
  - { service: engine, label: "Engine and protocol", files: ["crates/protocol/src/message.rs", "crates/protocol/src/lib.rs", "crates/engine-cli/src/serve.rs", "crates/engine-cli/src/record.rs", "crates/engine-cli/src/stream_run.rs"] }
