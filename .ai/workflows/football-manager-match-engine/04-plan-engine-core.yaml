risks:
  - { id: R1, severity: high, title: "Benchmark misses 2 seconds at 50 decisions per second", body: "The PO chose decisions every tick. Perception checks for 22 agents per tick are the dominant cost.", mitigation: "Step 15 measures early; a miss reopens the decision rate and the tick rate with the PO (NFR-1 yields to C2). Levers in order: decision interval, spatial grid, fewer pass candidates." }
  - { id: R2, severity: medium, title: "Byte-identical output breaks", body: "HashMap iteration, unordered pair loops, or a transcendental call that differs between builds.", mitigation: "No HashMap on the simulation path; pairwise loops by index; the determinism test runs on every verify; document the same-machine, same-build, same-CRT boundary." }
  - { id: R3, severity: medium, title: "Steering oscillation around anchors", body: "Agents overshoot targets and the validator's anchor tolerance fails.", mitigation: "Arrive radius and damping in tuning; the validator test tunes them before the milestone." }
  - { id: R4, severity: low, title: "crates.io unreachable at first build", body: "The sandboxed shell got HTTP 403 from crates.io; serde_json and glam are not cached.", mitigation: "Cargo uses its own fetch path; if it fails, implement records the wall and falls back to cached versions (rand 0.8.5, clap 4.5.60) with the API differences noted." }
  - { id: R5, severity: low, title: "Partial tick file after an abort", body: "A killed simulate leaves a file with a header and no trailer.", mitigation: "The reader fails closed on a missing trailer or a count mismatch; the dark-path signal in 04b-instrument.md covers it." }
