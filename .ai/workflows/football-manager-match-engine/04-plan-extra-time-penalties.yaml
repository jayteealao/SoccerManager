risks:
  - { title: "A shoot-out kick never ends", severity: medium, body: "An on-pitch kick depends on the ball reaching an outcome; a taker who regains the ball, or a keeper who never gains it, could stall a kick.", mitigation: "Only the defending keeper may gain the ball during a kick; a 5-second live cap ends the kick as a miss; a 100-round safety cap ends a runaway shoot-out with an error signal." }
  - { title: "A missed field breaks resume in extra time or the shoot-out", severity: medium, body: "Every shoot-out kick is a stoppage, and a snapshot is captured at each; any state not stored makes a resumed match drift.", mitigation: "Snapshot version 4 stores the shoot-out state; continuation tests from the break and from a kick." }
  - { title: "The default match changes by accident", severity: medium, body: "One extra draw, a reordered branch, or the shot-kick extraction changes every tick file.", mitigation: "Tosses only when extra time and the shoot-out start; shot_kick() consumes draws in the same order; the unchanged determinism test is the gate." }
  - { title: "Sudden death runs past the announced maximum", severity: low, body: "The allowance covers 10 rounds; a longer sudden death streams more ticks than announced.", mitigation: "The product owner accepted this (option B); the page history already grows, the scrubber follows the newest tick, and the drive loop continues during the shoot-out." }
  - { title: "Knockout matches are longer", severity: low, body: "The announced maximum rises to 530,000 ticks, about 50 MB of page history.", mitigation: "Only when --knockout is set; the default match and the benchmark are unchanged." }
