  - { path: "e2e/tests/charter-scenario.spec.mjs", status: new, role: test, module: e2e, loc: 260, delta: { add: 260, rem: 0 }, imports: [engine], planned_change: { intent: "The twelve-step manager scenario against the live engine with the league generated from seed 2026: one test.step per scenario step, one screenshot per step, each step's checkpoint asserted through the page and window.__touchline. Step 12 runs headless engine-cli matches and reads events.jsonl for the AI tactical change." } }
  - { path: "e2e/tests/pitch.spec.mjs", status: new, role: test, module: e2e, loc: 150, delta: { add: 150, rem: 0 }, imports: [engine], planned_change: { intent: "Frame-time counter at 1x over five match minutes with zero dropped ticks; clock at 4x within 2 percent of four times wall time; lag notice at 8x against replay --sustain 3 and no notice against --sustain 8; rewind frame equals the stored tick." } }
  - { path: "e2e/tests/match-day.spec.mjs", status: new, role: test, module: e2e, loc: 150, delta: { add: 150, rem: 0 }, imports: [engine], planned_change: { intent: "Goal moment updates score, banner, feed, and commentary within one frame of the goal tick; empty-state feed text and 0 to 0 at kick-off; fatigue marker carries a word; reduced-motion banner appears without motion (page.emulateMedia)." } }
  - { path: "e2e/tests/lineup-tactics.spec.mjs", status: new, role: test, module: e2e, loc: 200, delta: { add: 200, rem: 0 }, imports: [engine], planned_change: { intent: "Illegal lineups disable kick-off with the reason; mentality chip Queued to Applied with the feed line; substitution applies, swaps, and decrements; the sixth substitution shows the engine's reason; a role change while paused applies at the next dead ball; keyboard-only reachability with a visible focus ring per control." } }
  - { path: "e2e/tests/reports-recovery.spec.mjs", status: new, role: test, module: e2e, loc: 200, delta: { add: 200, rem: 0 }, imports: [engine], planned_change: { intent: "Kill the engine mid-match and restart from the last stoppage with the same score and clock; socket drop without a crash reconnects with no prompt; half-time report equals feed event counts; full-time save replay writes a file (page.waitForEvent('download')) that reloads with no engine; the first-run state when the engine path is wrong." } }
  - { path: "e2e/tests/observability.spec.mjs", status: new, role: test, module: e2e, loc: 110, delta: { add: 110, rem: 0 }, imports: [engine], planned_change: { intent: "A browser-driven 10-minute match: events.jsonl exists and has grown by the first stoppage; within 2 seconds of the full-time message stats.json parses as record.kind match-stats and every events.jsonl line parses as record.kind match-event, both at the build's schema.version, with owner.id and match.id equal to the page's." } }
  - { path: "e2e/README.md", status: new, role: docs, module: e2e, loc: 90, delta: { add: 90, rem: 0 }, planned_change: { intent: "How to install and run the browser suite; a table from every interactive viewer behaviour to its spec and test title, or to its human check; the three human checks written out with their pass criteria." } }
