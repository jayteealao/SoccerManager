risks:
  - { title: "A late performance miss on the complete engine", severity: high, body: "The engine at the last measured build takes about 390 ms per match on one thread (bench-baseline, match-rules). The tactics AI and commentary slices still add work to every tick. NFR-1 yields-to C2.", mitigation: "Capture the benchmark before and after this slice's work; a miss of the 2-second or 30-minute budget stops the slice and reopens the tick rate with the product owner. The plan never lowers the per-tick model." }
  - { title: "Markup the suite binds to is still unwritten", severity: medium, body: "Three viewer plans are awaiting product-owner answers on the squad, lineup, and tactics contracts, so their roles and labels are not final.", mitigation: "Specs locate controls by accessible role and name and read state through window.__touchline, never by CSS class; the spec for each behaviour is written after its slice is verified." }
  - { title: "Headless frame timing may not represent a real display", severity: medium, body: "Headless Chromium paces requestAnimationFrame without a display.", mitigation: "The frame-rate spec asserts the page's own counter and zero dropped ticks; when headless pacing is unrepresentative it runs in the headed project, and the in-app browser drive stays the recorded evidence." }
  - { title: "No slice owns the viewer's own session record", severity: low, body: "The observability contract plans a viewer-session record from the page; no slice definition names it. This slice's criterion covers the statistics record and the event stream only.", mitigation: "Out of this slice's scope; recorded for the driver so it is not lost." }
