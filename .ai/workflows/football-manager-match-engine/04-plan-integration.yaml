  - { path: "docs/explanation/engine.md", status: new, role: docs, module: docs, loc: 160, delta: { add: 160, rem: 0 }, planned_change: { intent: "Explanation for a maintainer: the agent model, the 50-tick loop, the referee, the stoppage-gated change queue, the snapshot, the seedable generator, and why determinism is best-effort and same-machine only. No step-by-step tasks." } }
