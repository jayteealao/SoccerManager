files:
  - { path: "content/tactics.json", status: new, role: data, module: content, loc: 260, delta: { add: 260, rem: 0 }, planned_change: { intent: "schema_version 1. Four formations (4-4-2 with the FORMATION_442 coordinates, 4-3-3, 4-2-3-1, 3-5-2), each eleven slots with x, y, and a position code, slot 0 the goalkeeper. Five mentalities (defensive, cautious, balanced, positive, attacking) with block-depth metres and option-weight offsets. Six instructions with levels: pressing (low, mid, high), width (narrow, normal, wide), tempo (slower, normal, faster), line_height (deep, normal, high), passing_directness (short, mixed, direct), time_wasting (off, on). Roles per position with attribute weights for role fit and decision offsets; three duties (defend, support, attack) with anchor depth and pass-risk offsets. An ai block: default formation, trailing minute 70, leading minute 80, check interval 30 s, fatigue-substitution energy 0.55 from minute 55, one substitution kept for injuries until minute 80." } }
  - { path: "content/tuning.json", status: modified, role: data, module: content, loc: 170, delta: { add: 38, rem: 3 }, planned_change: { intent: "schema_version 2. engine block gains a decision block (option weights and noise), restart_delay_s.drop_ball 20, injury_per_tackle 0.004, injury_per_minute 0.0002. fatigue block rewritten: threshold 0.7, curve points [[1.0,1.0],[0.7,1.0],[0.5,0.92],[0.3,0.82],[0.0,0.65]], drain_base_per_s, drain_effort_per_s, half_time_recovery, recovery_per_day kept." } }
  - { path: "content/rules/default.json", status: modified, role: data, module: content, loc: 36, delta: { add: 1, rem: 2 }, planned_change: { intent: "schema_version 3; substitutions gains windows_exempt [\"half_time\"] so half-time substitutions count toward the limit and use no window." } }
  - { path: "content/README.md", status: modified, role: docs, module: content, loc: 186, delta: { add: 70, rem: 6 }, planned_change: { intent: "tactics.json reference (formations, mentalities, instructions, roles, duties, ai block); the fatigue and injury tuning rows; windows_exempt; the fourteen required attributes; the sentence that the engine does not apply queued changes is removed." } }
  - { path: "crates/engine/src/data/attributes.rs", status: modified, role: domain, module: data, loc: 164, delta: { add: 10, rem: 3 }, planned_change: { intent: "REQUIRED grows from 7 to 14: finishing, vision, decisions, composure, stamina, natural_fitness, injury_resistance join; the refusal test names a missing one." } }
  - { path: "crates/engine/src/data/rules.rs", status: modified, role: domain, module: data, loc: 189, delta: { add: 22, rem: 2 }, planned_change: { intent: "RULES_VERSION 3; Substitutions::windows_exempt: Vec<StoppageKind> with a garde rule that names each kind once; admits(kind, change) helper reading the stoppages list." } }
  - { path: "crates/engine/src/data/tuning.rs", status: modified, role: domain, module: data, loc: 139, delta: { add: 55, rem: 8 }, planned_change: { intent: "TUNING_VERSION 2; FatigueTuning gains threshold, curve (2 to 8 points, energy strictly decreasing, multipliers in 0.3 to 1.0), drain_base_per_s, drain_effort_per_s, half_time_recovery; the doc comment no longer says the engine does not read it." } }
  - { path: "crates/engine/src/data/tactics.rs", status: new, role: domain, module: data, loc: 260, delta: { add: 260, rem: 0 }, planned_change: { intent: "TacticsSchema with garde rules: at least one formation, eleven slots each, slot 0 a GK position, coordinates inside the pitch; mentality and instruction level names unique; every role names at least one position and only schema attributes (cross-file check at Content::load, refusal names file, role, and attribute); ai block ranges." } }
  - { path: "crates/engine/src/data/mod.rs", status: modified, role: domain, module: data, loc: 380, delta: { add: 30, rem: 6 }, planned_change: { intent: "TACTICS_FILE tactics.json; Content gains tactics; the digest runs over four files; the cross-file role-attribute check." } }
  - { path: "crates/engine/src/tactics/mod.rs", status: new, role: domain, module: tactics, loc: 240, delta: { add: 240, rem: 0 }, planned_change: { intent: "Tactics { formation, mentality, instructions, roles: [RoleDuty; 11] } by index into the schema; TacticsPatch (every field optional, roles keyed by player id); TeamPlan: the effective per-team numbers (block depth, press count and distance, width scale, line height, tempo bias, directness, time-wasting factor, per-slot anchor offsets and option offsets) computed once when tactics change, never per tick." } }
  - { path: "crates/engine/src/tactics/change.rs", status: new, role: domain, module: tactics, loc: 330, delta: { add: 330, rem: 0 }, planned_change: { intent: "The stoppage-gated change queue (named mechanism) inside the engine. Change::Tactics(TacticsPatch) and Change::Substitution { off, on } with queue id, team, queued tick. apply_at_stoppage(kind): substitutions first in queue order, then tactics; admission from the rule pack; SubLedger per team (used, windows, exempt windows); verdicts Applied or Rejected with a reason; the conflict rule rejects a tactics change naming a player the same stoppage substituted off." } }
  - { path: "crates/engine/src/ai.rs", status: new, role: domain, module: tactics, loc: 260, delta: { add: 260, rem: 0 }, planned_change: { intent: "The AI manager (named mechanism). pre_match(squad, schema, tactics): greedy best role fit per slot of the default formation, bench of seven with a goalkeeper, balanced mentality. in_match(team, sim) every check interval and on any injury: trailing after minute 70 raises mentality one step and sets pressing high, once per score state; leading after minute 80 lowers it one step and turns time wasting on; injured player replaced by the best bench fit; fatigue substitutions below the energy line from minute 55, keeping one for injuries until minute 80. No random draws. Every choice queues through the same change queue as the human and emits an ai-decision event." } }
  - { path: "crates/engine/src/fatigue.rs", status: new, role: domain, module: tactics, loc: 180, delta: { add: 180, rem: 0 }, planned_change: { intent: "Energy per player from 1.0 down: each tick drains drain_base + drain_effort * (speed / max_speed)^2, scaled by stamina. multiplier(energy, curve) piecewise linear, 1.0 at or above the threshold. Every 50 ticks the effective Derived values (max_speed, max_accel, passing, finishing, decisions, composure) are recomputed from base values times the multiplier. Half-time adds half_time_recovery scaled by natural_fitness. Injury rolls: once per tackle for the tackled player and once per simulated minute per active player, scaled by injury_resistance." } }
  - { path: "crates/engine/src/decision.rs", status: modified, role: domain, module: engine, loc: 370, delta: { add: 190, rem: 110 }, planned_change: { intent: "The scored-options decision layer (named mechanism). The carrier scores pass (each open team-mate), dribble, shoot, clear, and hold; each score is a weighted sum of features (progress, lane, receiver space, distance, goal distance, shot lane, pressure) from the decision block, plus mentality, instruction, role, and duty offsets from TeamPlan, plus noise scaled by the effective decisions and composure values. Highest wins. The shot threshold and the goalkeeper special case become options. Off the ball: press count and distance from pressing, anchors from the plan. decision_interval_ticks stays 1." } }
  - { path: "crates/engine/src/player.rs", status: modified, role: domain, module: engine, loc: 203, delta: { add: 45, rem: 6 }, planned_change: { intent: "Player gains squad (index into the team file), energy, base (the unfatigued Derived); Status gains Injured and SubstitutedOff; Derived gains finishing, vision, decisions, composure, stamina, natural_fitness, injury_resistance scaled 0 to 1." } }
  - { path: "crates/engine/src/team.rs", status: modified, role: domain, module: engine, loc: 251, delta: { add: 70, rem: 12 }, planned_change: { intent: "Team gains tactics, plan, lineup (eleven squad indices), bench (up to seven), and a formation read from the schema; anchor() adds the plan's block depth, line height, width scale, and per-slot duty offset; restore(slot) puts a slot back after a substitute replaces an injured player; FORMATION_442 stays as the 4-4-2 default for tests." } }
  - { path: "crates/engine/src/sim.rs", status: modified, role: domain, module: engine, loc: 615, delta: { add: 150, rem: 20 }, planned_change: { intent: "MatchConfig gains managers ([Ai, Ai] by default), lineups and tactics from the AI pre-match setup, with_manager and with_tactics. Simulation gains the change queue, the AI state, and the fatigue clock. step order: decide or dead-ball, steering, ball, possession (tackle injury roll), referee and clock, fatigue, AI check, change application when this tick opened a stoppage, overlaps. queue_change(team, Change) is public; the AI manager and tests call it. New EngineEventKinds: Substitution, Injury, AiDecision, ChangeApplied, ChangeRejected. Summary gains shots, substitutions, injuries, and changes queued, applied, and rejected. player_ids() reads each roster slot's squad index." } }
  - { path: "crates/engine/src/rules/mod.rs", status: modified, role: domain, module: engine, loc: 462, delta: { add: 40, rem: 2 }, planned_change: { intent: "injure(i): the player leaves play at once (status Injured, parks beside the pitch like a sent-off player, the team reshapes to ten), an injury event, and the referee opens an Injury stoppage with a dropped-ball restart at the ball (or the goalkeeper in the penalty area). A foul in the same tick keeps its free kick; the injury rides that stoppage. The restart delay is multiplied by the time-wasting factor of the restarting team." } }
  - { path: "crates/engine/src/rules/restart.rs", status: modified, role: domain, module: engine, loc: 353, delta: { add: 35, rem: 3 }, planned_change: { intent: "Injury kind: spot at the ball, taker the nearest active player of the team in possession, every other player at least 4 m away (IFAB Law 8), delay drop_ball; the restart event is the injury event already emitted." } }
  - { path: "crates/engine/src/tuning.rs", status: modified, role: domain, module: engine, loc: 237, delta: { add: 60, rem: 0 }, planned_change: { intent: "DecisionWeights sub-struct with garde ranges (progress, lane, space, distance, shot base, shot lane, pressure, clear, hold, noise base, noise decisions, noise composure); RestartDelays::drop_ball; injury_per_tackle and injury_per_minute." } }
