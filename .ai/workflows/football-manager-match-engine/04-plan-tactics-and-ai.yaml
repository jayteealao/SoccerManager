risks:
  - { title: "Processor time per match exceeds the 10 percent tripwire", severity: high, body: "The baseline on 837cb5c is 418.8 ms of processor time per match and 1.4965 us per tick. The decision layer scores more options on every tick for the carrier, and fatigue runs on every tick for 22 players.", mitigation: "TeamPlan is computed once per tactics change; effective attributes refresh every 50 ticks; the AI checks every 30 s; injury rolls run per tackle and per minute. Step 22 measures three drives before the slow tests are finalised. A miss stops the work and goes to the product owner with the levers (decision_interval_ticks, candidate count, fatigue refresh); no lever is pulled silently." }
  - { title: "Team A does not win more than half of 200 matches", severity: high, body: "The stronger-team criterion is judged before calibration. Draws take about a quarter of results, so a small attribute effect fails it.", mitigation: "Finishing, decisions, composure, and vision now reach the decision layer; the test splits home and away. A failure is fixed inside this slice by the decision weights and reported with the win, draw, and loss counts." }
  - { title: "A resumed match drifts after a substitution or a tactics change", severity: high, body: "Energy, squad index, the ledger, the pending queue, and the AI state are new state; one missing field breaks exact continuation.", mitigation: "Snapshot version 2 carries every new field; the continuation test runs past a substitution and a tactics change." }
  - { title: "Decisions become passive or chaotic", severity: medium, body: "Scored options with new offsets can tip play into endless holding or constant shooting (the slice risk).", mitigation: "Hold carries a negative base and a held-time penalty; full_match.rs keeps the possession and idle-ball sanity bands; calibration tunes the weights." }
  - { title: "Injury stoppages lengthen matches", severity: low, body: "An injury opens a stoppage and adds 60 s to the half, so ticks per match grow with the injury rate.", mitigation: "About 0.6 injuries per match by default; ticks per match is reported beside the gate, and a per-match miss explained by match length alone goes to the product owner rather than passing silently." }
  - { title: "Unrelated staged files ride into the commit", severity: low, body: "The index already holds staged design documents from other work and a staged test file deleted from the working tree.", mitigation: "The commit names its paths explicitly so the index entries it did not create stay out." }
