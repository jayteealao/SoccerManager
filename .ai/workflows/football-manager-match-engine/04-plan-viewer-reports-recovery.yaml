  - { path: ".gitignore", status: modified, role: config, module: docs, loc: 4, delta: { add: 1, rem: 0 }, planned_change: { intent: "!web/tests/data/*.smfx so the one-minute golden replay file is tracked." } }
  - { path: "web/replay-file.mjs", status: new, role: ui, module: web, loc: 190, delta: { add: 190, rem: 0 }, planned_change: { intent: "FrameStore: every received frame's bytes in one growing Uint8Array with an index of kind, tick, and offset; truncate(tick). writeReplay(store) builds the .smfx layout (32-byte header, 9-byte entries, 16-byte trailer with the first six bytes of SHA-256 over the payloads through crypto.subtle). readReplay(bytes) fails closed on magic, version, counts, truncation, and hash, naming the check. Seed read from match.id as a BigInt." } }
  - { path: "web/recovery.mjs", status: new, role: ui, module: web, loc: 150, delta: { add: 150, rem: 0 }, planned_change: { intent: "Pure models. loadingSteps(status, socketOpen, firstTick) -> three steps with state words. panelModel(status, lastClose) -> { kind: loading | first-run | reconnecting | crashed | refused | abandoned | none, title, detail, path, actions }; refused and a missing launcher offer abandon only. backoff(attempt) -> 250 ms doubling to 4 s, giving up after 120 s." } }
  - { path: "web/recovery-panel.mjs", status: new, role: ui, module: web, loc: 120, delta: { add: 120, rem: 0 }, planned_change: { intent: "Renders the panel model into the pitch panel: loading step list inside the skeleton, first-run panel with the path in a code element and an Open a replay action, error panel with Restart from mm:ss and Abandon. Focus moves to the panel heading; the live region announces the change." } }
  - { path: "web/launcher.mjs", status: new, role: ui, module: web, loc: 70, delta: { add: 70, rem: 0 }, planned_change: { intent: "status() fetches engine.json with no-store; restart() and abandon() POST with no body; poll(until, interval) resolves on the first status that matches." } }
  - { path: "web/report.mjs", status: new, role: ui, module: web, loc: 160, delta: { add: 160, rem: 0 }, planned_change: { intent: "reportModel(events, uptoTick, teams): per-team counts of goals, yellow and red cards, fouls, corners, offsides, throw-ins, goal kicks, free kicks, penalties, plus a list of goals and cards with minutes, from the same event list the feed renders. showReport(kind) fills a native dialog; half-time pauses the page's playback until Continue; full time offers Save replay and Open a replay." } }
  - { path: "web/components/surfaces.css", status: new, role: ui, module: web, loc: 140, delta: { add: 140, rem: 0 }, planned_change: { intent: "Report dialog, recovery panel, step list, and first-run panel from --tl- tokens only; report titles in the display face; tabular figures on every count; --tl-danger with the word Error, --tl-warning with the word Reconnecting; transitions on opacity and transform only, removed under reduced motion." } }
  - { path: "web/history.mjs", status: modified, role: ui, module: web, loc: 139, delta: { add: 14, rem: 0 }, planned_change: { intent: "truncate(tick): the history ends at tick; a later append continues from tick + 1; a resume tick past the newest tick records a gap that tickAt reports as absent." } }
  - { path: "web/stoppages.mjs", status: modified, role: ui, module: web, loc: 81, delta: { add: 8, rem: 0 }, planned_change: { intent: "truncate(tick) drops marks after the resume tick." } }
  - { path: "web/socket.mjs", status: modified, role: ui, module: web, loc: 81, delta: { add: 25, rem: 4 }, planned_change: { intent: "onClose receives { clean, code } so a close frame (1000, 1001) and an abnormal closure (1006) differ; onRaw hands the frame bytes to the frame store; signal viewer.socket_drops keeps its keys." } }
  - { path: "web/main.mjs", status: modified, role: ui, module: web, loc: 270, delta: { add: 170, rem: 20 }, planned_change: { intent: "Replace the error stub with the recovery flow; poll the launcher during start; on abnormal close reconnect with backoff while the launcher says running, else show the panel; on a hello with the same match.id treat the first tick T+1 as the resume point and truncate history, stoppages, events, and the frame store to T; half-time and full-time reports by rendered tick; replay save and open; a file-mode source that feeds the same onHello, onTick, and onMessage with no socket. The test hook gains read-only recovery(), report(), replay(), and events()." } }
