risks:
  - { title: "A resumed match shows a different score or loses events", severity: high, body: "Events are not stored in the snapshot. If the page did not receive the events of the stoppage tick, or the persisted snapshot lies past the newest tick the page holds, the resumed stream cannot resend them.", mitigation: "The snapshot on disk is only the newest one below the tick the socket thread has written, so the page holds every event at or before it; the reconnect path picks the newest retained snapshot at or below that tick; a residual gap is recorded as viewer.resume_gap and skipped, never drawn." }
  - { title: "Restart duplicates match state", severity: high, body: "The page could keep ticks or events past the resume point and show them twice.", mitigation: "The page truncates history, stoppages, events, and the frame store to the resume tick before it appends the first resumed frame; history.test and the launcher test assert it." }
  - { title: "A launcher route is reachable from another web page", severity: medium, body: "Restart and abandon are side-effecting HTTP routes on a loopback port.", mitigation: "POST only, Origin must equal the page's own origin, empty body, no parameters; a foreign origin gets 403 and a test asserts it." }
  - { title: "A process watcher misreads a clean exit as a crash on Windows", severity: medium, body: "The worker's exit code is the only signal; a killed process reports a nonzero code.", mitigation: "Exit code 0 is finished; everything else while a match is running is crashed; the launcher test kills a real worker and asserts the state." }
  - { title: "Sibling viewer slices change main.mjs and the event list first", severity: medium, body: "viewer-match-day and viewer-lineup-tactics both change web/main.mjs and add the event reducer this report reads, and both plans await product-owner input.", mitigation: "Implement after both land; re-run plan in auto-review mode first so steps 14 to 20 bind to the landed module names." }
