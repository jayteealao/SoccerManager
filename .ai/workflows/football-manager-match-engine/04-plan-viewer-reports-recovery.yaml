files:
  - { path: "crates/engine-cli/src/launch.rs", status: new, role: cli, module: cli, loc: 330, delta: { add: 330, rem: 0 }, imports: [std::process, engine::Snapshot], planned_change: { intent: "engine-cli launch: owns the page server and one engine worker process at a time. States starting, running, not-found, crashed, refused, finished, abandoned. Spawns `serve --reconnect-wait 120 --match-millis <ms>` from the configured engine path; reads the port from the worker's first stdout line; a watcher thread maps the exit to finished (code 0) or crashed (any other code or no code); restart pre-checks the snapshot with Snapshot::read and spawns `serve --resume <snapshot>`; abandon kills the worker. Emits launch.* signals." } }
  - { path: "crates/engine-cli/src/cli.rs", status: modified, role: cli, module: cli, loc: 191, delta: { add: 60, rem: 0 }, planned_change: { intent: "Launch(LaunchOpts): seed, minutes, team files, --web DIR (required), --engine FILE (else SM_ENGINE_PATH, else this executable), hidden --drop-client-at TICK. ServeOpts gains --resume FILE, --reconnect-wait SECONDS (default 0, today's behaviour), hidden --match-millis and --drop-client-at. Help lines under 80 columns." } }
  - { path: "crates/engine-cli/src/main.rs", status: modified, role: cli, module: cli, loc: 47, delta: { add: 3, rem: 0 }, planned_change: { intent: "mod launch; dispatch Command::Launch." } }
  - { path: "crates/engine-cli/src/serve.rs", status: modified, role: cli, module: cli, loc: 159, delta: { add: 140, rem: 40 }, planned_change: { intent: "Build the match fresh or from --resume (identity, seed, minutes, and owner from the snapshot, as resume.rs does). Loop: accept, start a session, drive; a clean close or full time ends the run as today; an abnormal drop with --reconnect-wait > 0 rebuilds the simulation from the newest retained snapshot and waits for the next client. Snapshots go through the gated sink. The event writer opens in resume mode after a restart or a drop." } }
  - { path: "crates/engine-cli/src/web.rs", status: modified, role: cli, module: cli, loc: 324, delta: { add: 90, rem: 15 }, planned_change: { intent: "start() takes a status source instead of a fixed port; /engine.json adds engine.state, engine.path, engine.reason, engine.pid, snapshot.tick, match.id and keeps socket.port and protocol.version. POST /engine/restart and POST /engine/abandon are served only when the Origin header equals the page's own origin; every other POST answers 405 and a foreign origin 403." } }
  - { path: "crates/engine-cli/src/stream_run.rs", status: modified, role: cli, module: cli, loc: 166, delta: { add: 12, rem: 3 }, planned_change: { intent: "Driven gains client_gone so serve can tell a departed client from the tick cap; no change to the event mapping." } }
  - { path: "crates/stream/src/session.rs", status: modified, role: domain, module: stream, loc: 552, delta: { add: 60, rem: 12 }, planned_change: { intent: "MatchState gains sent_tick, set by the socket thread after a tick frame is written; the pump returns SessionEnd::Closed | Dropped | Done so a close frame and an abnormal drop differ; SessionConfig gains drop_at: Option<u32>, a test seam that shuts the TCP stream without a close frame once that tick is written." } }
  - { path: "crates/stream/src/snapshots.rs", status: new, role: domain, module: stream, loc: 120, delta: { add: 120, rem: 0 }, imports: [engine::Snapshot], planned_change: { intent: "GatedSnapshots: a TickSink that captures a Snapshot at every stoppage into a ring of 16, and writes the newest captured snapshot whose tick is below MatchState::sent_tick to snapshot.smsn with Snapshot::write_atomic. Same file, same layout, same location. newest_at_or_below(tick) serves the in-process reconnect." } }
  - { path: "crates/stream/src/events.rs", status: modified, role: domain, module: stream, loc: 148, delta: { add: 35, rem: 0 }, planned_change: { intent: "EventWriter::resume(data_dir, match_id, tick) keeps the rows whose tick is at or below the resume tick, rewrites the file atomically, then appends, so a resumed match never duplicates or loses an event row." } }
  - { path: "crates/stream/src/lib.rs", status: modified, role: domain, module: stream, loc: 134, delta: { add: 3, rem: 0 }, planned_change: { intent: "pub mod snapshots; re-export GatedSnapshots and SessionEnd." } }
  - { path: "crates/stream/tests/reconnect.rs", status: new, role: test, module: stream-tests, loc: 140, delta: { add: 140, rem: 0 }, planned_change: { intent: "A dropped session reports Dropped and a close frame reports Closed; sent_tick follows the written frames; GatedSnapshots never persists a snapshot beyond sent_tick and keeps 16 at most; EventWriter::resume keeps rows at or below the tick." } }
  - { path: "crates/engine-cli/tests/launch.rs", status: new, role: test, module: cli-tests, loc: 260, delta: { add: 260, rem: 0 }, planned_change: { intent: "Missing engine path: engine.json reports not-found with the path. Kill the worker after a stoppage: state crashed; POST restart: state running on a new port, same match.id, first tick is snapshot.tick + 1, and the score in the resumed events equals the score before the kill. Corrupt snapshot: state refused and the reason names the failed check. Abandon: state abandoned and no worker alive. Foreign-origin POST: 403." } }
  - { path: "crates/engine-cli/tests/stream_cli.rs", status: modified, role: test, module: cli-tests, loc: 200, delta: { add: 60, rem: 0 }, planned_change: { intent: "serve --reconnect-wait 30 --drop-client-at 3000: the client sees the drop, reconnects on the same port, receives the same hello, and the first tick is at or below the last tick it held plus one; the existing mid-match close test stays unchanged." } }
  - { path: "crates/engine-cli/tests/web_cli.rs", status: modified, role: test, module: cli-tests, loc: 190, delta: { add: 30, rem: 2 }, planned_change: { intent: "engine.json under serve --web reports engine.state running and the old two keys; POST to any path under serve --web answers 405." } }
  - { path: "crates/engine-cli/tests/cli_args.rs", status: modified, role: test, module: cli-tests, loc: 120, delta: { add: 10, rem: 0 }, planned_change: { intent: "launch --help lines stay under 80 columns; hidden flags do not appear in help." } }
  - { path: "docs/reference/protocol.md", status: modified, role: docs, module: docs, loc: 260, delta: { add: 40, rem: 3 }, planned_change: { intent: "engine.json section: the new keys and states, the two POST routes and the origin rule; the stale protocol.version 1 example corrected to 2; a Reconnection section stating that the hello repeats with the same match.id and the first frame after it is a keyframe one tick past the resume stoppage. No message or field changes; PROTOCOL_VERSION stays 2." } }
