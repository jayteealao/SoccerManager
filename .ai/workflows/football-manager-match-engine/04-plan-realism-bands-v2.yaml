risks:
  - { title: "A full run takes over an hour", severity: high, body: "--suite all now plays 2,000 plus 55,000 matches: about 74 minutes per seed on the reference machine, and about 6 hours for the five-seed baseline. Every pairing plays 1,000 matches (Q-P8).", mitigation: "Formations run as one suite on one worker pool, so no core waits between pairings; events are written only for outliers when step 11 measures a gain; the tests use --matches 1 and --minutes 5." }
  - { title: "Expected red runs", severity: medium, body: "Calibration exits 2 and the ignored slow test fails until realism-tuning. A reader can mistake this for a defect.", mitigation: "The implement record states the baseline; stderr names each failing band; the product owner accepted this (Q-E4, Q-P3)." }
  - { title: "Content hash moves", severity: medium, body: "Adding formations changes tactics.json, so the content hash changes and a snapshot saved before this slice is refused on resume by its hash.", mitigation: "The refusal is the designed behaviour; implement checks every pinned hash and fixture and re-derives each one on the record." }
  - { title: "Band values cited from local sources", severity: low, body: "Seven of the eleven values are not in 01-engine-realism.md itself; they come from its local Wyscout and StatsBomb outputs under .scratch/out (gitignored).", mitigation: "content/README.md cites each value at its file and line, and names the derivation." }
