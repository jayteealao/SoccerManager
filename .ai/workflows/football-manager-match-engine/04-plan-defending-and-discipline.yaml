  - { path: "crates/engine/src/rules/fouls.rs", status: modified, role: domain, module: rules, loc: 140, delta: { add: 30, rem: 4 }, planned_change: { intent: "foul_chance(tackler, yellows, tuning) multiplies by foul_booked_factor for a booked player; Card::severity() orders yellow < second yellow < red; unit tests." } }
  - { path: "crates/engine/src/rules/restart.rs", status: modified, role: domain, module: rules, loc: 463, delta: { add: 25, rem: 12 }, planned_change: { intent: "taker() takes the team's own end from its attack direction, not from the parked keeper's position; the goal-kick and dropped-ball keeper, the outfield-only filter, the kick-off preference and the penalty keeper place use the acting keeper; tests." } }
