files:
  - { path: "crates/engine/src/team.rs", status: modified, role: domain, module: team, loc: 398, delta: { add: 120, rem: 20 }, planned_change: { intent: "Team::keeper_slot() (slot 0 when active, else the first active goalkeeper by squad position, else the most advanced active outfield slot); the acting keeper leaves its line; a lone survivor keeps its own y; the back line is at most (n - 1) x back_line_gap wide; Team::pressers() gives one fewer presser per player out of play (at least 1); anchor() treats the acting keeper's slot as the keeper; unit tests, including the re-derived lone-striker assertion." } }
  - { path: "crates/engine/src/decision.rs", status: modified, role: domain, module: play, loc: 611, delta: { add: 110, rem: 25 }, planned_change: { intent: "Pressers target the intercept point of the carrier (closed-form, capped horizon); one back-line defender covers the most advanced central attacker goal-side by cover_distance; every slot-0 keeper test (pressers, chaser, shot lane, carrier options, shot target keeper) uses the acting keeper." } }
  - { path: "crates/engine/src/sim.rs", status: modified, role: domain, module: play, loc: 1157, delta: { add: 30, rem: 8 }, planned_change: { intent: "Simulation::keeper(team) helper; the keeper reach and catch and shots on target use the acting keeper; a tackler inside its foul cooldown makes no tackle attempt; foul_chance reads the tackler's bookings." } }
  - { path: "crates/engine/src/player.rs", status: modified, role: domain, module: play, loc: 249, delta: { add: 4, rem: 0 }, planned_change: { intent: "Player gains foul_ready (the tick from which the player may tackle again), 0 at kick-off." } }
