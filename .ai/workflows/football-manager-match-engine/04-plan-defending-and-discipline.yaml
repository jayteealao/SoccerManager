risks:
  - { title: "Formations far outside the 4.0 limit today", severity: high, body: "At 2089ed7 seed 42, seven of the nine pairings against 4-4-2 have a side above 4.0 goals per match: 4-4-1-1 11.60, 3-4-3 8.48, 5-4-1 7.62, 4-3-3 7.43, 4-1-4-1 5.18, 4-2-3-1 4.78, and 4-4-2 itself 4.59 against 3-5-2.", mitigation: "Cover, intercept pressing and the back-line gap are tuned with the formations scene as the loop; if a pairing still fails after the three mechanisms are tuned inside their bounds, implement stops and reports the pairing rather than widening the limit." }
  - { title: "Every seeded result moves", severity: medium, body: "New draws and new play move full_match.rs, strength.rs, mentality.rs, ai_trailing.rs, the team.rs lone-striker assertion and the rules tests.", mitigation: "Each moved expectation is re-derived from a run and recorded in the implement record with before and after values; no assertion is loosened silently." }
  - { title: "Goals fall below the band", severity: medium, body: "About 23% of goals come from red-card chaos, and keeper_catch_chance 0.86 was tuned on top of it.", mitigation: "Accepted by the product owner (Q-E4): the band misses are recorded against the realism-bands-v2 baseline; realism-tuning retunes." }
  - { title: "Per-tick cost of the cover search", severity: medium, body: "The cover search and the intercept solve run every tick.", mitigation: "One pass over at most 11 opponents and one quadratic per presser; the benchmark gate is 1.6228 us per tick (+10 percent)." }
  - { title: "Validator drift rule", severity: low, body: "A covering defender far from its anchor while the ball is far away could trip anchor_tolerance.", mitigation: "Cover applies only while the opponents hold the ball and the attacker is in the defending team's half; the full-match validator test must still read 0 violations." }
