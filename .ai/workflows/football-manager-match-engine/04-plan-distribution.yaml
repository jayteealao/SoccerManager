risks:
  - { title: "Clean machine lacks the Visual C++ runtime", severity: high, body: "target/release/engine-cli.exe imports VCRUNTIME140.dll (checked this run).", mitigation: "Step 1 links the C runtime statically for the Windows target; the sandbox smoke run is the proof." }
  - { title: "Linux archive needs glibc 2.39 or newer", severity: medium, body: "The archive is built in WSL Ubuntu 24.04, whose glibc is 2.39 (checked this run). Older distributions refuse to start the binary.", mitigation: "packaging/README.md states the minimum; the smoke records ldd output; a static musl build is a later option." }
  - { title: "macOS is not built in this slice", severity: medium, body: "No Mac, Apple SDK, or linker is available (clang and zig absent).", mitigation: "Pre-registered deferral: an operator with a Mac or a macOS CI runner runs packaging/unix/build.sh and smoke.sh; the scripts name the platform from uname." }
  - { title: "Unsigned installer meets SmartScreen", severity: medium, body: "A downloaded unsigned setup file shows the SmartScreen warning; the sandbox copy carries no download mark, so verify does not reproduce it.", mitigation: "Documented in packaging/README.md; signing is out of scope beyond what the platform requires to run." }
  - { title: "Windows Sandbox unavailable at verify", severity: low, body: "WindowsSandbox.exe is present but was not launched this run.", mitigation: "Fallback chain: Hyper-V VM from the Windows 11 evaluation image, then a pre-registered deferral with a provisionable clearing event." }
