files:
  - { path: ".cargo/config.toml", status: new, role: config, module: build, loc: 6, delta: { add: 6, rem: 0 }, planned_change: { intent: "Link the C runtime statically for x86_64-pc-windows-msvc only (-C target-feature=+crt-static). The current release binary imports VCRUNTIME140.dll, which a clean Windows 11 machine does not carry. The Linux build is not affected." } }
  - { path: "crates/engine-cli/src/cli.rs", status: modified, role: domain, module: cli, loc: 300, delta: { add: 14, rem: 3 }, planned_change: { intent: "On the launcher options added by the reports-and-recovery work: --seed becomes optional (a clock-derived seed, printed to stderr), --web becomes optional (discovered), and --open is added (open the page address in the default browser). Help lines under 80 columns." } }
  - { path: "crates/engine-cli/src/launch.rs", status: modified, role: domain, module: cli, loc: 260, delta: { add: 40, rem: 2 }, imports: ["crate::web"], planned_change: { intent: "Resolve the page folder through web::resolve_web_dir, choose the seed when none is given, and after printing the page address open it when --open is set: cmd /C start on Windows, open on macOS, xdg-open elsewhere. A failed open is logged and the launcher keeps running. Worker supervision unchanged." } }
  - { path: "crates/engine-cli/src/web.rs", status: modified, role: domain, module: cli, loc: 300, delta: { add: 35, rem: 0 }, planned_change: { intent: "resolve_web_dir(flag): a given flag is used alone; else a set SM_WEB_DIR is used alone; only when neither is set, ./web then the web folder beside the binary, each accepted only when it holds index.html; the refusal names every folder tried. Mirrors ContentDir::resolve (crates/engine/src/data/mod.rs:55). serve --web and replay --web keep their explicit optional path." } }
  - { path: "crates/engine-cli/tests/install_layout.rs", status: new, role: test, module: clitests, loc: 150, delta: { add: 150, rem: 0 }, planned_change: { intent: "Copy the built binary, content/, and web/ into a temp install layout (or use the layout named by SM_INSTALL_UNDER_TEST); run launch --minutes 1 from an unrelated working folder with SM_CONTENT_DIR, SM_WEB_DIR, and SM_ENGINE_PATH cleared; assert the page is served, engine.json reaches state running with a socket port, and a viewer connection receives hello whose engine_version equals --version. A layout without web/ is refused naming both fall-through folders. Runs on Windows and in WSL Linux." } }
  - { path: "crates/engine-cli/tests/release_version.rs", status: new, role: test, module: clitests, loc: 95, delta: { add: 95, rem: 0 }, planned_change: { intent: "engine-cli --version, the hello engine_version read over a real socket, and the workspace version in Cargo.toml are one string; packaging/windows/build.ps1 and packaging/unix/build.sh derive the artifact name from engine-cli --version, never from a literal." } }
  - { path: "packaging/windows/installer.nsi", status: new, role: infra, module: packaging, loc: 120, delta: { add: 120, rem: 0 }, planned_change: { intent: "NSIS 3 MUI2 per-user installer (RequestExecutionLevel user) into $LOCALAPPDATA\\Programs\\SoccerManager: engine-cli.exe, content\\, web\\, both licence files; a Start-menu shortcut that runs engine-cli.exe launch --open; an uninstaller and an HKCU uninstall entry with DisplayVersion = VERSION. VERSION and STAGE come from /D defines." } }
  - { path: "packaging/windows/build.ps1", status: new, role: infra, module: packaging, loc: 70, delta: { add: 70, rem: 0 }, planned_change: { intent: "cargo build --release --locked; read the version from engine-cli --version; stage dist/stage; run makensis /DVERSION /DSTAGE; write dist/SoccerManager-<version>-windows-x64-setup.exe and its .sha256." } }
  - { path: "packaging/windows/smoke.ps1", status: new, role: infra, module: packaging, loc: 150, delta: { add: 150, rem: 0 }, planned_change: { intent: "Runs on the clean machine: silent install (/S), launch the Start-menu shortcut, wait for engine.port and a kick-off record in events.jsonl, headless Edge screenshot of a second launch run, read hello over a WebSocket on the port from engine.json and compare engine_version with the installed --version, write results.json and the screenshots to the evidence folder, uninstall." } }
  - { path: "packaging/windows/run-sandbox.ps1", status: new, role: infra, module: packaging, loc: 60, delta: { add: 60, rem: 0 }, planned_change: { intent: "Write a .wsb with absolute host paths (dist read-only, evidence writable, networking disabled), start Windows Sandbox, wait for results.json, print the verdict. A missing WindowsSandbox.exe exits with the named fallback." } }
  - { path: "packaging/unix/build.sh", status: new, role: infra, module: unixpkg, loc: 60, delta: { add: 60, rem: 0 }, planned_change: { intent: "POSIX sh. cargo build --release --locked -p engine-cli with CARGO_TARGET_DIR outside the Windows target folder; read the version from engine-cli --version; name the platform from uname (linux-x86_64 here; macos-<arch> on a Mac); stage engine-cli, content/, web/ without web/tests/, the licences, and the start script; write dist/SoccerManager-<version>-<platform>.tar.gz and its .sha256 (sha256sum, else shasum -a 256)." } }
  - { path: "packaging/unix/soccermanager", status: new, role: infra, module: unixpkg, loc: 5, delta: { add: 5, rem: 0 }, planned_change: { intent: "Start script at the archive root: exec the engine-cli beside it with launch --open and any extra arguments. The Linux equivalent of the Start-menu shortcut." } }
  - { path: "packaging/unix/smoke.sh", status: new, role: infra, module: unixpkg, loc: 110, delta: { add: 110, rem: 0 }, planned_change: { intent: "Extract the archive into a fresh temporary HOME, run the start script from an unrelated folder with a cleared environment, read the page address, fetch / and poll /engine.json until running with a socket port, check engine.port under $HOME/.local/share/SoccerManager, compare --version with the archive name, record ldd output, then run the install-layout test against the extracted folder (SM_INSTALL_UNDER_TEST) for the hello check. Writes results.json; exits non-zero on any failed check." } }
  - { path: "packaging/README.md", status: new, role: docs, module: packaging, loc: 80, delta: { add: 80, rem: 0 }, planned_change: { intent: "How to build the Windows installer and the Linux archive, what each installs and where, how to run the clean-machine and Linux smoke tests, the minimum glibc of the Linux build, the unsigned-installer SmartScreen note, and the macOS status (not yet built; how an operator with a Mac runs the same scripts)." } }
  - { path: ".gitignore", status: modified, role: config, module: root, loc: 5, delta: { add: 1, rem: 0 }, planned_change: { intent: "Ignore dist/." } }
  - { path: "README.md", status: modified, role: docs, module: root, loc: 120, delta: { add: 16, rem: 0 }, planned_change: { intent: "An Install section: on Windows download the setup file, run it, start Soccer Manager from the Start menu; on Linux extract the archive and run ./soccermanager; engine-cli launch --open for a development build." } }
