artifact: experiment
experiment_type: feature-flag
flag: "flags.<candidate> in content/tuning.json (none shipped)"
framework: "tuning-file flags block (no flag service)"
hypothesis: "A candidate decision or shot model, behind a tuning-file flag, moves the realism bands toward their centres over 1000 paired matches without a dark path, a validator violation, or a single-thread time more than 10 percent slower."
split: "paired: every fixture is played by both arms on the same match seed (1000 matches per suite per arm)"
status: ready
arms:
  - id: control
    description: "Flag off: the current model and the shipped tuning values. Arm folder arms/off/."
    allocated_pct: 50
  - id: treatment
    description: "Flag on: the candidate model (code flag) or the candidate values (overrides). Arm folder arms/on/."
    allocated_pct: 50
guardrails:
  - name: "darkpath.match_without_stats (on arm)"
    threshold: 0
    direction: lower-is-better
    unit: matches
  - name: "darkpath.change_never_applied (on arm)"
    threshold: 0
    direction: lower-is-better
    unit: changes
  - name: "validate.violations (on arm)"
    threshold: 0
    direction: lower-is-better
    unit: violations
  - name: "bench.match_wall_ms, on arm over off arm"
    threshold: 1.10
    direction: lower-is-better
    unit: ratio
  - name: "stronger-team win rate (on arm, strength suite)"
    threshold: 0.50
    direction: higher-is-better
    unit: share
