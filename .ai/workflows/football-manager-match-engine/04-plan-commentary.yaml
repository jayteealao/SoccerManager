files:
  - { path: "content/commentary/en.json", status: new, role: data, module: content, loc: 260, delta: { add: 260, rem: 0 }, planned_change: { intent: "schema_version 1, language en; one entry per template set { event, when, lines }. Every one of the twelve play event kinds has at least 3 unconditional lines that use only the placeholders the kind always fills; context sets for goals (opener, equaliser, late equaliser, go-ahead, late winner, extends-lead, rout, consolation, own goal, hot form), fouls (advantage, booked offender), cards (yellow, second yellow, red), offside and corner repeats, penalties (late, trailing), kick-offs (start of a half, after a goal), half-time and full time (level, leading, rout). About 110 lines." } }
  - { path: "content/README.md", status: modified, role: docs, module: content, loc: 180, delta: { add: 45, rem: 0 }, planned_change: { intent: "Files table gains commentary/en.json (version 1). New section: the template-set shape, the when keys and their values, every placeholder and the event kinds that fill it, the three-unconditional-lines rule, and the selection order (most specific first, no line repeated inside ten minutes of play for the same kind)." } }
  - { path: "crates/engine/src/commentary/mod.rs", status: new, role: domain, module: commentary, loc: 200, delta: { add: 200, rem: 0 }, imports: [tracing], planned_change: { intent: "MatchNames { teams: [String; 2], players: Vec<String> } in roster order; Commentator::for_match(&Commentary, &Simulation) reads names, the match length, and the seed; line(&EngineEvent) -> String keeps a per-kind history, picks the most specific template set whose conditions hold and whose placeholders are filled, rotates inside a set from a seed-derived start, skips a line used for the same kind inside the last ten minutes of play, and falls back to the least recently used line; fallbacks() counts events no set could fill and each one emits the tracing signal commentary.fallback. No engine random draw is consumed." } }
  - { path: "crates/engine/src/commentary/templates.rs", status: new, role: domain, module: commentary, loc: 220, delta: { add: 220, rem: 0 }, imports: [serde, garde], planned_change: { intent: "CommentaryFile { schema_version, language, templates: Vec<TemplateSet> }, TemplateSet { event, when: When, lines }, When { minute, score, form, repeat, card, advantage, own_goal } with deny_unknown_fields; garde custom validators in the every_kind_once idiom: every placeholder is known, every placeholder is one the event kind can fill, every kind has at least 3 unconditional lines using only its guaranteed placeholders, no stray brace; Commentary::load(&ContentDir) through data::load_json with COMMENTARY_VERSION 1." } }
  - { path: "crates/engine/src/commentary/context.rs", status: new, role: domain, module: commentary, loc: 170, delta: { add: 170, rem: 0 }, planned_change: { intent: "Situation::of(event, history, match minutes, rules halves): minute band (early before one sixth of the match, late from eight ninths of the match or in added time of the last half, added-time, first-half, second-half); score states from the event team's side (level, leading, trailing; for a goal also opener, equaliser, go-ahead, extends-lead, rout at a lead of 3 or more, consolation); form (hot: the team scored 2 or more in the last sixth of the match; cold: conceded 2 or more; booked: the offender already holds a yellow); repeat (first, again inside ten minutes, streak of 3 or more inside ten minutes); own goal when the scorer's club is not team.id. Pure functions." } }
  - { path: "crates/engine/src/commentary/render.rs", status: new, role: domain, module: commentary, loc: 90, delta: { add: 90, rem: 0 }, planned_change: { intent: "placeholders(line) -> Vec<&str> for validation and fill(line, &Values) -> Option<String> for output: a single left-to-right scan of {name} tokens; None when a token has no value, so no line with an unfilled placeholder can leave the generator. Placeholders: player, other_player, team, opponent, home, away, home_score, away_score, score, minute, added_minutes." } }
  - { path: "crates/engine/src/lib.rs", status: modified, role: domain, module: engine, loc: 60, delta: { add: 2, rem: 0 }, planned_change: { intent: "pub mod commentary; re-export Commentary and Commentator." } }
  - { path: "crates/engine/src/data/mod.rs", status: modified, role: domain, module: engine, loc: 300, delta: { add: 4, rem: 0 }, planned_change: { intent: "COMMENTARY_FILE = \"commentary/en.json\". The commentary file stays out of Content and out of the content digest, so a text change never refuses a snapshot or changes content.hash." } }
  - { path: "crates/engine/src/sim.rs", status: modified, role: domain, module: engine, loc: 620, delta: { add: 45, rem: 2 }, planned_change: { intent: "EngineEventKind::ALL and code() in the protocol spelling; Simulation gains last_kicker: Option<usize>, set in apply_kick, None in blank() so a resumed match starts with none; player_names() in roster order; seed() and minutes() accessors for the commentator. A unit test asserts last_kicker is None at every announced stoppage of the seed-42 match, which is why the snapshot layout does not change." } }
  - { path: "crates/engine/src/rules/mod.rs", status: modified, role: domain, module: engine, loc: 460, delta: { add: 10, rem: 3 }, planned_change: { intent: "goal() names the last kicker as the event player (a player of the other club means an own goal); open_dead_ball() names the taker on the restart event and clears last_kicker; place_kick_off() picks the kicker before it pushes the kick-off event, names it, and clears last_kicker. No random draw is added or moved." } }
  - { path: "crates/engine/src/team.rs", status: modified, role: domain, module: engine, loc: 200, delta: { add: 4, rem: 0 }, planned_change: { intent: "Team gains player_names: Vec<String> in file order beside player_ids, filled by from_file. The snapshot does not store teams' identity fields, so its layout is unchanged." } }
  - { path: "crates/engine/tests/commentary.rs", status: new, role: test, module: engine-tests, loc: 260, delta: { add: 260, rem: 0 }, planned_change: { intent: "AC-1 every kind in EngineEventKind::ALL, as a scripted event, gives a line that holds the player's name and the club name (both clubs at half-time and full time), and every event of the seed-42 match does the same; AC-2 five events of each kind inside ten minutes give at least three distinct lines; AC-3 a goal that makes it 1-1 in minute 88 gives a line from a set whose when holds equaliser and late, and a goal that makes it 4-0 in minute 20 gives a line from a set whose when holds rout; AC-4 the seed-42 90-minute match gives no line with a brace and fallbacks() is 0. Loader refusals: a kind with two unconditional lines, an unknown placeholder, other_player in a goal line, and schema_version 2 are each refused naming the kind, placeholder, or version." } }
  - { path: "crates/protocol/src/event.rs", status: modified, role: contract, module: protocol, loc: 360, delta: { add: 20, rem: 0 }, planned_change: { intent: "MatchEvent gains commentary: Option<String> (key commentary, skipped when absent) and a commentary() builder; the round-trip test gains the key." } }
  - { path: "crates/protocol/src/lib.rs", status: modified, role: contract, module: protocol, loc: 340, delta: { add: 6, rem: 0 }, planned_change: { intent: "MESSAGES event field list gains commentary; the PROTOCOL_VERSION comment records that version 2 survives an added optional field under the same judgement version 1 recorded (no field removed, none changed meaning, both producers updated in one commit)." } }
  - { path: "docs/reference/protocol.md", status: modified, role: docs, module: protocol, loc: 170, delta: { add: 4, rem: 1 }, planned_change: { intent: "event table gains commentary (an English line, present on every play event, absent on tactics-change); player.id row now names the scorer on goal (the defender on an own goal) and the taker on a restart. The document test must pass." } }
  - { path: "crates/engine-cli/src/content.rs", status: modified, role: cli, module: cli, loc: 45, delta: { add: 6, rem: 0 }, planned_change: { intent: "Loaded gains commentary: Commentary, loaded from the same content folder; a missing or invalid file stops the run naming the file and the field." } }
  - { path: "crates/engine-cli/src/stream_run.rs", status: modified, role: cli, module: cli, loc: 190, delta: { add: 30, rem: 2 }, planned_change: { intent: "Drive gains commentary: &Commentary; drive() builds one Commentator per match and attaches its line to every mapped MatchEvent through .commentary(Some(line)). Unit test: a 3-minute match routed to a vector gives an event list in which every message carries a non-empty line." } }
  - { path: "crates/engine-cli/src/bench.rs", status: modified, role: cli, module: cli, loc: 200, delta: { add: 1, rem: 0 }, planned_change: { intent: "Pass &loaded.commentary to Drive so the timed socket path includes the commentary work." } }
  - { path: "crates/engine-cli/src/record.rs", status: modified, role: cli, module: cli, loc: 90, delta: { add: 1, rem: 0 }, planned_change: { intent: "Pass &loaded.commentary to Drive, so recorded fixtures carry the lines." } }
  - { path: "crates/engine-cli/src/serve.rs", status: modified, role: cli, module: cli, loc: 140, delta: { add: 1, rem: 0 }, planned_change: { intent: "Pass &loaded.commentary to Drive, so the live stream and events.jsonl carry the lines." } }
