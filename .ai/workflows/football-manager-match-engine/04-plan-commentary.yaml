risks:
  - { title: "Lines repeat and read as canned", severity: medium, body: "Three unconditional lines per kind is the floor; a match has about 40 throw-ins, so throw-in lines cycle many times.", mitigation: "No line repeats for the same kind inside ten minutes of play while the pool allows it; the rotation start comes from the seed, so two matches open differently; the file is the modding surface and grows without code changes; AC-2 measures distinct lines." }
  - { title: "A goal or restart event carries no player", severity: medium, body: "Goal and restart events name no player today, so AC-1 cannot hold without an engine change.", mitigation: "The engine names the last kicker on a goal and the taker on a restart and kick-off; last_kicker is cleared at every dead ball, so the snapshot layout stays unchanged; a unit test pins the invariant and the full-match test asserts a player on every play event." }
  - { title: "The new optional wire field breaks a strict reader", severity: low, body: "MatchEvent uses deny_unknown_fields, so a Rust reader built before this change refuses an event with commentary.", mitigation: "Both producers and the only Rust reader are in this workspace and change in one commit; the page ignores unknown fields; the version judgement is written beside PROTOCOL_VERSION." }
  - { title: "The tactics slice adds event kinds the file does not cover", severity: low, body: "Substitution and injury events from the tactics slice need their own lines.", mitigation: "The loader requires three unconditional lines for every kind in EngineEventKind::ALL, so a new kind fails the content test until its lines exist; step 7 authors lines for every kind present at implement time." }
  - { title: "Per-tick processor time moves", severity: low, body: "The bench path drives the socket path, which now formats a line per event.", mitigation: "About 400 events per match against about 280,000 ticks; step 1 captures a baseline on the implement-start commit and step 12 compares per tick against it." }
