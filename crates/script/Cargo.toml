[package]
name = "script"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Sandboxed script packs for the football match engine: pack loading, the sandbox, and the hooks"

[dependencies]
engine = { path = "../engine" }
rhai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
garde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
# The skewed test clock of the sandbox. Only this crate's own tests enable it, so no other
# build contains it.
test-clock = []

[dev-dependencies]
criterion = { workspace = true }
tracing-subscriber = { workspace = true }
engine = { path = "../engine", features = ["scenario"] }
script = { path = ".", features = ["test-clock"] }
# The replay file, to check that it carries the watchdog mark (the test clock is this
# crate's own).
stream = { path = "../stream" }

[[bench]]
name = "hook_call"
harness = false
