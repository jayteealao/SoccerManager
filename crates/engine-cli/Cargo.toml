[package]
name = "engine-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Headless command line for the football match engine: simulate and bench"

[[bin]]
name = "engine-cli"
path = "src/main.rs"

[features]
# The rules stage of a change run: the engine's sensitivity rules and the job probe they
# count with. Off by default, so no match of a normal build pays for the probe's count sites;
# build `engine-cli` with `--features sensitivity` to check the rules in `calibrate --base`.
sensitivity = ["engine/sensitivity"]

# The rules stage's own test builds only with the rules.
[[test]]
name = "calibrate_rules"
required-features = ["sensitivity"]

[dependencies]
engine = { path = "../engine" }
protocol = { path = "../protocol" }
script = { path = "../script" }
stream = { path = "../stream" }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
garde = { workspace = true }
sha2 = { workspace = true }

# Below-normal priority for the background matchday's threads and the process affinity mask
# (std counts every core on Windows under an affinity mask and sets no thread priority).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# JSON Schema validation of the records in tests only; the release binary does not link it.
boon = { workspace = true }
