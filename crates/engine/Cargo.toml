[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Headless football match engine: fixed-timestep simulation, tick stream, validator"
build = "build.rs"

[dependencies]
glam = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
garde = { workspace = true }
# The pure-Rust maths backend, selected by the libm-maths feature.
libm = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[features]
# The test scene builder and scripted referee draws. Only this crate's own tests enable it,
# so a release build never contains either.
scenario = []
# Selects the pure-Rust libm maths backend instead of the platform maths library. Off by
# default, so play keeps the platform maths until the one recorded result change.
libm-maths = []
# Test-only: selects the keyed random-stream scheme (scheme 1), one stream per subsystem,
# player, and kind of action, instead of the one shared stream. Off by default; the one
# recorded result change turns it on and then removes it.
keyed-streams = []

[dev-dependencies]
criterion = { workspace = true }
tracing-subscriber = { workspace = true }
engine = { path = ".", features = ["scenario"] }

[[bench]]
name = "tick_step"
harness = false
