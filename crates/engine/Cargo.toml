[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Headless football match engine: fixed-timestep simulation, tick stream, validator"
build = "build.rs"

[dependencies]
glam = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
garde = { workspace = true }
# The pure-Rust maths library every engine sine, cosine, exponent, arctangent, and power uses.
libm = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[features]
default = ["debug-trace"]
# The debug trace's draw recorder, switched on per match at run time. Default on; a build
# with `--no-default-features` leaves it out, for the recorder's cost benchmark.
debug-trace = []
# The test scene builder and scripted referee draws. Only this crate's own tests enable it,
# so a release build never contains either.
scenario = []

[dev-dependencies]
criterion = { workspace = true }
tracing-subscriber = { workspace = true }
trybuild = { workspace = true }
# No default features, so `--no-default-features` also removes the recorder from test and
# bench builds.
engine = { path = ".", default-features = false, features = ["scenario"] }

[[bench]]
name = "tick_step"
harness = false
