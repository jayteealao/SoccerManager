# The engine's sine, cosine, exponent, arctangent, and power come from `libm` through
# `engine::math`, so every machine computes the same bits. These platform maths methods (and
# the glam angle methods built on them) are refused in every engine target: source, tests,
# and benches. `libm::*` calls are allowed.
disallowed-methods = [
    { path = "f64::sin", reason = "use engine::math (libm)" },
    { path = "f64::cos", reason = "use engine::math (libm)" },
    { path = "f64::tan", reason = "use engine::math (libm)" },
    { path = "f64::sin_cos", reason = "use engine::math (libm)" },
    { path = "f64::exp", reason = "use engine::math (libm)" },
    { path = "f64::exp2", reason = "use engine::math (libm)" },
    { path = "f64::exp_m1", reason = "use engine::math (libm)" },
    { path = "f64::ln", reason = "use engine::math (libm)" },
    { path = "f64::ln_1p", reason = "use engine::math (libm)" },
    { path = "f64::log", reason = "use engine::math (libm)" },
    { path = "f64::log2", reason = "use engine::math (libm)" },
    { path = "f64::log10", reason = "use engine::math (libm)" },
    { path = "f64::powi", reason = "use engine::math (libm)" },
