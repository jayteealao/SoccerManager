[package]
name = "stream"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local socket server, fixture recorder, and replayer for the match stream"

[dependencies]
engine = { path = "../engine" }
protocol = { path = "../protocol" }
tungstenite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }

[features]
# Opens the migration chain to the tests that build their own later formats. Only this
# crate's own tests enable it, so no other build contains it.
test-support = []

[dev-dependencies]
stream = { path = ".", features = ["test-support"] }
tracing-subscriber = { workspace = true }
